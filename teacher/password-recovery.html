<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이메일 비밀번호 복구 · TES Speaking</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:#19383c;font-family:system-ui,"Noto Sans KR",sans-serif}.shell{width:min(440px,100%);min-height:100vh;margin:auto;padding:34px 18px}h1{font-size:23px;margin:12px 0 4px}p{color:#698084;font-size:13px}a{text-decoration:none;color:inherit}.option{display:block;background:white;padding:17px;margin:10px 0;border:1px solid #e0e9e9;border-radius:13px;font-weight:600;cursor:pointer}.option:hover{border-color:#2c9396}.tiny{display:block;text-align:center;font-size:12px;color:#84979b;margin-top:25px}input{display:block;width:100%;height:46px;padding:12px;border:1px solid #d5dfdf;border-radius:9px;font-size:17px;margin:16px 0}.btn{display:block;width:100%;background:#238b90;color:white;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer}.note{border:1px solid #d2dddd;background:#fff;border-radius:10px;padding:13px;font-size:12px;line-height:1.6;color:#526467;margin-top:20px}.back{display:block;font-size:13px;color:#60757a;margin-bottom:20px}</style></head><body><main class="shell"><a href="security-login.html" class="back">← 데이터 보안 관리자</a><h1>이메일로 비밀번호 복구</h1><p>등록된 원장 전용 이메일로 인증번호를 보냅니다.</p><button class="btn" id="send">인증번호 발송</button><div class="note" id="message">메일 발송 및 서버 검증 기능은 아직 연결 전입니다. 발송 버튼은 실제 이메일을 보내지 않습니다.</div></main><script>document.getElementById('send').addEventListener('click',()=>document.getElementById('message').textContent='이메일 인증 서버 연결 후 사용할 수 있습니다. 현재 실제 발송은 이루어지지 않았습니다.');</script></body></html>
