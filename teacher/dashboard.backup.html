<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 학습 현황 - TES Speaking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-5);
        }

        .search-box {
            display: flex;
            gap: var(--sp-2);
            margin-bottom: var(--sp-4);
        }

        .search-box input {
            flex: 1;
            padding: var(--sp-3) var(--sp-4);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            font-family: inherit;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--sp-3);
            margin-bottom: var(--sp-5);
        }

        .stat-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--sp-6) var(--sp-4);
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-soft);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: var(--sp-1);
        }

        .stat-card .number span {
            font-size: 1rem;
            font-weight: 500;
        }

        .stat-card .label {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-bottom: var(--sp-2);
        }

        .student-list {
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .student-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--sp-4);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            cursor: pointer;
            transition: all var(--transition);
        }

        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .student-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
            font-size: var(--text-lg);
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 1rem;
        }

        .student-meta {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: 2px;
        }

        .student-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--sp-1);
        }

        .recording-badge {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            padding: var(--sp-1) var(--sp-3);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .recording-badge.has-recording {
            background: var(--correct-pale);
            color: var(--correct-dark);
        }

        .recording-badge.no-recording {
            background: var(--wrong-pale);
            color: var(--wrong);
        }

        .last-activity {
            font-size: var(--text-xs);
            color: var(--text-muted-soft);
        }

        .empty-state {
            text-align: center;
            padding: var(--sp-15) var(--sp-5);
            color: var(--text-muted);
        }

        .academy-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-1);
            background: linear-gradient(135deg, var(--primary), var(--teacher-dark));
            color: white;
            padding: var(--sp-1) var(--sp-3);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--sp-1) var(--sp-3);
            cursor: pointer;
            color: var(--text-muted);
            font-size: var(--text-xs);
            display: flex;
            align-items: center;
            gap: var(--sp-1);
        }

        .logout-btn:hover {
            background: var(--wrong-pale);
            color: var(--wrong);
            border-color: var(--wrong-pale);
        }

        .filter-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sp-2);
            margin-bottom: var(--sp-4);
            background: var(--bg-light);
            padding: var(--sp-1);
            border-radius: var(--radius-lg);
        }

        .filter-tab {
            padding: var(--sp-3);
            border-radius: var(--radius-md);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
            transition: all var(--transition);
        }

        .filter-tab.active {
            background: var(--bg-white);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .cleanup-card {
            background: var(--accent-orange-pale);
            border: 1px solid #FED7AA;
            border-radius: var(--radius-lg);
            padding: var(--sp-4);
            margin-bottom: var(--sp-5);
            display: none;
            align-items: center;
            gap: var(--sp-3);
        }

        .cleanup-btn {
            background: #EA580C;
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: var(--sp-2) var(--sp-4);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: var(--sp-6);
            box-shadow: var(--shadow-lg);
            animation: t-slide-up 0.3s var(--ease);
            width: 90%;
            max-width: 380px;
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div>
                <h1 class="header-title">학생 학습 현황</h1>
                <span class="academy-badge" id="academyBadge" style="display:none;">
                    <i class="ti ti-building"></i>
                    <span id="academyName"></span>
                </span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="refreshData()"><i class="ti ti-refresh"></i></button>
                <a href="mypage.html" class="logout-btn" style="text-decoration:none;">
                    <i class="ti ti-user-circle"></i> 마이페이지
                </a>
            </div>
        </header>

        <div class="content-area" style="padding-bottom: 20px;">
            <!-- Quick Menu (moved to top) -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;">
                <a href="students.html" style="text-decoration: none;">
                    <div
                        style="background: var(--bg-white); border-radius: var(--radius-lg); padding: 16px; text-align: center; box-shadow: var(--shadow-sm);">
                        <i class="ti ti-users" style="font-size: 1.5rem; color: var(--primary);"></i>
                        <p style="margin: 8px 0 0; font-size: 0.8rem; color: var(--text-dark);">학생 관리</p>
                    </div>
                </a>
                <a href="textbooks.html" style="text-decoration: none;">
                    <div
                        style="background: var(--bg-white); border-radius: var(--radius-lg); padding: 16px; text-align: center; box-shadow: var(--shadow-sm);">
                        <i class="ti ti-book" style="font-size: 1.5rem; color: #10B981;"></i>
                        <p style="margin: 8px 0 0; font-size: 0.8rem; color: var(--text-dark);">교재 관리</p>
                    </div>
                </a>
                <a href="classes.html" style="text-decoration: none;">
                    <div
                        style="background: var(--bg-white); border-radius: var(--radius-lg); padding: 16px; text-align: center; box-shadow: var(--shadow-sm);">
                        <i class="ti ti-school" style="font-size: 1.5rem; color: #8B5CF6;"></i>
                        <p style="margin: 8px 0 0; font-size: 0.8rem; color: var(--text-dark);">학습반</p>
                    </div>
                </a>
                <a href="recovery.html" style="text-decoration: none;">
                    <div
                        style="background: var(--bg-white); border-radius: var(--radius-lg); padding: 16px; text-align: center; box-shadow: var(--shadow-sm); border: 1px solid #FED7AA;">
                        <i class="ti ti-arrows-transfer-down" style="font-size: 1.5rem; color: #EA580C;"></i>
                        <p style="margin: 8px 0 0; font-size: 0.8rem; color: var(--text-dark);">녹화 복구</p>
                    </div>
                </a>
            </div>

            <!-- Stats (moved below menu) -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">총 등록 학생</div>
                    <div class="number" id="totalStudents">0<span>명</span></div>
                </div>
                <div class="stat-card">
                    <div class="label" style="color: #4F46E5; font-weight: 600;">총 시험 건수</div>
                    <div class="number" id="totalTests" style="color: #4F46E5;">0<span>건</span></div>
                </div>
            </div>

            <!-- Storage Cleanup Card -->
            <div id="cleanupCard" class="cleanup-card">
                <i class="ti ti-trash" style="font-size: 1.5rem; color: #EA580C; flex-shrink: 0;"></i>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-weight: 600; color: #9A3412; font-size: 0.9rem;">오래된 녹화 정리</div>
                    <div id="oldRecCountText" style="font-size: 0.8rem; color: #EA580C; margin-top: 2px;"></div>
                </div>
                <button class="cleanup-btn" onclick="openCleanupModal()">정리하기</button>
            </div>

            <!-- Cleanup Modal -->
            <div id="cleanupModal" class="modal-overlay">
                <div class="modal-box">
                    <h3 style="margin: 0 0 12px; font-size: 1.1rem; color: var(--text-dark);">오래된 녹화 정리</h3>
                    <p id="cleanupModalDesc" style="margin: 0 0 16px; font-size: 0.9rem; color: var(--text-gray); line-height: 1.5;"></p>
                    <div id="cleanupProgressArea" style="display: none; margin-bottom: 16px;">
                        <div id="cleanupProgressText" style="font-size: 0.9rem; color: var(--primary);"></div>
                        <div style="background: var(--bg-light); border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden;">
                            <div id="cleanupProgressBar" style="background: var(--primary); height: 100%; width: 0%; transition: width 0.3s;"></div>
                        </div>
                    </div>
                    <div id="cleanupButtons" style="display: flex; gap: 8px;">
                        <button id="cancelCleanupBtn" onclick="closeCleanupModal()" style="flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: white; cursor: pointer; font-size: 0.9rem;">취소</button>
                        <button id="confirmCleanupBtn" onclick="runCleanup()" style="flex: 1; padding: 12px; background: #EA580C; color: white; border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; font-weight: 600;">삭제하기</button>
                    </div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab" data-filter="date" onclick="setFilter('date')">
                    <i class="ti ti-calendar-event"></i> 날짜별 보기
                </button>
                <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
                    <i class="ti ti-users"></i> 전체 학생 보기
                </button>
            </div>
            
            <!-- Date Picker (visible in date view) -->
            <div id="datePickerContainer" style="margin-bottom: 16px; display: none;">
                <input type="date" id="datePicker" class="form-input" onchange="renderStudents()" 
                    style="padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; font-family: inherit; color: var(--text-dark); background-color: var(--bg-white);">
            </div>

            <!-- Search (visible in all view) -->
            <div class="search-box" id="searchBoxContainer" style="position: relative; display: block;">
                <i class="ti ti-search" style="position: absolute; left: 16px; top: 16px; color: var(--text-light); font-size: 1.2rem;"></i>
                <input type="text" id="searchInput" placeholder="학생 이름 검색..." oninput="filterStudents()" style="padding-left: 44px; width: 100%;">
            </div>

            <!-- Student List -->
            <div class="student-list" id="studentList">
                <div class="empty-state">
                    <i class="ti ti-loader" style="font-size: 2rem; animation: spin 1s linear infinite;"></i>
                    <p>학생 정보 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        let allStudents = [];
        let studentRecordings = {};
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            // Auth guard: check teacher session
            const { data: session } = await getTeacherSession();
            // console.log('🔍 Dashboard Auth Check:', session); // Debug

            if (!session || !session.user) {
                console.log('❌ No session, redirecting to login');
                window.location.href = 'login.html';
                return;
            }

            // Academy context check
            const academy = getCurrentAcademy();
            if (!academy) {
                window.location.href = 'academy-setup.html';
                return;
            }

            // Show academy badge
            document.getElementById('academyName').textContent = academy.name;
            document.getElementById('academyBadge').style.display = 'inline-flex';

            await loadDashboardData();
            loadOldRecordingCount();
        });

        async function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                await teacherLogout();
                sessionStorage.removeItem('currentAcademy');
                window.location.href = 'login.html';
            }
        }

        async function loadDashboardData() {
            try {
                console.log('📊 Loading dashboard data...');

                const client = await getSupabase();
                console.log('📊 Supabase client:', client ? 'OK' : 'FAILED');

                if (!client) {
                    document.getElementById('studentList').innerHTML = `
                        <div class="empty-state">
                            <p>데이터베이스 연결 실패</p>
                        </div>
                    `;
                    return;
                }

                // Get students (filtered by academy via getStudents)
                const { data: students, error } = await getStudents();

                console.log('📊 Students query result:', { students, error });

                if (error) {
                    console.error('📊 Students query error:', error);
                    throw error;
                }

                allStudents = (students || []).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                console.log('📊 Total students:', allStudents.length);

                // Get recordings for each student
                for (const student of allStudents) {
                    const { data: files, error: filesError } = await client
                        .storage
                        .from('recordings')
                        .list(student.id, { limit: 100 });

                    console.log(`📊 Recordings for ${student.name}:`, files?.length || 0);

                    const recordings = (files || []).filter(f => f.name.endsWith('.webm'));
                    studentRecordings[student.id] = recordings;
                }

                updateStats();
                renderStudents();

            } catch (e) {
                console.error('📊 Dashboard load error:', e);
                document.getElementById('studentList').innerHTML = `
                    <div class="empty-state">
                        <p>데이터를 불러오는데 실패했습니다</p>
                        <p style="font-size: 0.8rem; color: var(--text-light);">${e.message || e}</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const total = allStudents.length;
            let testCount = 0;
            for (const studentId in studentRecordings) {
                testCount += (studentRecordings[studentId] || []).length;
            }

            document.getElementById('totalStudents').innerHTML = total + '<span>명</span>';
            const totalTestsEl = document.getElementById('totalTests');
            if(totalTestsEl) totalTestsEl.innerHTML = testCount + '<span>건</span>';
            
            // Set date picker default to today
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('datePicker');
            if(dateInput && !dateInput.value) {
                dateInput.value = `${y}-${m}-${d}`;
            }
        }

        function renderStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('studentList');

            if (allStudents.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="ti ti-users-group" style="font-size: 3rem; color: var(--text-light);"></i>
                        <p>아직 등록된 학생이 없습니다</p>
                        <p style="font-size: 0.85rem; color: var(--text-gray);">학생이 앱에 로그인하면 자동으로 등록됩니다</p>
                    </div>
                `;
                return;
            }

            if (currentFilter === 'all') {
                let sortedStudents = [...allStudents].map(s => {
                    const recs = studentRecordings[s.id] || [];
                    const lastRec = recs.length > 0 ? recs.sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0] : null;
                    return { ...s, lastRecTime: lastRec ? new Date(lastRec.created_at).getTime() : 0, recs };
                }).sort((a, b) => {
                    if (a.lastRecTime !== b.lastRecTime) return b.lastRecTime - a.lastRecTime;
                    return a.name.localeCompare(b.name, 'ko');
                });

                if(searchTerm) {
                    sortedStudents = sortedStudents.filter(s => s.name.toLowerCase().includes(searchTerm));
                }

                if (sortedStudents.length === 0) {
                     list.innerHTML = `<div class="empty-state">검색 결과가 없습니다</div>`;
                     return;
                }

                list.innerHTML = sortedStudents.map(student => {
                    const hasRecording = student.recs.length > 0;
                    const lastDate = student.lastRecTime > 0
                        ? new Date(student.lastRecTime).toLocaleDateString('ko-KR', {
                            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        })
                        : '-';
                    const initial = student.name.charAt(0);

                    return `
                        <div class="student-card" onclick="viewStudentRecordings('${student.id}', '${student.name}')" style="margin-bottom: 12px;">
                            <div class="student-avatar">${initial}</div>
                            <div class="student-info">
                                <div class="student-name">${student.name}</div>
                                <div class="student-meta">${student.grade || ''} · 녹화 ${student.recs.length}개</div>
                            </div>
                            <div class="student-status">
                                <span class="recording-badge ${hasRecording ? 'has-recording' : 'no-recording'}">
                                    <i class="ti ti-${hasRecording ? 'video' : 'video-off'}"></i>
                                    ${hasRecording ? '녹화 있음' : '녹화 없음'}
                                </span>
                                <span class="last-activity">${lastDate}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                // View by Date mode
                const selectedDateStr = document.getElementById('datePicker').value; // YYYY-MM-DD
                
                let allRecs = [];
                for (const student of allStudents) {
                    const recs = studentRecordings[student.id] || [];
                    for(const r of recs) {
                        const recTime = new Date(r.created_at || 0);
                        const ry = recTime.getFullYear();
                        const rm = String(recTime.getMonth() + 1).padStart(2, '0');
                        const rd = String(recTime.getDate()).padStart(2, '0');
                        const recDateStr = `${ry}-${rm}-${rd}`;
                        
                        if (!selectedDateStr || recDateStr === selectedDateStr) {
                            allRecs.push({
                                student: student,
                                recording: r,
                                time: recTime
                            });
                        }
                    }
                }

                if(allRecs.length === 0) {
                     list.innerHTML = `
                     <div class="empty-state">
                        <i class="ti ti-calendar-off" style="font-size: 3rem; color: var(--text-light);"></i>
                        <p>해당 날짜에 녹화 기록이 없습니다</p>
                     </div>`;
                     return;
                }

                // Sort recordings descending by time
                allRecs.sort((a, b) => b.time - a.time);
                
                list.innerHTML = allRecs.map(item => {
                    const timeStr = item.time.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
                    const recName = item.recording.name.split('/')[1] || item.recording.name;
                    return `
                    <div class="student-card" onclick="viewStudentRecordings('${item.student.id}', '${item.student.name}')" style="margin-bottom: 12px; border: 1px solid var(--border); box-shadow: none;">
                        <div class="student-info">
                            <div class="student-name" style="font-weight:700;">${item.student.name} <span class="text-light" style="font-size:0.8rem; font-weight:normal; margin-left: 8px;">${item.student.grade || ''}</span></div>
                            <div class="student-meta" style="color: var(--primary); font-weight: 500; margin-top: 4px;">${timeStr} · ${recName.replace('.webm','')}</div>
                        </div>
                        <div class="student-status">
                            <span class="recording-badge has-recording" style="background: var(--bg-light); color: var(--text-dark);">
                                확인 <i class="ti ti-chevron-right" style="margin-left:2px;"></i>
                            </span>
                        </div>
                    </div>
                    `;
                }).join('');
            }
        }

        function filterStudents() {
            renderStudents();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            
            document.getElementById('datePickerContainer').style.display = filter === 'date' ? 'block' : 'none';
            document.getElementById('searchBoxContainer').style.display = filter === 'all' ? 'block' : 'none';
            
            renderStudents();
        }

        function viewStudentRecordings(studentId, studentName) {
            sessionStorage.setItem('viewingStudentId', studentId);
            sessionStorage.setItem('viewingStudentName', studentName);
            window.location.href = 'student-recordings.html';
        }

        let oldRecCount = 0;
        let oldFilePaths = [];

        async function loadOldRecordingCount() {
            try {
                const client = await getSupabase();
                if (!client) return;

                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - 7);

                oldFilePaths = [];

                // Scan all student folders in storage
                for (const student of allStudents) {
                    const { data: files } = await client.storage
                        .from('recordings')
                        .list(student.id, { limit: 200 });

                    if (files) {
                        for (const f of files) {
                            if (f.created_at && new Date(f.created_at) < cutoff) {
                                oldFilePaths.push(`${student.id}/${f.name}`);
                            }
                        }
                    }
                }

                oldRecCount = oldFilePaths.length;
                const card = document.getElementById('cleanupCard');
                if (oldRecCount > 0) {
                    document.getElementById('oldRecCountText').textContent = `7일 이상 지난 파일 ${oldRecCount}개`;
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            } catch (e) {
                console.warn('Cleanup count failed:', e);
            }
        }

        function openCleanupModal() {
            document.getElementById('cleanupModalDesc').textContent =
                `7일이 지난 녹화 파일 ${oldRecCount}개를 삭제합니다. 삭제된 파일은 복구할 수 없습니다.`;
            document.getElementById('cleanupProgressArea').style.display = 'none';
            document.getElementById('cleanupProgressBar').style.width = '0%';
            document.getElementById('cleanupButtons').style.display = 'flex';
            document.getElementById('cancelCleanupBtn').disabled = false;
            document.getElementById('cancelCleanupBtn').textContent = '취소';
            document.getElementById('confirmCleanupBtn').disabled = false;
            document.getElementById('cleanupModal').classList.add('open');
        }

        function closeCleanupModal() {
            document.getElementById('cleanupModal').classList.remove('open');
        }

        async function runCleanup() {
            document.getElementById('cancelCleanupBtn').disabled = true;
            document.getElementById('confirmCleanupBtn').disabled = true;
            document.getElementById('cleanupProgressArea').style.display = 'block';
            document.getElementById('cleanupProgressText').textContent = '삭제 준비 중...';

            try {
                const client = await getSupabase();
                const total = oldFilePaths.length;
                let deleted = 0;

                // Delete in batches of 10
                for (let i = 0; i < total; i += 10) {
                    const batch = oldFilePaths.slice(i, i + 10);
                    const { error } = await client.storage.from('recordings').remove(batch);
                    if (!error) deleted += batch.length;
                    document.getElementById('cleanupProgressText').textContent = `${Math.min(i + 10, total)} / ${total} 삭제 중...`;
                    document.getElementById('cleanupProgressBar').style.width = `${Math.round(Math.min(i + 10, total) / total * 100)}%`;
                }

                document.getElementById('cleanupProgressText').textContent = `${deleted}개 삭제 완료!`;
                document.getElementById('cleanupProgressBar').style.width = '100%';
                document.getElementById('cleanupButtons').style.display = 'none';
                oldRecCount = 0;
                oldFilePaths = [];
                document.getElementById('cleanupCard').style.display = 'none';
                setTimeout(() => {
                    closeCleanupModal();
                    loadDashboardData();
                }, 1500);
            } catch (e) {
                document.getElementById('cleanupProgressText').textContent = `오류 발생: ${e.message}`;
                document.getElementById('cancelCleanupBtn').disabled = false;
                document.getElementById('cancelCleanupBtn').textContent = '닫기';
            }
        }

        function refreshData() {
            document.getElementById('studentList').innerHTML = `
                <div class="empty-state">
                    <i class="ti ti-loader" style="font-size: 2rem; animation: spin 1s linear infinite;"></i>
                    <p>새로고침 중...</p>
                </div>
            `;
            loadDashboardData();
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
