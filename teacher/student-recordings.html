<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 녹화 보기 - TES Speaking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <style>
        .recording-item {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .recording-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-dark);
        }

        .recording-details { padding: var(--sp-4); }

        .recording-title {
            font-weight: 600;
            font-size: var(--text-base);
            color: var(--text-dark);
            margin-bottom: var(--sp-1);
        }

        .recording-date {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-bottom: var(--sp-3);
        }

        .script-section {
            background: var(--bg-light);
            border-radius: var(--radius-md);
            padding: var(--sp-3);
            margin-top: var(--sp-3);
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-2);
        }

        .script-title {
            font-weight: 600;
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .script-content {
            font-size: var(--text-sm);
            line-height: 1.6;
            color: var(--text-dark);
            max-height: 200px;
            overflow-y: auto;
        }

        .script-content p { margin: var(--sp-1) 0; }

        .action-row {
            display: flex;
            gap: var(--sp-2);
            margin-top: var(--sp-3);
        }

        .action-row .btn { flex: 1; font-size: var(--text-sm); padding: var(--sp-2) var(--sp-3); }

        .duration-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-1);
            font-size: var(--text-xs);
            color: var(--primary-dark);
            background: var(--primary-pale);
            padding: 2px var(--sp-2);
            border-radius: var(--radius-md);
            font-weight: 600;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    @media(max-width:600px){.content-area{padding:10px!important}.recording-item{margin-bottom:9px!important}.recording-video{max-height:28vh!important;object-fit:contain!important;background:#000}.recording-details{padding:9px!important}.action-row{display:flex!important;gap:4px!important;margin:6px 0!important}.action-row button{padding:8px 3px!important;font-size:11px!important;flex:1}.script-section{margin:4px 0!important}.script-content{max-height:180px;overflow:auto}}</style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <a href="dashboard.html" class="back-btn"><i class="ti ti-arrow-left"></i></a>
            <h1 class="header-title">녹화 보기</h1>
            <div style="width:40px;"></div>
        </header>

        <div class="content-area" style="padding:var(--sp-5); padding-bottom:var(--sp-5);">
            <!-- Student Info -->
            <div style="background:var(--primary-pale); padding:10px; border-radius:var(--radius-lg); margin-bottom:10px; display:flex; align-items:center; gap:var(--sp-4);">
                <div class="t-student-avatar" style="width:36px; height:36px; font-size:1rem;" id="studentAvatar">-</div>
                <div>
                    <h2 style="font-size:1.05rem; font-weight:700; color:var(--text-dark);" id="studentName">학생 이름</h2>
                    <p style="color:var(--text-muted); font-size:var(--text-sm); margin-top:var(--sp-1);" id="recordingCount">녹화 0개</p>
                </div>
            </div>

            <!-- Recording List -->
            <div style="display:flex; flex-direction:column; gap:var(--sp-4);" id="recordingList">
                <div class="t-empty-state">
                    <i class="ti ti-loader t-empty-icon" style="animation:spin 1s linear infinite;"></i>
                    <p>녹화 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        let recordings = [];
        let studentId = '';
        let studentName = '';

        document.addEventListener('DOMContentLoaded', async () => {
            studentId = sessionStorage.getItem('viewingStudentId');
            studentName = sessionStorage.getItem('viewingStudentName');

            if (!studentId || !studentName) {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('studentName').textContent = studentName;
            document.getElementById('studentAvatar').textContent = studentName.charAt(0);

            await loadRecordings();
        });

        async function loadRecordings() {
            try {
                const client = await getSupabase();
                if (!client) return;

                const { data: files, error } = await client
                    .storage.from('recordings').list(studentId, { limit: 100 });

                if (error) throw error;

                recordings = (files || [])
                    .filter(f => f.name.endsWith('.webm'))
                    .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

                document.getElementById('recordingCount').textContent = `녹화 ${recordings.length}개`;

                if (recordings.length === 0) {
                    document.getElementById('recordingList').innerHTML = `
                        <div class="t-empty-state">
                            <i class="ti ti-video-off t-empty-icon"></i>
                            <div class="t-empty-title">녹화가 없습니다</div>
                            <div class="t-empty-desc">아직 이 학생의 녹화가 없습니다</div>
                        </div>`;
                    return;
                }

                renderRecordings();
            } catch (e) {
                console.error('Load recordings error:', e);
            }
        }

        const scriptCache = {};

        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '--';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            if (mins > 0) return `${mins}분 ${secs}초`;
            return `${secs}초`;
        }

        async function renderRecordings() {
            const list = document.getElementById('recordingList');
            const client = await getSupabase();
            let html = '';

            for (const rec of recordings) {
                const path = `${studentId}/${rec.name}`;
                const { data } = client.storage.from('recordings').getPublicUrl(path);
                const url = data.publicUrl;

                const date = rec.created_at
                    ? new Date(rec.created_at).toLocaleDateString('ko-KR', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    })
                    : '날짜 없음';

                const unitMatch = rec.name.match(/_U(\d+)_/);
                const unitNum = unitMatch ? `Unit ${unitMatch[1]}` : '녹화';

                let scriptHtml = '<p style="color:var(--text-muted); font-style:italic;">스크립트 정보 없음</p>';
                try {
                    const jsonName = rec.name.replace('.webm', '.json');
                    const jsonPath = `${studentId}/${jsonName}`;
                    const { data: jsonBlob, error: jsonErr } = await client.storage
                        .from('recordings').download(jsonPath);

                    if (!jsonErr && jsonBlob) {
                        const meta = JSON.parse(await jsonBlob.text());
                        scriptCache[rec.name] = meta;

                        if (meta.sentences && meta.sentences.length > 0) {
                            const label = [meta.textbook, meta.unit].filter(Boolean).join(' · ');
                            scriptHtml = (label ? `<p style="font-size:var(--text-xs); color:var(--primary-dark); font-weight:600; margin-bottom:var(--sp-2);">${label}</p>` : '') +
                                meta.sentences.map(s =>
                                    `<p style="font-size:var(--text-sm); margin-bottom:var(--sp-1);">${s.en || ''}</p>` +
                                    (s.kr ? `<p style="font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--sp-2);">${s.kr}</p>` : '')
                                ).join('');
                        }
                    }
                } catch (e) { /* no script file */ }

                if (!scriptCache[rec.name]) {
                    try {
                        const { data: existing } = await client
                            .from('shared_links').select('script_en, script_kr')
                            .eq('video_url', url).not('script_en', 'is', null)
                            .limit(1).maybeSingle();

                        if (existing && existing.script_en) {
                            const enLines = existing.script_en.split('\n').filter(l => l.trim());
                            const krLines = (existing.script_kr || '').split('\n').filter(l => l.trim());
                            const sentences = enLines.map((en, i) => ({ en, kr: krLines[i] || '' }));
                            scriptCache[rec.name] = { sentences };
                            scriptHtml = sentences.map(s =>
                                `<p style="font-size:var(--text-sm); margin-bottom:var(--sp-1);">${s.en}</p>` +
                                (s.kr ? `<p style="font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--sp-2);">${s.kr}</p>` : '')
                            ).join('');
                        }
                    } catch (e) { /* fallback failed */ }
                }

                html += `
                    <div class="recording-item">
                        <video class="recording-video" controls preload="metadata"
                            onloadedmetadata="this.closest('.recording-item').querySelector('.duration-badge').textContent = '⏱ ' + formatDuration(this.duration)">
                            <source src="${url}" type="video/webm">
                        </video>
                        <div class="recording-details">
                            <div class="title-row">
                                <div class="recording-title">${unitNum}</div>
                                <span class="duration-badge">⏱ 로딩중...</span>
                            </div>
                            <div class="recording-date">${date}</div>

                            <div class="action-row">
                                <button class="btn btn-secondary" onclick="downloadVideo('${url}', '${rec.name}')">
                                    <i class="ti ti-download"></i> 다운로드
                                </button>
                                <button class="btn btn-secondary" onclick="shareVideo('${rec.id}')">
                                    <i class="ti ti-share"></i> 공유
                                </button>
                                <button class="btn btn-secondary" onclick="deleteVideo('${path}')">
                                    <i class="ti ti-trash"></i> 삭제
                                </button>
                            </div>
                            <details class="script-section"><summary style="cursor:pointer;font-size:12px">학습 스크립트 보기</summary>
                                <div class="script-header">
                                    <span class="script-title">📝 학습 스크립트</span>
                                </div>
                                <div class="script-content">${scriptHtml}</div></details>

                        </div>
                    </div>`;
            }

            list.innerHTML = html;
        }

        async function downloadVideo(url, filename) {
            try {
                showToast('다운로드 준비 중...', 'info');
                const response = await fetch(url);
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                showToast('다운로드 시작됨', 'success');
            } catch (e) {
                showToast('다운로드 실패', 'error');
            }
        }

        async function deleteVideo(path) {
            if (!confirm('이 녹화를 삭제하시겠습니까?')) return;
            try {
                const client = await getSupabase();
                const { error } = await client.storage.from('recordings').remove([path]);
                if (error) throw error;
                showToast('삭제되었습니다', 'success');
                await loadRecordings();
            } catch (e) {
                showToast('삭제 실패', 'error');
            }
        }

        async function shareVideo(id) {
            try {
                const rec = recordings.find(r => r.id === id);
                if (!rec) { showToast('녹화 정보를 찾을 수 없습니다', 'error'); return; }

                showToast('공유 링크 생성 중...');
                const client = await getSupabase();
                const path = `${studentId}/${rec.name}`;
                const { data: urlData } = client.storage.from('recordings').getPublicUrl(path);
                const publicUrl = urlData.publicUrl;

                let scriptEn = '', scriptKr = '';
                const meta = scriptCache[rec.name];
                if (meta && meta.sentences && meta.sentences.length > 0) {
                    scriptEn = meta.sentences.map(s => s.en || '').join('\n');
                    scriptKr = meta.sentences.map(s => s.kr || '').join('\n');
                }

                if (!scriptEn) {
                    try {
                        const { data: existing } = await client
                            .from('shared_links').select('script_en, script_kr')
                            .eq('video_url', publicUrl).not('script_en', 'is', null)
                            .limit(1).maybeSingle();
                        if (existing && existing.script_en) {
                            scriptEn = existing.script_en;
                            scriptKr = existing.script_kr || '';
                        }
                    } catch (e) { }
                }

                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
                let code = '';
                for (let i = 0; i < 7; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

                const { error: insertErr } = await client.from('shared_links').insert([{
                    code, video_url: publicUrl, student_name: studentName || '학생',
                    recorded_at: rec.created_at, script_en: scriptEn || null,
                    script_kr: scriptKr || null, feedback: rec.feedback || null, stickers: rec.stickers || null
                }]);

                if (insertErr) {
                    const params = new URLSearchParams();
                    params.append('video', publicUrl);
                    params.append('name', studentName || '학생');
                    const shareUrl = `${window.location.origin}/pages/share-recording.html?${params.toString()}`;
                    await navigator.clipboard.writeText(shareUrl);
                    showToast('공유 링크 복사됨 (긴 링크)', 'success');
                    return;
                }

                const shareUrl = `${window.location.origin}/pages/share-recording.html?c=${code}`;
                await navigator.clipboard.writeText(shareUrl);
                showToast('짧은 공유 링크가 복사되었습니다!', 'success');
            } catch (err) {
                showToast('공유 실패', 'error');
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>

</html>
