<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>마이페이지 - TES Speaking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
</head>

<body style="font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg-light); min-height:100vh;">
    <!-- Header with gradient -->
    <div class="t-page-header">
        <div class="t-header-nav">
            <a href="dashboard.html" class="t-header-back"><i class="ti ti-arrow-left"></i></a>
            <span class="t-header-title">마이페이지</span>
            <div style="width:40px;"></div>
        </div>
        <div class="t-profile-section">
            <div class="t-profile-avatar-placeholder" id="avatarPlaceholder">
                <i class="ti ti-user"></i>
            </div>
            <img class="t-profile-avatar" id="avatarImg" style="display:none;" alt="profile">
            <div>
                <h2 style="font-size:var(--text-lg); font-weight:700;" id="profileName">선생님</h2>
                <p style="font-size:var(--text-sm); opacity:0.8; margin-top:2px;" id="profileEmail">email@example.com</p>
            </div>
        </div>
    </div>

    <div class="t-content">
        <!-- Academy Info -->
        <div class="t-settings-card">
            <div class="t-settings-title">학원 정보</div>
            <div class="t-setting-item" onclick="editAcademyName()">
                <div class="t-setting-icon teacher">
                    <i class="ti ti-building"></i>
                </div>
                <div style="flex:1;">
                    <div class="t-setting-label">학원 이름</div>
                    <div class="t-setting-desc" id="academyNameDisplay">-</div>
                </div>
                <span class="t-setting-arrow"><i class="ti ti-pencil"></i></span>
            </div>
            <div class="t-setting-item" onclick="copyAcademyCode()">
                <div class="t-setting-icon primary">
                    <i class="ti ti-qrcode"></i>
                </div>
                <div style="flex:1;">
                    <div class="t-setting-label">학원 코드</div>
                    <div class="t-setting-desc">학생에게 공유하세요</div>
                </div>
                <span class="t-code-display" id="academyCodeDisplay">------</span>
            </div>
            <div class="t-setting-item" onclick="location.href='academy-setup.html'">
                <div class="t-setting-icon orange">
                    <i class="ti ti-switch-horizontal"></i>
                </div>
                <div style="flex:1;">
                    <div class="t-setting-label">학원 전환</div>
                    <div class="t-setting-desc">다른 학원으로 이동</div>
                </div>
                <span class="t-setting-arrow"><i class="ti ti-chevron-right"></i></span>
            </div>
        </div>

        <!-- Account -->
        <div class="t-settings-card">
            <div class="t-settings-title">계정</div>
            <div class="t-setting-item" onclick="handleLogout()">
                <div class="t-setting-icon muted">
                    <i class="ti ti-logout"></i>
                </div>
                <div style="flex:1;">
                    <div class="t-setting-label">로그아웃</div>
                    <div class="t-setting-desc">계정에서 로그아웃합니다</div>
                </div>
                <span class="t-setting-arrow"><i class="ti ti-chevron-right"></i></span>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="t-settings-card" style="margin-top:var(--sp-2);">
            <div class="t-settings-title" style="color:var(--wrong);">위험 구역</div>
            <div class="t-setting-item" onclick="confirmDeleteAccount()" style="cursor:pointer;">
                <div class="t-setting-icon wrong">
                    <i class="ti ti-trash"></i>
                </div>
                <div style="flex:1;">
                    <div class="t-setting-label" style="color:var(--wrong);">회원 탈퇴</div>
                    <div class="t-setting-desc">모든 데이터가 삭제됩니다</div>
                </div>
                <span class="t-setting-arrow"><i class="ti ti-chevron-right"></i></span>
            </div>
        </div>

        <div class="t-app-version">TES Speaking v1.2.1</div>
    </div>

    <!-- Edit Academy Name Modal -->
    <div class="t-modal-overlay" id="editNameModal">
        <div class="t-modal-card">
            <div class="t-modal-title">학원 이름 변경</div>
            <div class="t-modal-desc">새로운 학원 이름을 입력하세요</div>
            <input type="text" class="t-modal-input" id="newAcademyName" placeholder="학원 이름">
            <div class="t-modal-actions">
                <button class="t-modal-btn cancel" onclick="closeModal('editNameModal')">취소</button>
                <button class="t-modal-btn confirm" onclick="saveAcademyName()">저장</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Modal -->
    <div class="t-modal-overlay" id="deleteModal">
        <div class="t-modal-card">
            <div class="t-modal-title" style="color:var(--wrong);">⚠️ 회원 탈퇴</div>
            <div class="t-modal-desc">
                정말 탈퇴하시겠습니까?<br>
                모든 학원 데이터, 학생 기록이 <strong>영구 삭제</strong>됩니다.<br><br>
                확인하려면 아래에 <strong>"탈퇴합니다"</strong>를 입력하세요.
            </div>
            <input type="text" class="t-modal-input" id="deleteConfirmText" placeholder="탈퇴합니다">
            <div class="t-modal-actions">
                <button class="t-modal-btn cancel" onclick="closeModal('deleteModal')">취소</button>
                <button class="t-modal-btn danger" onclick="deleteAccount()">탈퇴</button>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        let currentAcademy = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Auth guard
            const { data: session } = await getTeacherSession();
            if (!session || !session.user) {
                window.location.href = 'login.html';
                return;
            }

            // Display profile info
            const user = session.user;
            document.getElementById('profileName').textContent =
                user.user_metadata?.full_name || user.email.split('@')[0];
            document.getElementById('profileEmail').textContent = user.email;

            const avatarUrl = user.user_metadata?.avatar_url;
            if (avatarUrl) {
                const img = document.getElementById('avatarImg');
                img.src = avatarUrl;
                img.style.display = 'block';
                document.getElementById('avatarPlaceholder').style.display = 'none';
            }

            // Display academy info
            currentAcademy = getCurrentAcademy();
            if (currentAcademy) {
                document.getElementById('academyNameDisplay').textContent = currentAcademy.name;
                document.getElementById('academyCodeDisplay').textContent = currentAcademy.code;
            }
        });

        // Edit academy name
        function editAcademyName() {
            if (!currentAcademy) return;
            document.getElementById('newAcademyName').value = currentAcademy.name;
            document.getElementById('editNameModal').classList.add('active');
        }

        async function saveAcademyName() {
            const newName = document.getElementById('newAcademyName').value.trim();
            if (!newName) {
                showToast('학원 이름을 입력해주세요', 'error');
                return;
            }

            try {
                const client = await getSupabase();
                const { error } = await client
                    .from('academies')
                    .update({ name: newName })
                    .eq('id', currentAcademy.id);

                if (error) throw error;

                currentAcademy.name = newName;
                setCurrentAcademy(currentAcademy);
                document.getElementById('academyNameDisplay').textContent = newName;
                closeModal('editNameModal');
                showToast('학원 이름이 변경되었습니다!');
            } catch (err) {
                showToast('변경 실패: ' + (err.message || err), 'error');
            }
        }

        // Copy academy code
        function copyAcademyCode() {
            if (!currentAcademy?.code) return;
            navigator.clipboard.writeText(currentAcademy.code)
                .then(() => showToast('학원 코드가 복사되었습니다!'))
                .catch(() => {
                    const el = document.createElement('textarea');
                    el.value = currentAcademy.code;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast('학원 코드가 복사되었습니다!');
                });
        }

        // Logout
        async function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                await teacherLogout();
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Delete account
        function confirmDeleteAccount() {
            document.getElementById('deleteConfirmText').value = '';
            document.getElementById('deleteModal').classList.add('active');
        }

        async function deleteAccount() {
            const confirmText = document.getElementById('deleteConfirmText').value.trim();
            if (confirmText !== '탈퇴합니다') {
                showToast('"탈퇴합니다"를 정확히 입력해주세요', 'error');
                return;
            }

            try {
                showLoading('계정 삭제 중...');

                const client = await getSupabase();
                const { data: session } = await client.auth.getSession();
                const userId = session?.session?.user?.id;

                if (userId && currentAcademy) {
                    await client
                        .from('academy_teachers')
                        .delete()
                        .eq('teacher_id', userId)
                        .eq('academy_id', currentAcademy.id);
                }

                await client.auth.signOut();
                sessionStorage.clear();
                localStorage.removeItem('lastAcademyCode');

                hideLoading();
                showToast('탈퇴가 완료되었습니다.');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } catch (err) {
                hideLoading();
                showToast('탈퇴 처리 중 오류: ' + (err.message || err), 'error');
            }
        }

        // Modal helpers
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.querySelectorAll('.t-modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>

</html>
