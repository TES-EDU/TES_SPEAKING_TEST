<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 보안 관리자 · TES Speaking</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:#19383c;font-family:system-ui,"Noto Sans KR",sans-serif}.shell{width:min(440px,100%);min-height:100vh;margin:auto;padding:34px 18px}h1{font-size:23px;margin:12px 0 4px}p{color:#698084;font-size:13px}a{text-decoration:none;color:inherit}.option{display:block;background:white;padding:17px;margin:10px 0;border:1px solid #e0e9e9;border-radius:13px;font-weight:600;cursor:pointer}.option:hover{border-color:#2c9396}.tiny{display:block;text-align:center;font-size:12px;color:#84979b;margin-top:25px}input{display:block;width:100%;height:46px;padding:12px;border:1px solid #d5dfdf;border-radius:9px;font-size:17px;margin:16px 0}.btn{display:block;width:100%;background:#238b90;color:white;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer}.note{border:1px solid #d2dddd;background:#fff;border-radius:10px;padding:13px;font-size:12px;line-height:1.6;color:#526467;margin-top:20px}.back{display:block;font-size:13px;color:#60757a;margin-bottom:20px}</style></head><body><main class="shell"><a href="login.html" class="back">← 관리자 대시보드</a><h1>데이터 보안 관리자</h1><p>원장 전용 6자리 비밀번호</p><form id="secureLogin"><input id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6자리 비밀번호" required><button class="btn">로그인</button></form><a class="tiny" href="password-recovery.html">비밀번호를 잊으셨나요? 이메일로 복구 →</a><div class="note" id="message">서버 인증 연동 후 교재 업로드·수정, 학생 비밀번호 변경, 지점별 관리자 비밀번호 변경이 가능합니다. 현재는 로그인할 수 없습니다.</div></main><script>document.getElementById('secureLogin').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='보안 관리자 인증 서버가 아직 연결되지 않았습니다.';});</script></body></html>
