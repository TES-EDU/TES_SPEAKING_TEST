<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지점 관리자 로그인 · TES Speaking</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:#19383c;font-family:system-ui,"Noto Sans KR",sans-serif}.shell{width:min(440px,100%);min-height:100vh;margin:auto;padding:34px 18px}h1{font-size:23px;margin:12px 0 4px}p{color:#698084;font-size:13px}a{text-decoration:none;color:inherit}.option{display:block;background:white;padding:17px;margin:10px 0;border:1px solid #e0e9e9;border-radius:13px;font-weight:600;cursor:pointer}.option:hover{border-color:#2c9396}.tiny{display:block;text-align:center;font-size:12px;color:#84979b;margin-top:25px}input{display:block;width:100%;height:46px;padding:12px;border:1px solid #d5dfdf;border-radius:9px;font-size:17px;margin:16px 0}.btn{display:block;width:100%;background:#238b90;color:white;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer}.note{border:1px solid #d2dddd;background:#fff;border-radius:10px;padding:13px;font-size:12px;line-height:1.6;color:#526467;margin-top:20px}.back{display:block;font-size:13px;color:#60757a;margin-bottom:20px}</style></head><body><main class="shell"><a href="login.html" class="back">← 지점 선택</a><h1 id="branchName">지점 관리자</h1><p>관리자 비밀번호 4자리를 입력하세요</p><form id="branchLogin"><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="비밀번호 4자리" required><button class="btn">관리자 대시보드 입장</button></form><div class="note" id="message">서버 인증 연결이 필요합니다. 연결 전에는 실제 학생 영상이나 개인정보에 접근할 수 없습니다.</div></main><script>const branches={hagye:'하계점',junggye:'중계점',changdong:'창동점'};const key=new URLSearchParams(location.search).get('branch');if(!branches[key])location.replace('login.html');document.getElementById('branchName').textContent=branches[key]+' 관리자 대시보드';document.getElementById('branchLogin').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='비밀번호 검증 서버가 연결되지 않았습니다. 보안을 위해 입장을 허용하지 않습니다.';});</script></body></html>
