<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>녹화 공유 - TES Speaking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        body {
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .share-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .share-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
        }

        .video-player {
            width: 100%;
            height: 100%;
        }

        .share-body {
            padding: 24px;
        }

        .recording-info {
            margin-bottom: 24px;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .recording-date {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .script-box {
            background: var(--bg-light);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .script-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .script-content {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .feedback-box {
            border: 2px solid var(--primary-pale);
            background: #f8fcfb;
            padding: 16px;
            border-radius: var(--radius-md);
        }

        .feedback-title {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sticker-row {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }

        .loading-state .spinner {
            font-size: 3rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-state .error-icon {
            font-size: 3rem;
            color: #EF4444;
            margin-bottom: 16px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
</head>

<body>

    <div class="share-container" id="container">
        <div class="share-header">
            <div class="logo-text">TES Speaking</div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="loading-state">
            <i class="ti ti-loader spinner"></i>
            <p>녹화를 불러오는 중...</p>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-state" style="display: none;">
            <i class="ti ti-alert-circle error-icon"></i>
            <h3 style="margin-bottom: 8px;">링크를 찾을 수 없습니다</h3>
            <p style="color: var(--text-gray);">만료되었거나 잘못된 링크입니다.</p>
        </div>

        <!-- Content -->
        <div id="content" style="display: none;">
            <div class="video-container">
                <video class="video-player" id="videoPlayer" controls playsinline>
                    <source src="" type="video/webm">
                    브라우저가 비디오를 지원하지 않습니다.
                </video>
            </div>

            <div class="share-body">
                <div class="recording-info">
                    <div class="student-name" id="studentName"></div>
                    <div class="recording-date" id="recordingDate"></div>
                </div>

                <div class="script-box">
                    <div class="script-header">
                        <span class="script-title">📝 스크립트</span>
                    </div>
                    <div class="script-content" id="scriptContent">
                        <span style="color:var(--text-gray)">스크립트 정보 없음</span>
                    </div>
                </div>

                <div class="feedback-box" id="feedbackSection" style="display: none;">
                    <div class="feedback-title">
                        <i class="ti ti-message-circle-2"></i> 선생님 피드백
                    </div>
                    <div id="feedbackText" style="color: var(--text-dark); line-height: 1.5;"></div>
                    <div class="sticker-row" id="stickerRow"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Check if this is a short code link (?c=ABC123) or legacy full-param link
            const shareCode = urlParams.get('c');

            if (shareCode) {
                // New short link mode - fetch data from DB
                await loadFromShareCode(shareCode);
            } else {
                // Legacy mode - all data in URL params (backward compatible)
                loadFromParams(urlParams);
            }
        });

        async function loadFromShareCode(code) {
            try {
                const client = await getSupabase();
                if (!client) throw new Error('Supabase not available');

                const { data, error } = await client
                    .from('shared_links')
                    .select('*')
                    .eq('code', code)
                    .single();

                if (error || !data) {
                    showError();
                    return;
                }

                // Show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // Video
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.querySelector('source').src = data.video_url;
                videoPlayer.load();

                // Info
                document.getElementById('studentName').textContent = `${data.student_name || '학생'}의 스피킹`;

                if (data.recorded_at) {
                    const dateObj = new Date(data.recorded_at);
                    document.getElementById('recordingDate').textContent = dateObj.toLocaleDateString('ko-KR', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                }

                // Script - English only, no numbering
                const scriptContainer = document.getElementById('scriptContent');
                if (data.script_en) {
                    const enLines = data.script_en.split('\n').filter(l => l.trim());
                    scriptContainer.innerHTML = enLines.map(line => 
                        `<p style="font-size:0.95rem; line-height:1.7; margin-bottom:4px;">${line}</p>`
                    ).join('');
                }

                // Feedback
                if (data.feedback || data.stickers) {
                    document.getElementById('feedbackSection').style.display = 'block';
                    document.getElementById('feedbackText').textContent = data.feedback || '확인 완료';
                    const count = parseInt(data.stickers || '0');
                    if (count > 0) {
                        document.getElementById('stickerRow').innerHTML = '⭐'.repeat(count);
                    }
                }

            } catch (e) {
                console.error('Share load error:', e);
                showError();
            }
        }

        function loadFromParams(urlParams) {
            // Legacy: all data passed directly in URL
            const videoUrl = urlParams.get('video');
            const name = urlParams.get('name');
            const date = urlParams.get('date');
            const scriptEn = urlParams.get('scriptEn');
            const scriptKr = urlParams.get('scriptKr');
            const scriptRaw = urlParams.get('script');
            const feedback = urlParams.get('feedback');
            const stickers = urlParams.get('stickers');

            if (!videoUrl) {
                showError();
                return;
            }

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.querySelector('source').src = videoUrl;
            videoPlayer.load();

            document.getElementById('studentName').textContent = `${name || '학생'}의 스피킹`;

            if (date) {
                const dateObj = new Date(date);
                if (!isNaN(dateObj.getTime())) {
                    document.getElementById('recordingDate').textContent = dateObj.toLocaleDateString('ko-KR', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                } else {
                    document.getElementById('recordingDate').textContent = date;
                }
            }

            const scriptContainer = document.getElementById('scriptContent');
            if (scriptEn) {
                const enLines = scriptEn.split('\n').filter(l => l.trim());
                scriptContainer.innerHTML = enLines.map(line => 
                    `<p style="font-size:0.95rem; line-height:1.7; margin-bottom:4px;">${line}</p>`
                ).join('');
            } else if (scriptRaw) {
                try {
                    const parsed = JSON.parse(scriptRaw);
                    if (Array.isArray(parsed)) {
                        scriptContainer.innerHTML = parsed.map(s => 
                            `<p style="font-size:0.95rem; line-height:1.7; margin-bottom:4px;">${s.en || ''}</p>`
                        ).join('');
                    } else {
                        scriptContainer.textContent = scriptRaw;
                    }
                } catch (e) {
                    scriptContainer.textContent = scriptRaw;
                }
            }

            if (feedback || stickers) {
                document.getElementById('feedbackSection').style.display = 'block';
                document.getElementById('feedbackText').textContent = feedback || '확인 완료';
                const count = parseInt(stickers || '0');
                if (count > 0) {
                    document.getElementById('stickerRow').innerHTML = '⭐'.repeat(count);
                }
            }
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>

</html>
