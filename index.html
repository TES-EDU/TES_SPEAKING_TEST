<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TES Speaking - 로그인</title>
    <meta name="description" content="영어 스피킹 연습 앱">
    <meta name="theme-color" content="#2D9596">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f7f7 0%, #f0fdf4 30%, #e8f6f6 60%, #dbeafe 100%);
            overflow: hidden;
            position: relative;
        }

        /* Animated background orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #2D9596 0%, transparent 70%);
            top: -80px;
            left: -60px;
            animation-duration: 10s;
        }

        .bg-orb-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #5EEAD4 0%, transparent 70%);
            bottom: -60px;
            right: -40px;
            animation-duration: 12s;
            animation-delay: -3s;
        }

        .bg-orb-3 {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #A78BFA 0%, transparent 70%);
            top: 50%;
            right: 10%;
            animation-duration: 9s;
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.05);
            }
        }

        /* Login Card */
        .login-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 48px 36px 40px;
            box-shadow:
                0 8px 32px rgba(45, 149, 150, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2D9596 0%, #40B4B4 50%, #5EEAD4 100%);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 24px rgba(45, 149, 150, 0.3);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow: 0 8px 24px rgba(45, 149, 150, 0.3);
            }

            50% {
                box-shadow: 0 12px 36px rgba(45, 149, 150, 0.5);
            }
        }

        .app-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 0.95rem;
            color: #64748B;
            margin-bottom: 36px;
        }

        /* Form */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #94A3B8;
        }

        .form-input-styled {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Noto Sans KR', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            outline: none;
            color: #1A1A2E;
        }

        .form-input-styled::placeholder {
            color: #94A3B8;
        }

        .form-input-styled:focus {
            border-color: #2D9596;
            background: white;
            box-shadow: 0 0 0 4px rgba(45, 149, 150, 0.1);
        }

        .form-input-styled.code-input {
            text-align: center;
            letter-spacing: 6px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            padding-left: 16px;
        }

        .academy-found {
            text-align: center;
            font-size: 0.85rem;
            color: #22C55E;
            font-weight: 500;
            margin-top: 8px;
            display: none;
        }

        .academy-found i {
            margin-right: 4px;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            margin-top: 8px;
            background: linear-gradient(135deg, #2D9596 0%, #40B4B4 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(45, 149, 150, 0.3);
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 149, 150, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Links */
        .link-teacher {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 28px;
            color: #64748B;
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-teacher:hover {
            color: #2D9596;
        }

        .version-text {
            color: #CBD5E1;
            font-size: 0.7rem;
            margin-top: 24px;
            letter-spacing: 1px;
        }

        /* Decorative dots */
        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 32px;
            margin-bottom: -8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2D9596;
            opacity: 0.15;
        }

        .dot.active {
            opacity: 0.5;
            width: 20px;
            border-radius: 4px;
        }
    </style>
    <style id="tes-mobile-login-fix">
      /* Login is its own page: no stage navigation before authentication. */
      html { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      body { height: auto; min-height: 100dvh; overflow-x: hidden; overflow-y: auto;
             display: flex; align-items: flex-start; justify-content: center;
             padding: max(16px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)); }
      .login-card { width: 100%; max-width: 420px; margin: auto 0;
                    padding: 24px 20px 20px; animation: none; }
      .bg-orb { pointer-events: none; }
      @media (max-width: 480px) {
        .login-card { padding: 20px 18px 18px; border-radius: 22px; }
        .logo-icon { margin-bottom: 10px; }
        .app-title { margin-bottom: 4px; }
        .app-subtitle { margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .dots { margin-top: 12px; }
      }
      @media (max-height: 700px) {
        .login-card { margin: 0; }
        .logo-icon { transform: scale(.85); transform-origin: center; }
      }
    </style>
    <link rel="manifest" href="manifest.json">
<style id="tes-login-viewport-final-fix">
html, body { height:auto !important; min-height:100% !important; overflow-x:hidden !important; overflow-y:auto !important; }
body { display:block !important; min-height:100dvh !important; padding:12px 12px 28px !important; -webkit-overflow-scrolling:touch; }
.login-card { width:100% !important; max-width:420px !important; margin:0 auto !important; padding:18px 18px 22px !important; }
.logo-icon { width:58px !important; height:58px !important; font-size:30px !important; margin-bottom:8px !important; }
.app-title { font-size:1.55rem !important; margin-bottom:2px !important; }
.app-subtitle { margin-bottom:14px !important; }
.form-group { margin-bottom:10px !important; }
.form-label { margin-bottom:4px !important; }
.form-input-styled { padding:11px 14px !important; min-height:46px !important; }
.btn-login { margin-top:6px !important; padding:13px !important; min-height:48px !important; }
.link-teacher { display:inline-block; margin-top:14px !important; }
.dots { margin-top:8px !important; }
@media (max-height:740px) { .login-card { padding-top:12px !important; } .app-subtitle { margin-bottom:9px !important; } }
</style>
</head>

<body>
    <!-- Floating background orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="login-card">
        <div class="logo-icon">🎤</div>
        <h1 class="app-title">TES Speaking</h1>
        <p class="app-subtitle">영어 스피킹 연습을 시작하세요</p>

        <form id="loginForm">
            <div class="form-group"><label class="form-label">이름</label><input type="text" id="studentName" class="form-input-styled" placeholder="이름을 입력하세요" required></div>
            <div class="form-group"><label class="form-label">지점</label><select id="studentBranch" class="form-input-styled" required><option value="">지점을 선택하세요</option><option>하계점</option><option>중계점</option><option>창동점</option></select></div>
            <div class="form-group"><label class="form-label">비밀번호</label><input id="studentPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="form-input-styled" placeholder="4자리 비밀번호" required></div>
            <button type="submit" class="btn-login">
                시작하기
            </button>
        </form>

        <a href="teacher/login.html" class="link-teacher">
            관리자 대시보드 →
        </a>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p class="version-text">v1.2.1</p>
        <p style="font-size: 0.75rem; color: var(--text-light); margin-top: 4px;">
            지점과 이름을 확인한 후 시작해 주세요.
        </p>
    </div>

    <!-- Profile Confirmation Modal -->
    <div id="confirmModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
         background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 24px; padding: 32px; width: 90%; max-width: 360px; text-align: center;
                   box-shadow: 0 16px 48px rgba(0,0,0,0.15); animation: slideUp 0.3s ease-out;">
            <div style="font-size: 3rem; margin-bottom: 12px;">👋</div>
            <h3 style="margin-bottom: 8px; font-size: 1.2rem;" id="confirmTitle">김민수님,</h3>
            <p style="color: #64748B; margin-bottom: 8px; font-size: 0.9rem;" id="confirmGrade">하계초등</p>
            <p style="margin-bottom: 24px; color: #475569;">이 프로필로 로그인할까요?</p>

            <button onclick="confirmLogin()" style="width: 100%; padding: 14px; margin-bottom: 10px;
                    background: linear-gradient(135deg, #2D9596 0%, #40B4B4 100%); color: white; border: none; border-radius: 14px; 
                    cursor: pointer; font-size: 1rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
                    box-shadow: 0 4px 12px rgba(45,149,150,0.3);">
                네, 로그인하기
            </button>
            <button onclick="createNewProfile()" style="width: 100%; padding: 14px;
                    background: #F1F5F9; border: none; border-radius: 14px; 
                    cursor: pointer; font-size: 0.9rem; color: #64748B; font-family: 'Noto Sans KR', sans-serif;">
                아니요, 동명이인입니다 (새 프로필)
            </button>
        </div>
    </div>

    <!-- Manual Profile Success Modal -->
    <div id="manualModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
         background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 24px; padding: 32px; width: 90%; max-width: 360px;
                   box-shadow: 0 16px 48px rgba(0,0,0,0.15); animation: slideUp 0.3s ease-out; text-align: center;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #DCFCE7, #BBF7D0); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                <i class="ti ti-check" style="font-size: 2rem; color: #16A34A;"></i>
            </div>
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 8px;">임시 프로필 생성 완료!</h3>
            <p id="manualSuccessName" style="font-size: 0.95rem; color: #334155; font-weight: 600; margin-bottom: 12px;"></p>
            <div style="background: #FEF3C7; border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;">
                <p style="font-size: 0.8rem; color: #92400E; line-height: 1.5;">⚠️ 임시 프로필입니다. 다음에 정상 로그인하면 DB에 자동 등록됩니다.</p>
            </div>
            <button onclick="window.location.href='pages/main.html'" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #2D9596, #40B4B4); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 600; font-family: inherit; box-shadow: 0 4px 12px rgba(45,149,150,0.3);">시작하기</button>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        let pendingName = '';
        let foundStudent = null;
        let currentAcademyData = null;

        // 1차 수정: 지점 이름으로 기존 Supabase 학원 레코드를 매칭합니다.
        async function lookupBranch(name) {
            const client = await getSupabase();
            if (!client) return null;
            const {data,error} = await client.from('academies').select('id,name,code').ilike('name', '%'+name+'%').limit(2);
            if (error || !data || data.length !== 1) return null;
            return data[0];
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const branch = document.getElementById('studentBranch').value;
            const pin = document.getElementById('studentPin').value;
            if (pin !== '1234') { showToast('비밀번호를 확인해주세요', 'error'); return; }
            if (!branch) { showToast('지점을 선택해주세요', 'error'); return; }
            currentAcademyData = await lookupBranch(branch);
            if (!currentAcademyData) {
                showToast('해당 지점을 찾지 못했습니다. 학원 데이터 연결을 확인해주세요.', 'error'); return;
            }

            if (!name) {
                showToast('이름을 입력해주세요', 'error');
                return;
            }

            showLoading('확인 중...');
            pendingName = name;

            // Store academy info in session
            setCurrentAcademy(currentAcademyData);

            try {
                const { data: student, error } = await findStudent(name);
                console.log('🔍 Find student:', { student, error });

                hideLoading();

                if (student && student.academy_id === currentAcademyData.id) {
                    foundStudent = student;
                    showConfirmModal(student);
                } else {
                    await createNewProfile();
                }
            } catch (err) {
                console.error('❌ Login error:', err);
                hideLoading();
                showToast('로그인 실패', 'error');
            }
        });

        function showConfirmModal(student) {
            document.getElementById('confirmTitle').textContent = student.name + '님,';
            document.getElementById('confirmGrade').textContent = student.grade || '학년 미설정';
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function hideConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function confirmLogin() {
            hideConfirmModal();
            loginAsStudent(foundStudent, true);
        }

        async function createNewProfile() {
            hideConfirmModal();
            showLoading('새 프로필 생성 중...');

            // Retry up to 3 times
            let retryCount = 0;
            const maxRetries = 3;

            while (retryCount < maxRetries) {
                try {
                    const savedLevel = localStorage.getItem('studentLevel_' + pendingName) || null;
                    const { data: student, error } = await createStudent(pendingName, savedLevel);

                    if (error || !student) {
                        throw new Error(error || 'Failed to create student');
                    }

                    hideLoading();
                    loginAsStudent(student, false);
                    return; // Success - exit function
                } catch (err) {
                    retryCount++;
                    console.error(`Create student error (attempt ${retryCount}/${maxRetries}):`, err);
                    
                    if (retryCount < maxRetries) {
                        // Wait before retry
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            }

            // All retries failed - show error to user instead of using fake ID
            hideLoading();
            showToast('학생 등록에 실패했습니다. 네트워크를 확인 후 다시 시도해주세요.', 'error');
            console.error('❌ All retries failed for createStudent. NOT proceeding with fake ID.');
        }

        function loginAsStudent(student, isExisting) {
            console.log('✅ Login as:', student, 'isExisting:', isExisting);
            sessionStorage.setItem('currentStudent', JSON.stringify(student));

            const localOnboarding = localStorage.getItem('onboardingComplete_' + student.name);

            if (isExisting || localOnboarding) {
                localStorage.setItem('onboardingComplete_' + student.name, 'true');
                window.location.href = 'pages/class.html';
            } else {
                window.location.href = 'pages/class.html';
            }
        }

        function manualCreateProfile() {
            const mainName = document.getElementById('studentName').value.trim();

            if (!mainName) {
                showToast('이름을 먼저 입력해주세요', 'error');
                return;
            }
            if (!currentAcademyData) {
                showToast('학원 코드를 먼저 입력해주세요', 'error');
                return;
            }

            // Create profile immediately using main form data
            const tempStudent = {
                id: 'manual_' + Date.now(),
                name: mainName,
                grade: '',
                academy_id: currentAcademyData.id,
                _isManual: true
            };

            sessionStorage.setItem('currentStudent', JSON.stringify(tempStudent));
            localStorage.setItem('onboardingComplete_' + mainName, 'true');
            setCurrentAcademy(currentAcademyData);

            // Show success modal
            document.getElementById('manualSuccessName').textContent = mainName + '님, 환영합니다!';
            document.getElementById('manualModal').style.display = 'flex';
        }
    </script>

    <script>
      // Test deployment: avoid serving a stale preview from an older service worker.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations =>
          registrations.forEach(reg => reg.unregister())
        ).catch(() => {});
      }
    </script>
</body>

</html>
