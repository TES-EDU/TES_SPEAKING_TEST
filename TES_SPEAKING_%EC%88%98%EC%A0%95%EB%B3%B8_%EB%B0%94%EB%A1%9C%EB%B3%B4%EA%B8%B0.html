gs Card ── */\n.t-settings-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    box-shadow: var(--shadow-sm);\n    margin-bottom: var(--sp-4);\n    overflow: hidden;\n}\n\n.t-settings-title {\n    padding: var(--sp-4) var(--sp-5) 0;\n    font-size: var(--text-xs);\n    font-weight: 700;\n    color: var(--text-muted-soft);\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n}\n\n.t-setting-item {\n    display: flex;\n    align-items: center;\n    padding: var(--sp-4) var(--sp-5);\n    cursor: pointer;\n    transition: background var(--transition);\n    gap: var(--sp-3);\n    border-bottom: 1px solid var(--border-soft);\n    text-decoration: none;\n    color: inherit;\n}\n\n.t-setting-item:last-child { border-bottom: none; }\n.t-setting-item:hover { background: var(--surface-alt); }\n\n.t-setting-icon {\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n.t-setting-icon.primary  { background: rgba(119, 205, 208, 0.1); color: var(--primary-dark); }\n.t-setting-icon.teacher  { background: var(--teacher-pale); color: var(--teacher); }\n.t-setting-icon.orange   { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-setting-icon.correct  { background: var(--correct-pale); color: var(--correct); }\n.t-setting-icon.wrong    { background: var(--wrong-pale); color: var(--wrong); }\n.t-setting-icon.muted    { background: var(--surface-alt); color: var(--text-muted); }\n\n.t-setting-label {\n    font-weight: 600;\n    font-size: var(--text-sm);\n    color: var(--text-dark);\n}\n\n.t-setting-desc {\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: 2px;\n}\n\n.t-setting-arrow {\n    color: var(--text-muted-soft);\n    font-size: var(--text-lg);\n    margin-left: auto;\n}\n\n/* ── Teacher Stat Card (dashboard) ── */\n.t-stat-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    margin-bottom: var(--sp-4);\n}\n\n.t-stat-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n    text-align: center;\n}\n\n.t-stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 800;\n    color: var(--primary-dark);\n    line-height: 1;\n    letter-spacing: -0.02em;\n}\n\n.t-stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: var(--sp-1);\n    font-weight: 500;\n}\n\n/* ── Student Card ── */\n.t-student-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.t-student-card:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-sm);\n}\n\n.t-student-avatar {\n    width: 44px; height: 44px;\n    border-radius: 50%;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-weight: 700;\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n.t-student-name {\n    font-weight: 600;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.t-student-meta {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: 2px;\n}\n\n/* ── Filter Tabs ── */\n.t-filter-tabs {\n    display: flex;\n    background: var(--bg-gray);\n    border-radius: var(--radius-md);\n    padding: var(--sp-1);\n    margin-bottom: var(--sp-4);\n    gap: var(--sp-1);\n}\n\n.t-filter-tab {\n    flex: 1;\n    padding: var(--sp-2) var(--sp-3);\n    border: none;\n    border-radius: var(--radius-sm);\n    background: transparent;\n    font-family: inherit;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    transition: all 0.2s var(--ease);\n    white-space: nowrap;\n}\n\n.t-filter-tab.active {\n    background: var(--bg-white);\n    color: var(--text-dark);\n    box-shadow: var(--shadow-xs);\n    font-weight: 600;\n}\n\n/* ── Search Box ── */\n.t-search-box {\n    position: relative;\n    margin-bottom: var(--sp-4);\n}\n\n.t-search-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n    pointer-events: none;\n}\n\n.t-search-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: var(--bg-white);\n    color: var(--text-dark);\n    transition: border-color var(--transition), box-shadow var(--transition);\n    outline: none;\n}\n\n.t-search-input::placeholder { color: var(--text-muted-soft); }\n\n.t-search-input:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n/* ── Badge ── */\n.t-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-1);\n    padding: 2px var(--sp-2);\n    border-radius: var(--radius-full);\n    font-size: var(--text-xs);\n    font-weight: 600;\n    line-height: 1.4;\n}\n\n.t-badge.primary  { background: var(--primary-pale); color: var(--primary-dark); }\n.t-badge.correct   { background: var(--correct-pale); color: var(--correct-dark); }\n.t-badge.wrong     { background: var(--wrong-pale); color: var(--wrong-dark); }\n.t-badge.teacher   { background: var(--teacher-pale); color: var(--teacher); }\n.t-badge.orange    { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-badge.muted     { background: var(--surface-alt); color: var(--text-muted); }\n\n/* ── Teacher Modal ── */\n.t-modal-overlay {\n    display: none;\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    background: rgba(0, 0, 0, 0.4);\n    backdrop-filter: blur(4px);\n    z-index: 1000;\n    justify-content: center;\n    align-items: center;\n}\n\n.t-modal-overlay.active { display: flex; }\n\n.t-modal-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    width: 90%;\n    max-width: 400px;\n    box-shadow: var(--shadow-lg);\n    animation: t-slide-up 0.3s var(--ease);\n}\n\n.t-modal-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-modal-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n    margin-bottom: var(--sp-5);\n}\n\n.t-modal-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    outline: none;\n    transition: border-color var(--transition);\n    margin-bottom: var(--sp-4);\n    color: var(--text-dark);\n}\n\n.t-modal-input:focus { border-color: var(--primary); }\n\n.t-modal-actions {\n    display: flex;\n    gap: var(--sp-3);\n}\n\n.t-modal-btn {\n    flex: 1;\n    padding: var(--sp-3) var(--sp-4);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n}\n\n.t-modal-btn.cancel  { background: var(--surface-alt); color: var(--text-muted); }\n.t-modal-btn.confirm { background: var(--primary-dark); color: var(--text-white); }\n.t-modal-btn.danger  { background: var(--wrong); color: var(--text-white); }\n\n/* ── Teacher Form (styled inputs for auth pages) ── */\n.t-form-group {\n    text-align: left;\n    margin-bottom: var(--sp-4);\n}\n\n.t-form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-mid);\n    margin-bottom: var(--sp-2);\n}\n\n.t-input-wrapper { position: relative; }\n\n.t-input-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n}\n\n.t-form-input {\n    width: 100%;\n    padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: rgba(255, 255, 255, 0.8);\n    transition: all var(--transition);\n    outline: none;\n    color: var(--text-dark);\n}\n\n.t-form-input::placeholder { color: var(--text-muted-soft); }\n\n.t-form-input:focus {\n    border-color: var(--teacher);\n    background: var(--bg-white);\n    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);\n}\n\n/* ── Teacher Action Button (gradient) ── */\n.t-btn-action {\n    width: 100%;\n    padding: var(--sp-4);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    box-shadow: 0 4px 16px rgba(27, 122, 132, 0.25);\n}\n\n.t-btn-action:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 6px 20px rgba(27, 122, 132, 0.3);\n}\n\n.t-btn-action:active { transform: translateY(0); }\n\n/* ── Google OAuth Button ── */\n.t-btn-google {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    color: var(--text-dark);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 500;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-3);\n}\n\n.t-btn-google:hover {\n    border-color: var(--primary);\n    box-shadow: 0 4px 12px rgba(27, 122, 132, 0.1);\n    transform: translateY(-1px);\n}\n\n.t-btn-google img { width: 20px; height: 20px; }\n\n/* ── Empty State ── */\n.t-empty-state {\n    text-align: center;\n    padding: var(--sp-12) var(--sp-5);\n    color: var(--text-muted);\n}\n\n.t-empty-icon {\n    font-size: 3rem;\n    color: var(--text-muted-soft);\n    margin-bottom: var(--sp-4);\n}\n\n.t-empty-title {\n    font-size: var(--text-lg);\n    font-weight: 600;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-empty-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n}\n\n/* ── Teacher Logo Icon ── */\n.t-logo-icon {\n    width: 72px; height: 72px;\n    margin: 0 auto var(--sp-5);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    border-radius: var(--radius-xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    box-shadow: 0 8px 24px rgba(27, 122, 132, 0.25);\n}\n\n/* ── Profile Section ── */\n.t-profile-section {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n}\n\n.t-profile-avatar {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.2);\n    object-fit: cover;\n}\n\n.t-profile-avatar-placeholder {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.16);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-xl);\n    color: var(--text-white);\n}\n\n/* ── App Version ── */\n.t-app-version {\n    text-align: center;\n    padding: var(--sp-5);\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n/* ── Decorative Dots ── */\n.t-dots {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin-top: var(--sp-6);\n    margin-bottom: calc(var(--sp-2) * -1);\n}\n\n.t-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--primary-dark);\n    opacity: 0.12;\n}\n\n.t-dot.active {\n    opacity: 0.4;\n    width: 20px;\n    border-radius: var(--sp-1);\n}\n\n/* ── Academy Code Display ── */\n.t-code-display {\n    font-family: monospace;\n    font-size: var(--text-base);\n    font-weight: 700;\n    letter-spacing: 2px;\n    color: var(--teacher);\n    background: var(--teacher-pale);\n    padding: var(--sp-1) var(--sp-3);\n    border-radius: var(--radius-sm);\n}\n\n/* ── Divider ── */\n.t-divider {\n    display: flex;\n    align-items: center;\n    margin: var(--sp-5) 0;\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n.t-divider::before,\n.t-divider::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--border);\n}\n\n.t-divider::before { margin-right: var(--sp-3); }\n.t-divider::after  { margin-left: var(--sp-3); }\n\n/* ── Hint Text ── */\n.t-hint {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: var(--sp-4);\n}\n\n<\/style>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" name=\"viewport\"/>\n<title>4단계: 스피킹 녹화 - TES Speaking<\/title>\n\n\n<style>\n        body {\n            font-family: 'Noto Sans KR', sans-serif;\n        }\n\n        /* Set video preview to 4:3 aspect ratio to keep it compact on all devices */\n        #cameraSection video,\n        #previewSection video {\n            width: 100% !important;\n            max-width: 600px;\n            aspect-ratio: 4 / 3;\n            object-fit: cover;\n            margin: 0 auto;\n            display: block;\n        }\n    @media(max-width:600px){.page-content{padding:8px 12px!important}.page-content>div{gap:9px!important}.step-header{display:none!important}.progress-bar{display:none!important}.step-indicator{margin:3px!important}#cameraPreview,#videoPreview{max-height:25vh!important;object-fit:contain!important}#recordControls button{padding:10px!important;font-size:1rem!important}#recordControls{gap:3px!important}.card{padding:10px!important}.app-container{padding-bottom:100px!important}} <\/style>\n\n\n<link href=\"../manifest.json\" rel=\"manifest\"/>\n<style>\n.tes-step-dock{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:7px 8px;background:white;box-shadow:0 -2px 12px #0002;z-index:1100;max-width:600px;margin:auto}\n.tes-step-link{display:flex;flex-direction:column;align-items:center;text-decoration:none;border-radius:9px;background:#e9f1f2;color:#305458;padding:8px 1px;font-size:12px;line-height:1.4}.tes-step-link small{font-size:10px}.tes-step-link.active{background:#20858a;color:#fff}\n@media(max-width:600px){.app-container{padding-bottom:145px!important}.step-header{margin:5px 0!important}.step-title{font-size:1rem!important}.step-progress{padding:6px 12px!important}}\n<\/style><\/head>\n<body>\n<div class=\"app-container\" style=\"padding-bottom: 120px;\">\n<!-- Header -->\n<header class=\"app-header\">\n<a class=\"back-btn\" href=\"learn-step3.html\">←<\/a>\n<h1 class=\"header-title\">스피킹 녹화<\/h1>\n<div class=\"header-action\"><\/div>\n<\/header>\n<!-- Progress -->\n<div style=\"padding: 0 20px;\">\n<div class=\"progress-bar\">\n<div class=\"progress-fill\" style=\"width: 100%;\"><\/div>\n<\/div>\n<div class=\"step-indicator\">\n<span class=\"current\">4단계<\/span> / 4단계 (마지막!)\n            <\/div>\n<\/div>\n<div class=\"page-content\">\n<!-- Step Header -->\n<div class=\"step-header\">\n<span class=\"step-badge\"><i class=\"ti ti-video\"><\/i> 스피킹 녹화<\/span>\n<h2 class=\"step-title\">모든 문장을 읽고 녹화하세요<\/h2>\n<\/div>\n<!-- Centered Layout Container: Limits width on PC to match 4:3 video, adds vertical gaps -->\n<div style=\"max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n<!-- Video & Timer Section -->\n<div>\n<!-- Video Preview (hidden initially) -->\n<div class=\"hidden\" id=\"previewSection\">\n<video controls=\"\" id=\"videoPreview\" style=\"width: 100%; border-radius: var(--radius-lg); background: #000;\"><\/video>\n<\/div>\n<!-- Camera Preview -->\n<div id=\"cameraSection\">\n<video autoplay=\"\" id=\"cameraPreview\" muted=\"\" playsinline=\"\" style=\"width: 100%; border-radius: var(--radius-lg); background: #000; transform: scaleX(-1);\"><\/video>\n<\/div>\n<!-- Recording Timer -->\n<div class=\"text-center\" style=\"margin-top: 12px; height: 24px;\">\n<span class=\"hidden\" id=\"recordingTimer\" style=\"font-size: 1.5rem; font-weight: 700; color: var(--accent-coral);\">00:00<\/span>\n<\/div>\n<\/div>\n<!-- Sleek Recording Controls (moved closer to video, replaced large bottom circle) -->\n<div id=\"recordControls\" style=\"display: flex; flex-direction: column; gap: 8px;\">\n<button class=\"btn btn-primary btn-block\" id=\"recordBtn\" onclick=\"toggleRecording()\" style=\"padding: 16px; font-size: 1.125rem; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; box-shadow: var(--shadow-sm);\">\n<i class=\"ti ti-video\" style=\"font-size: 1.5rem;\"><\/i> <span>녹화 시작<\/span>\n<\/button>\n<p class=\"text-center text-gray\" id=\"recordHint\" style=\"font-size: 0.875rem; margin: 0;\">버튼을 눌러 녹화\n                        시작<\/p>\n<\/div>\n<!-- Sentences Reference -->\n<div class=\"card\" style=\"margin: 0; box-shadow: var(--shadow-sm);\">\n<!-- Toggle options for display -->\n<div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;\">\n<p class=\"text-gray\" style=\"font-size: 0.875rem; margin: 0;\">읽을 문장들:<\/p>\n<div style=\"display: flex; gap: 12px;\">\n<label style=\"display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-gray); cursor: pointer;\">\n<input id=\"showKorean\" onchange=\"renderSentences()\" style=\"width: 16px; height: 16px; accent-color: var(--primary);\" type=\"checkbox\"/>\n<span>한글<\/span>\n<\/label>\n<label style=\"display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-gray); cursor: pointer;\">\n<input checked=\"\" id=\"showEnglish\" onchange=\"renderSentences()\" style=\"width: 16px; height: 16px; accent-color: var(--primary);\" type=\"checkbox\"/>\n<span>영어<\/span>\n<\/label>\n<\/div>\n<\/div>\n<div id=\"sentenceList\" style=\"font-size: 0.9rem; max-height: 180px; overflow-y: auto;\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<!-- Action Buttons -->\n<div class=\"action-buttons hidden\" id=\"actionButtons\" style=\"gap: 12px; display: flex;\">\n<button class=\"btn btn-secondary\" onclick=\"retryRecording()\" style=\"flex: 1;\">다시 녹화<\/button>\n<button class=\"btn btn-primary\" onclick=\"saveAndComplete()\" style=\"flex: 2;\">저장하고 완료하기 →<\/button>\n<\/div>\n<\/div>\n\n\n\n\n<nav aria-label=\"학습 단계 이동\" class=\"tes-step-dock\"><a class=\"tes-step-link tes-step-1\" href=\"learn-step1.html\"><b>1단계<\/b><small>러닝<\/small><\/a><a class=\"tes-step-link tes-step-2\" href=\"learn-step2.html\"><b>2단계<\/b><small>발음 연습<\/small><\/a><a class=\"tes-step-link tes-step-3\" href=\"learn-step3.html\"><b>3단계<\/b><small>동시통역<\/small><\/a><a class=\"tes-step-link tes-step-4 active\" href=\"learn-step4.html\"><b>4단계<\/b><small>영상 녹화<\/small><\/a><\/nav><\/body>\n<\/html>"}, {"name": "학생 프로필", "html": "<!DOCTYPE html>\n\n<html lang=\"ko\">\n<head><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><style>/* ============================================\n   TES Speaking App\n   Design System v2.0\n   Font: Pretendard\n   Color: Turquoise Sunbeam Glow (#77CDD0 base)\n   ============================================ */\n\n@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');\n@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css');\n\n/* ============================================\n   Design Tokens\n   ============================================ */\n\n:root {\n    /* ── Brand Colors ── */\n    --primary:        #77CDD0;\n    --primary-dark:   #1B7A84;\n    --primary-mid:    #4FAFB3;\n    --primary-light:  #A8E6E8;\n    --primary-pale:   #E8F9FA;\n\n    /* ── Accent ── */\n    --accent-orange:  #F47C5A;\n    --accent-yellow:  #F5C248;\n    --accent-orange-pale: #FEF0EB;\n    --accent-yellow-pale: #FEF8E7;\n\n    /* ── Neutral ── */\n    --bg-white:  #FFFFFF;\n    --bg-light:  #F4FAFB;\n    --bg-gray:   #EEF4F5;\n    --bg-dark:   #1B3A3D;\n\n    /* ── Text ── */\n    --text-dark:  #1B3A3D;\n    --text-mid:   #3D6B6F;\n    --text-gray:  #5A7A7D;\n    --text-light: #9BBBBF;\n    --text-white: #FFFFFF;\n\n    /* ── Semantic Status (Sunbeam) ── */\n    --correct:        #2FA07E;\n    --correct-dark:   #1A7959;\n    --correct-pale:   #E6F5EF;\n    --wrong:          #E35D4F;\n    --wrong-dark:     #B8412F;\n    --wrong-pale:     #FCECEA;\n    --success:        #22C55E;\n    --warning:        #F59E0B;\n    --error:          #EF4444;\n\n    /* ── Teacher Accent ── */\n    --teacher:        #7C3AED;\n    --teacher-dark:   #6D28D9;\n    --teacher-light:  #A78BFA;\n    --teacher-pale:   #EDE9FE;\n\n    /* ── Border ── */\n    --border:         #E2E6E8;\n    --border-soft:    #EEF1F2;\n\n    /* ── Surface ── */\n    --surface-alt:    #F5F6F6;\n\n    /* ── Text (extended) ── */\n    --text-muted:     #6B7A7E;\n    --text-muted-soft: #A8B3B6;\n\n    /* ── Shadows (teal-tinted) ── */\n    --shadow-xs: 0 1px 4px rgba(27, 122, 132, 0.06);\n    --shadow-sm: 0 2px 8px rgba(27, 122, 132, 0.08);\n    --shadow-md: 0 4px 16px rgba(27, 122, 132, 0.12);\n    --shadow-lg: 0 8px 32px rgba(27, 122, 132, 0.16);\n\n    /* ── Radius ── */\n    --radius-sm:   8px;\n    --radius-md:   12px;\n    --radius-lg:   16px;\n    --radius-xl:   24px;\n    --radius-full: 9999px;\n\n    /* ── Spacing (8px grid) ── */\n    --sp-1:  4px;\n    --sp-2:  8px;\n    --sp-3:  12px;\n    --sp-4:  16px;\n    --sp-5:  20px;\n    --sp-6:  24px;\n    --sp-8:  32px;\n    --sp-10: 40px;\n    --sp-12: 48px;\n\n    /* ── Typography ── */\n    --text-xs:   0.75rem;   /* 12px */\n    --text-sm:   0.875rem;  /* 14px */\n    --text-base: 1rem;      /* 16px */\n    --text-lg:   1.125rem;  /* 18px */\n    --text-xl:   1.25rem;   /* 20px */\n    --text-2xl:  1.5rem;    /* 24px */\n    --text-3xl:  1.875rem;  /* 30px */\n\n    /* ── Transitions ── */\n    --ease:        cubic-bezier(0.4, 0, 0.2, 1);\n    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n    --transition:  0.2s cubic-bezier(0.4, 0, 0.2, 1);\n\n    /* ── Layout ── */\n    --app-max-width: 100%;\n    --safe-top:    env(safe-area-inset-top, 0px);\n    --safe-bottom: env(safe-area-inset-bottom, 0px);\n}\n\n/* ============================================\n   Reset\n   ============================================ */\n\n*, *::before, *::after {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\nhtml {\n    font-size: 16px;\n    -webkit-text-size-adjust: 100%;\n}\n\nbody {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n    background: var(--bg-light);\n    color: var(--text-dark);\n    line-height: 1.6;\n    min-height: 100vh;\n    min-height: 100dvh;\n    overflow-x: hidden;\n    -webkit-font-smoothing: antialiased;\n}\n\na {\n    text-decoration: none;\n    color: inherit;\n}\n\nbutton {\n    font-family: inherit;\n    cursor: pointer;\n    border: none;\n    background: none;\n}\n\ninput, textarea, select {\n    font-family: inherit;\n}\n\nimg {\n    max-width: 100%;\n    display: block;\n}\n\n/* ============================================\n   App Layout\n   ============================================ */\n\n.app-container {\n    min-height: 100vh;\n    min-height: 100dvh;\n    display: flex;\n    flex-direction: column;\n    background: var(--bg-light);\n    padding-top: var(--safe-top);\n    padding-bottom: calc(64px + var(--safe-bottom));\n    max-width: var(--app-max-width);\n    margin: 0 auto;\n    position: relative;\n}\n\n.page-content {\n    flex: 1;\n    padding: var(--sp-5);\n    width: 100%;\n}\n\n/* ============================================\n   Header\n   ============================================ */\n\n.app-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: var(--sp-3) var(--sp-5);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n    position: sticky;\n    top: 0;\n    z-index: 100;\n    height: 56px;\n}\n\n.back-btn {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    color: var(--text-dark);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n.back-btn:active {\n    background: var(--bg-gray);\n}\n\n.header-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.header-action {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n}\n\n/* ============================================\n   Step Progress\n   ============================================ */\n\n.step-progress {\n    padding: var(--sp-4) var(--sp-5) var(--sp-2);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n}\n\n.step-dots {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    margin-bottom: var(--sp-2);\n}\n\n.step-dot {\n    width: 8px;\n    height: 8px;\n    border-radius: var(--radius-full);\n    background: var(--bg-gray);\n    transition: all 0.3s var(--ease);\n}\n\n.step-dot.active {\n    width: 24px;\n    background: var(--primary-dark);\n}\n\n.step-dot.done {\n    background: var(--primary);\n}\n\n.step-label {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-light);\n    font-weight: 500;\n}\n\n.step-label span {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* Legacy progress bar (kept for compatibility) */\n.progress-bar {\n    height: 4px;\n    background: var(--bg-gray);\n    border-radius: var(--radius-full);\n    overflow: hidden;\n}\n\n.progress-fill {\n    height: 100%;\n    background: linear-gradient(90deg, var(--primary-dark) 0%, var(--primary) 100%);\n    border-radius: var(--radius-full);\n    transition: width 0.5s var(--ease);\n}\n\n.step-indicator {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    padding: var(--sp-2);\n    font-size: var(--text-sm);\n    color: var(--text-light);\n}\n\n.step-indicator .current {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* ============================================\n   Bottom Navigation\n   ============================================ */\n\n.bottom-nav {\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: var(--app-max-width);\n    height: calc(64px + var(--safe-bottom));\n    padding-bottom: var(--safe-bottom);\n    background: var(--bg-white);\n    border-top: 1px solid var(--bg-gray);\n    display: flex;\n    justify-content: space-around;\n    align-items: center;\n    z-index: 1000;\n}\n\n.nav-item {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 3px;\n    padding: var(--sp-2) var(--sp-4);\n    color: var(--text-light);\n    font-size: var(--text-xs);\n    font-weight: 500;\n    transition: var(--transition);\n    border-radius: var(--radius-md);\n    min-width: 56px;\n}\n\n.nav-item.active {\n    color: var(--primary-dark);\n}\n\n.nav-item.active .nav-icon {\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n}\n\n.nav-icon {\n    width: 32px;\n    height: 32px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n/* ============================================\n   Cards\n   ============================================ */\n\n.card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-5);\n    box-shadow: var(--shadow-sm);\n}\n\n.card-sm {\n    padding: var(--sp-4);\n    border-radius: var(--radius-md);\n}\n\n.card-clickable {\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.card-clickable:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-xs);\n}\n\n/* Stats Banner */\n.stats-banner {\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-6);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    position: relative;\n    overflow: hidden;\n}\n\n.stats-banner::after {\n    content: '';\n    position: absolute;\n    right: -20px;\n    top: -20px;\n    width: 120px;\n    height: 120px;\n    background: var(--primary);\n    border-radius: 50%;\n    opacity: 0.12;\n}\n\n.stats-banner-value {\n    font-size: var(--text-3xl);\n    font-weight: 700;\n    line-height: 1;\n}\n\n.stats-banner-label {\n    font-size: var(--text-sm);\n    color: var(--primary-light);\n    margin-top: var(--sp-1);\n}\n\n.stats-banner-right {\n    text-align: right;\n    position: relative;\n    z-index: 1;\n}\n\n.stats-banner-goal {\n    font-size: var(--text-xs);\n    color: var(--primary-light);\n}\n\n.stats-banner-progress {\n    font-size: var(--text-xl);\n    font-weight: 600;\n    margin-top: var(--sp-1);\n}\n\n/* Quick Start */\n.quick-start {\n    background: var(--primary-pale);\n    border: 1.5px solid var(--primary-light);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4) var(--sp-5);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.quick-start:active {\n    background: var(--primary-light);\n    transform: scale(0.99);\n}\n\n.quick-start-icon {\n    width: 44px;\n    height: 44px;\n    background: var(--primary);\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: var(--text-white);\n    font-size: var(--text-xl);\n    flex-shrink: 0;\n}\n\n.quick-start-body {\n    flex: 1;\n    min-width: 0;\n}\n\n.quick-start-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.quick-start-desc {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n}\n\n.quick-start-arrow {\n    color: var(--primary-dark);\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n/* Section Title */\n.section-title {\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-gray);\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    margin-bottom: var(--sp-3);\n}\n\n/* List Card */\n.list-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.list-card:active {\n    background: var(--bg-light);\n    transform: scale(0.99);\n}\n\n.list-icon {\n    width: 44px;\n    height: 44px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border-radius: var(--radius-md);\n    font-size: var(--text-xl);\n    flex-shrink: 0;\n}\n\n.list-content {\n    flex: 1;\n    min-width: 0;\n}\n\n.list-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.list-subtitle {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    margin-top: 2px;\n}\n\n.list-arrow {\n    color: var(--text-light);\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n/* ============================================\n   Sentence Card (Step Pages)\n   ============================================ */\n\n.sentence-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    text-align: center;\n    box-shadow: var(--shadow-md);\n}\n\n.sentence-kr {\n    font-size: var(--text-base);\n    color: var(--text-gray);\n    margin-bottom: var(--sp-4);\n    font-weight: 400;\n}\n\n.sentence-en {\n    font-size: var(--text-2xl);\n    font-weight: 700;\n    color: var(--text-dark);\n    line-height: 1.4;\n}\n\n.sentence-en .highlight {\n    color: var(--primary-dark);\n    background: var(--primary-pale);\n    padding: 2px var(--sp-2);\n    border-radius: var(--sp-1);\n}\n\n/* Swipe Sentence Container */\n.swipe-container {\n    position: relative;\n    overflow: hidden;\n    touch-action: pan-y;\n}\n\n.swipe-card {\n    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);\n    will-change: transform;\n}\n\n.swipe-card.slide-out-left {\n    transform: translateX(-100%);\n    opacity: 0;\n}\n\n.swipe-card.slide-out-right {\n    transform: translateX(100%);\n    opacity: 0;\n}\n\n.swipe-card.slide-in-left {\n    animation: slideFromRight 0.3s var(--ease) forwards;\n}\n\n.swipe-card.slide-in-right {\n    animation: slideFromLeft 0.3s var(--ease) forwards;\n}\n\n@keyframes slideFromRight {\n    from { transform: translateX(60px); opacity: 0; }\n    to   { transform: translateX(0);    opacity: 1; }\n}\n\n@keyframes slideFromLeft {\n    from { transform: translateX(-60px); opacity: 0; }\n    to   { transform: translateX(0);     opacity: 1; }\n}\n\n/* Sentence Counter Pills */\n.sentence-counter {\n    display: flex;\n    justify-content: center;\n    gap: var(--sp-1);\n    padding: var(--sp-3) 0;\n}\n\n.sentence-pip {\n    width: 6px;\n    height: 6px;\n    border-radius: var(--radius-full);\n    background: var(--bg-gray);\n    transition: all 0.25s var(--ease);\n}\n\n.sentence-pip.active {\n    width: 20px;\n    background: var(--primary-dark);\n}\n\n.sentence-pip.done {\n    background: var(--primary);\n}\n\n/* Sentence List (Step 1) */\n.sentence-list {\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-2);\n}\n\n.sentence-item {\n    background: var(--bg-white);\n    border-radius: var(--radius-md);\n    padding: var(--sp-4);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    box-shadow: var(--shadow-xs);\n    cursor: pointer;\n    transition: var(--transition);\n    border: 1.5px solid transparent;\n}\n\n.sentence-item:active {\n    transform: scale(0.99);\n}\n\n.sentence-item.active {\n    border-color: var(--primary);\n    background: var(--primary-pale);\n}\n\n.sentence-item.completed {\n    border-color: var(--primary-light);\n}\n\n.sentence-num {\n    width: 28px;\n    height: 28px;\n    background: var(--bg-gray);\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    flex-shrink: 0;\n    color: var(--text-gray);\n}\n\n.sentence-item.active .sentence-num {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.sentence-item.completed .sentence-num {\n    background: var(--primary);\n    color: var(--text-white);\n}\n\n.sentence-text {\n    flex: 1;\n}\n\n.sentence-text-en {\n    font-weight: 500;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.sentence-text-kr {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    margin-top: 2px;\n}\n\n.sentence-play {\n    color: var(--primary-dark);\n    font-size: var(--text-lg);\n}\n\n/* ============================================\n   Buttons\n   ============================================ */\n\n.btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    padding: var(--sp-3) var(--sp-6);\n    font-size: var(--text-base);\n    font-weight: 600;\n    border-radius: var(--radius-lg);\n    transition: var(--transition);\n    letter-spacing: -0.01em;\n}\n\n.btn-primary {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.btn-primary:active {\n    background: #155f68;\n    transform: scale(0.98);\n}\n\n.btn-secondary {\n    background: var(--bg-gray);\n    color: var(--text-mid);\n}\n\n.btn-secondary:active {\n    background: #dde8e9;\n}\n\n.btn-outline {\n    border: 1.5px solid var(--primary-dark);\n    color: var(--primary-dark);\n    background: transparent;\n}\n\n.btn-outline:active {\n    background: var(--primary-pale);\n}\n\n.btn-accent {\n    background: var(--accent-orange);\n    color: var(--text-white);\n}\n\n.btn-accent:active {\n    background: #e0673f;\n    transform: scale(0.98);\n}\n\n.btn-large {\n    padding: var(--sp-4) var(--sp-8);\n    font-size: var(--text-lg);\n    border-radius: var(--radius-xl);\n}\n\n.btn-block {\n    width: 100%;\n}\n\n.btn-icon {\n    width: 52px;\n    height: 52px;\n    padding: 0;\n    border-radius: var(--radius-full);\n    font-size: var(--text-xl);\n}\n\n/* Action Buttons Bar */\n.action-buttons {\n    display: flex;\n    gap: var(--sp-3);\n    padding: var(--sp-4) var(--sp-5);\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: var(--app-max-width);\n    background: var(--bg-white);\n    border-top: 1px solid var(--bg-gray);\n    box-sizing: border-box;\n    padding-bottom: calc(var(--sp-4) + var(--safe-bottom));\n    z-index: 100;\n}\n\n.action-buttons .btn {\n    flex: 1;\n}\n\n/* ============================================\n   Recording & TTS Buttons\n   ============================================ */\n\n.tts-btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 40px;\n    height: 40px;\n    border-radius: var(--radius-full);\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border: none;\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.tts-btn:active,\n.tts-btn.playing {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.record-btn-large {\n    width: 88px;\n    height: 88px;\n    border-radius: 50%;\n    background: var(--accent-orange);\n    color: var(--text-white);\n    font-size: var(--text-2xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    align-self: center;\n    margin: var(--sp-4) auto;\n    box-shadow: 0 8px 24px rgba(244, 124, 90, 0.35);\n    transition: transform 0.2s var(--ease-spring), box-shadow 0.2s var(--ease);\n    border: none;\n    cursor: pointer;\n    line-height: 1;\n}\n\n.record-btn-large i {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 100%;\n    height: 100%;\n    font-size: var(--text-2xl);\n    line-height: 1;\n}\n\n.record-btn-large:active {\n    transform: scale(0.95);\n}\n\n.record-btn-large.recording {\n    background: var(--error);\n    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);\n    animation: pulse-record 1.2s ease infinite;\n}\n\n@keyframes pulse-record {\n    0%   { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0.5); }\n    70%  { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0);   }\n    100% { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0);   }\n}\n\n/* Audio visualizer bars */\n.audio-bars {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 4px;\n    height: 36px;\n}\n\n.audio-bar {\n    width: 5px;\n    background: var(--primary);\n    border-radius: var(--radius-full);\n    transition: height 0.05s;\n    height: 4px;\n}\n\n/* ============================================\n   Accuracy Display\n   ============================================ */\n\n.accuracy-display {\n    text-align: center;\n    padding: var(--sp-4) 0;\n}\n\n.accuracy-circle {\n    width: 104px;\n    height: 104px;\n    border-radius: 50%;\n    background: conic-gradient(\n        var(--primary-dark) calc(var(--accuracy, 0) * 3.6deg),\n        var(--bg-gray) 0deg\n    );\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin: 0 auto var(--sp-3);\n    position: relative;\n}\n\n.accuracy-circle::before {\n    content: '';\n    width: 84px;\n    height: 84px;\n    background: var(--bg-white);\n    border-radius: 50%;\n    position: absolute;\n}\n\n.accuracy-value {\n    position: relative;\n    font-size: var(--text-xl);\n    font-weight: 700;\n    color: var(--primary-dark);\n}\n\n.accuracy-label {\n    color: var(--text-gray);\n    font-size: var(--text-sm);\n}\n\n/* Comparison result */\n.comparison-result {\n    margin: var(--sp-3) 0;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-md);\n    text-align: left;\n    font-size: var(--text-sm);\n    line-height: 1.8;\n    box-shadow: var(--shadow-xs);\n}\n\n/* ============================================\n   Step Badge\n   ============================================ */\n\n.step-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-2);\n    padding: var(--sp-2) var(--sp-3);\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border-radius: var(--radius-full);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    margin-bottom: var(--sp-2);\n}\n\n.step-header {\n    text-align: center;\n    padding: var(--sp-4) 0 var(--sp-2);\n}\n\n.step-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n}\n\n/* ============================================\n   Unit / Textbook Grid\n   ============================================ */\n\n.grid-2 {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: var(--sp-3);\n}\n\n.unit-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-5);\n    text-align: center;\n    box-shadow: var(--shadow-xs);\n    cursor: pointer;\n    transition: var(--transition);\n    border: 1.5px solid transparent;\n}\n\n.unit-card:active {\n    transform: scale(0.97);\n    border-color: var(--primary-light);\n}\n\n.unit-icon {\n    width: 52px;\n    height: 52px;\n    background: var(--primary-pale);\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin: 0 auto var(--sp-3);\n    color: var(--primary-dark);\n    font-size: var(--text-2xl);\n}\n\n.unit-name {\n    font-weight: 700;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n    margin-bottom: var(--sp-1);\n}\n\n.unit-progress {\n    font-size: var(--text-xs);\n    color: var(--text-gray);\n}\n\n/* ============================================\n   Complete Page\n   ============================================ */\n\n.complete-container {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: var(--sp-8) var(--sp-5);\n    text-align: center;\n}\n\n.complete-icon {\n    width: 96px;\n    height: 96px;\n    background: var(--accent-yellow-pale);\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 3rem;\n    margin-bottom: var(--sp-5);\n    animation: celebrate 0.6s var(--ease-spring);\n}\n\n@keyframes celebrate {\n    0%   { transform: scale(0) rotate(-10deg); opacity: 0; }\n    70%  { transform: scale(1.15) rotate(5deg); }\n    100% { transform: scale(1) rotate(0deg);   opacity: 1; }\n}\n\n.complete-title {\n    font-size: var(--text-3xl);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.complete-subtitle {\n    color: var(--text-gray);\n    font-size: var(--text-base);\n    margin-bottom: var(--sp-6);\n}\n\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    width: 100%;\n    margin-bottom: var(--sp-6);\n}\n\n.stat-item {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n}\n\n.stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 700;\n    color: var(--primary-dark);\n    line-height: 1;\n}\n\n.stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-gray);\n    margin-top: var(--sp-1);\n}\n\n.achievement-card {\n    width: 100%;\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-5);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    margin-bottom: var(--sp-6);\n    text-align: left;\n}\n\n.achievement-icon {\n    font-size: 2.5rem;\n    flex-shrink: 0;\n    color: var(--accent-yellow);\n}\n\n.achievement-title {\n    font-weight: 700;\n    font-size: var(--text-lg);\n}\n\n.achievement-desc {\n    font-size: var(--text-sm);\n    color: var(--primary-light);\n    margin-top: 2px;\n}\n\n.complete-actions {\n    width: 100%;\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-3);\n}\n\n.complete-actions-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: var(--sp-3);\n}\n\n/* ============================================\n   Form Elements\n   ============================================ */\n\n.form-group {\n    margin-bottom: var(--sp-5);\n}\n\n.form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-gray);\n    margin-bottom: var(--sp-2);\n}\n\n.form-input {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border: 1.5px solid var(--bg-gray);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    color: var(--text-dark);\n    transition: var(--transition);\n}\n\n.form-input:focus {\n    border-color: var(--primary);\n    outline: none;\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n.form-input::placeholder {\n    color: var(--text-light);\n}\n\n/* ============================================\n   Toast & Loading\n   ============================================ */\n\n.toast-container {\n    position: fixed;\n    top: calc(var(--sp-5) + var(--safe-top));\n    left: var(--sp-4);\n    right: var(--sp-4);\n    z-index: 2000;\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-2);\n    pointer-events: none;\n}\n\n.toast {\n    padding: var(--sp-4) var(--sp-5);\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 500;\n    animation: toastIn 0.25s var(--ease-spring);\n    pointer-events: auto;\n}\n\n@keyframes toastIn {\n    from { opacity: 0; transform: translateY(-12px) scale(0.96); }\n    to   { opacity: 1; transform: translateY(0) scale(1); }\n}\n\n.toast.success { background: #166534; }\n.toast.error   { background: #991B1B; }\n.toast.warning { background: #92400E; }\n\n.loading-overlay {\n    position: fixed;\n    inset: 0;\n    background: rgba(255, 255, 255, 0.88);\n    backdrop-filter: blur(4px);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    z-index: 9999;\n    gap: var(--sp-4);\n}\n\n.loading-spinner {\n    width: 40px;\n    height: 40px;\n    border: 3px solid var(--bg-gray);\n    border-top-color: var(--primary-dark);\n    border-radius: 50%;\n    animation: spin 0.8s linear infinite;\n}\n\n@keyframes spin {\n    to { transform: rotate(360deg); }\n}\n\n/* ============================================\n   Utilities\n   ============================================ */\n\n.hidden { display: none !important; }\n.text-center { text-align: center; }\n.text-primary { color: var(--primary-dark); }\n.text-gray { color: var(--text-gray); }\n\n.mt-1 { margin-top: var(--sp-2); }\n.mt-2 { margin-top: var(--sp-4); }\n.mt-3 { margin-top: var(--sp-6); }\n.mb-1 { margin-bottom: var(--sp-2); }\n.mb-2 { margin-bottom: var(--sp-4); }\n.mb-3 { margin-bottom: var(--sp-6); }\n.gap-1 { gap: var(--sp-2); }\n.gap-2 { gap: var(--sp-4); }\n\n/* ============================================\n   Responsive — Tablet First\n   ============================================ */\n\n@media (min-width: 768px) {\n    :root {\n        --app-max-width: 680px;\n    }\n\n    .page-content {\n        padding: var(--sp-6) var(--sp-8);\n    }\n\n    .grid-2 {\n        gap: var(--sp-4);\n    }\n\n    .sentence-card {\n        padding: var(--sp-10) var(--sp-8);\n    }\n\n    .sentence-en {\n        font-size: var(--text-3xl);\n    }\n\n    .record-btn-large {\n        width: 100px;\n        height: 100px;\n    }\n}\n\n@media (min-width: 1024px) {\n    :root {\n        --app-max-width: 800px;\n    }\n\n    .page-content {\n        padding: var(--sp-8) var(--sp-10);\n    }\n}\n\n/* ============================================\n   Teacher Pages — Common Components\n   ============================================ */\n\n/* ── Fullscreen Auth Layout (Login, Setup, Callback) ── */\n.t-auth-body {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--bg-light);\n    overflow: hidden;\n    position: relative;\n}\n\n.t-auth-bg-orb {\n    position: fixed;\n    border-radius: 50%;\n    filter: blur(80px);\n    opacity: 0.25;\n    animation: t-float 10s ease-in-out infinite;\n    pointer-events: none;\n    z-index: 0;\n}\n\n.t-auth-bg-orb:nth-child(1) {\n    width: 260px; height: 260px;\n    background: radial-gradient(circle, var(--teacher) 0%, transparent 70%);\n    top: -60px; right: -40px;\n    animation-duration: 11s;\n}\n\n.t-auth-bg-orb:nth-child(2) {\n    width: 220px; height: 220px;\n    background: radial-gradient(circle, var(--primary-mid) 0%, transparent 70%);\n    bottom: -50px; left: -30px;\n    animation-duration: 13s; animation-delay: -4s;\n}\n\n.t-auth-bg-orb:nth-child(3) {\n    width: 160px; height: 160px;\n    background: radial-gradient(circle, var(--primary-light) 0%, transparent 70%);\n    top: 40%; left: 15%;\n    animation-duration: 9s; animation-delay: -2s;\n}\n\n@keyframes t-float {\n    0%, 100% { transform: translateY(0) scale(1); }\n    50%      { transform: translateY(-24px) scale(1.04); }\n}\n\n.t-auth-card {\n    position: relative;\n    z-index: 1;\n    width: 92%;\n    max-width: 440px;\n    background: rgba(255, 255, 255, 0.78);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid rgba(255, 255, 255, 0.6);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-12) var(--sp-8) var(--sp-10);\n    box-shadow: var(--shadow-md);\n    text-align: center;\n    animation: t-slide-up 0.5s var(--ease);\n}\n\n@keyframes t-slide-up {\n    from { opacity: 0; transform: translateY(24px); }\n    to   { opacity: 1; transform: translateY(0); }\n}\n\n/* ── Teacher Page Header (gradient banner) ── */\n.t-page-header {\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    padding: var(--sp-5) var(--sp-5) var(--sp-12);\n    position: relative;\n}\n\n.t-header-nav {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: var(--sp-6);\n}\n\n.t-header-back {\n    background: rgba(255, 255, 255, 0.16);\n    border: none;\n    color: white;\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    cursor: pointer;\n    font-size: var(--text-lg);\n    text-decoration: none;\n    transition: background var(--transition);\n}\n\n.t-header-back:hover { background: rgba(255, 255, 255, 0.24); }\n\n.t-header-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n}\n\n/* ── Content Area (overlaps header) ── */\n.t-content {\n    padding: 0 var(--sp-4) var(--sp-10);\n    margin-top: calc(var(--sp-10) * -1);\n    position: relative;\n    z-index: 1;\n}\n\n/* ── Settings Card ── */\n.t-settings-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    box-shadow: var(--shadow-sm);\n    margin-bottom: var(--sp-4);\n    overflow: hidden;\n}\n\n.t-settings-title {\n    padding: var(--sp-4) var(--sp-5) 0;\n    font-size: var(--text-xs);\n    font-weight: 700;\n    color: var(--text-muted-soft);\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n}\n\n.t-setting-item {\n    display: flex;\n    align-items: center;\n    padding: var(--sp-4) var(--sp-5);\n    cursor: pointer;\n    transition: background var(--transition);\n    gap: var(--sp-3);\n    border-bottom: 1px solid var(--border-soft);\n    text-decoration: none;\n    color: inherit;\n}\n\n.t-setting-item:last-child { border-bottom: none; }\n.t-setting-item:hover { background: var(--surface-alt); }\n\n.t-setting-icon {\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n.t-setting-icon.primary  { background: rgba(119, 205, 208, 0.1); color: var(--primary-dark); }\n.t-setting-icon.teacher  { background: var(--teacher-pale); color: var(--teacher); }\n.t-setting-icon.orange   { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-setting-icon.correct  { background: var(--correct-pale); color: var(--correct); }\n.t-setting-icon.wrong    { background: var(--wrong-pale); color: var(--wrong); }\n.t-setting-icon.muted    { background: var(--surface-alt); color: var(--text-muted); }\n\n.t-setting-label {\n    font-weight: 600;\n    font-size: var(--text-sm);\n    color: var(--text-dark);\n}\n\n.t-setting-desc {\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: 2px;\n}\n\n.t-setting-arrow {\n    color: var(--text-muted-soft);\n    font-size: var(--text-lg);\n    margin-left: auto;\n}\n\n/* ── Teacher Stat Card (dashboard) ── */\n.t-stat-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    margin-bottom: var(--sp-4);\n}\n\n.t-stat-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n    text-align: center;\n}\n\n.t-stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 800;\n    color: var(--primary-dark);\n    line-height: 1;\n    letter-spacing: -0.02em;\n}\n\n.t-stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: var(--sp-1);\n    font-weight: 500;\n}\n\n/* ── Student Card ── */\n.t-student-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.t-student-card:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-sm);\n}\n\n.t-student-avatar {\n    width: 44px; height: 44px;\n    border-radius: 50%;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-weight: 700;\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n.t-student-name {\n    font-weight: 600;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.t-student-meta {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: 2px;\n}\n\n/* ── Filter Tabs ── */\n.t-filter-tabs {\n    display: flex;\n    background: var(--bg-gray);\n    border-radius: var(--radius-md);\n    padding: var(--sp-1);\n    margin-bottom: var(--sp-4);\n    gap: var(--sp-1);\n}\n\n.t-filter-tab {\n    flex: 1;\n    padding: var(--sp-2) var(--sp-3);\n    border: none;\n    border-radius: var(--radius-sm);\n    background: transparent;\n    font-family: inherit;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    transition: all 0.2s var(--ease);\n    white-space: nowrap;\n}\n\n.t-filter-tab.active {\n    background: var(--bg-white);\n    color: var(--text-dark);\n    box-shadow: var(--shadow-xs);\n    font-weight: 600;\n}\n\n/* ── Search Box ── */\n.t-search-box {\n    position: relative;\n    margin-bottom: var(--sp-4);\n}\n\n.t-search-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n    pointer-events: none;\n}\n\n.t-search-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: var(--bg-white);\n    color: var(--text-dark);\n    transition: border-color var(--transition), box-shadow var(--transition);\n    outline: none;\n}\n\n.t-search-input::placeholder { color: var(--text-muted-soft); }\n\n.t-search-input:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n/* ── Badge ── */\n.t-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-1);\n    padding: 2px var(--sp-2);\n    border-radius: var(--radius-full);\n    font-size: var(--text-xs);\n    font-weight: 600;\n    line-height: 1.4;\n}\n\n.t-badge.primary  { background: var(--primary-pale); color: var(--primary-dark); }\n.t-badge.correct   { background: var(--correct-pale); color: var(--correct-dark); }\n.t-badge.wrong     { background: var(--wrong-pale); color: var(--wrong-dark); }\n.t-badge.teacher   { background: var(--teacher-pale); color: var(--teacher); }\n.t-badge.orange    { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-badge.muted     { background: var(--surface-alt); color: var(--text-muted); }\n\n/* ── Teacher Modal ── */\n.t-modal-overlay {\n    display: none;\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    background: rgba(0, 0, 0, 0.4);\n    backdrop-filter: blur(4px);\n    z-index: 1000;\n    justify-content: center;\n    align-items: center;\n}\n\n.t-modal-overlay.active { display: flex; }\n\n.t-modal-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    width: 90%;\n    max-width: 400px;\n    box-shadow: var(--shadow-lg);\n    animation: t-slide-up 0.3s var(--ease);\n}\n\n.t-modal-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-modal-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n    margin-bottom: var(--sp-5);\n}\n\n.t-modal-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    outline: none;\n    transition: border-color var(--transition);\n    margin-bottom: var(--sp-4);\n    color: var(--text-dark);\n}\n\n.t-modal-input:focus { border-color: var(--primary); }\n\n.t-modal-actions {\n    display: flex;\n    gap: var(--sp-3);\n}\n\n.t-modal-btn {\n    flex: 1;\n    padding: var(--sp-3) var(--sp-4);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n}\n\n.t-modal-btn.cancel  { background: var(--surface-alt); color: var(--text-muted); }\n.t-modal-btn.confirm { background: var(--primary-dark); color: var(--text-white); }\n.t-modal-btn.danger  { background: var(--wrong); color: var(--text-white); }\n\n/* ── Teacher Form (styled inputs for auth pages) ── */\n.t-form-group {\n    text-align: left;\n    margin-bottom: var(--sp-4);\n}\n\n.t-form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-mid);\n    margin-bottom: var(--sp-2);\n}\n\n.t-input-wrapper { position: relative; }\n\n.t-input-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n}\n\n.t-form-input {\n    width: 100%;\n    padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: rgba(255, 255, 255, 0.8);\n    transition: all var(--transition);\n    outline: none;\n    color: var(--text-dark);\n}\n\n.t-form-input::placeholder { color: var(--text-muted-soft); }\n\n.t-form-input:focus {\n    border-color: var(--teacher);\n    background: var(--bg-white);\n    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);\n}\n\n/* ── Teacher Action Button (gradient) ── */\n.t-btn-action {\n    width: 100%;\n    padding: var(--sp-4);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    box-shadow: 0 4px 16px rgba(27, 122, 132, 0.25);\n}\n\n.t-btn-action:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 6px 20px rgba(27, 122, 132, 0.3);\n}\n\n.t-btn-action:active { transform: translateY(0); }\n\n/* ── Google OAuth Button ── */\n.t-btn-google {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    color: var(--text-dark);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 500;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-3);\n}\n\n.t-btn-google:hover {\n    border-color: var(--primary);\n    box-shadow: 0 4px 12px rgba(27, 122, 132, 0.1);\n    transform: translateY(-1px);\n}\n\n.t-btn-google img { width: 20px; height: 20px; }\n\n/* ── Empty State ── */\n.t-empty-state {\n    text-align: center;\n    padding: var(--sp-12) var(--sp-5);\n    color: var(--text-muted);\n}\n\n.t-empty-icon {\n    font-size: 3rem;\n    color: var(--text-muted-soft);\n    margin-bottom: var(--sp-4);\n}\n\n.t-empty-title {\n    font-size: var(--text-lg);\n    font-weight: 600;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-empty-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n}\n\n/* ── Teacher Logo Icon ── */\n.t-logo-icon {\n    width: 72px; height: 72px;\n    margin: 0 auto var(--sp-5);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    border-radius: var(--radius-xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    box-shadow: 0 8px 24px rgba(27, 122, 132, 0.25);\n}\n\n/* ── Profile Section ── */\n.t-profile-section {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n}\n\n.t-profile-avatar {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.2);\n    object-fit: cover;\n}\n\n.t-profile-avatar-placeholder {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.16);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-xl);\n    color: var(--text-white);\n}\n\n/* ── App Version ── */\n.t-app-version {\n    text-align: center;\n    padding: var(--sp-5);\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n/* ── Decorative Dots ── */\n.t-dots {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin-top: var(--sp-6);\n    margin-bottom: calc(var(--sp-2) * -1);\n}\n\n.t-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--primary-dark);\n    opacity: 0.12;\n}\n\n.t-dot.active {\n    opacity: 0.4;\n    width: 20px;\n    border-radius: var(--sp-1);\n}\n\n/* ── Academy Code Display ── */\n.t-code-display {\n    font-family: monospace;\n    font-size: var(--text-base);\n    font-weight: 700;\n    letter-spacing: 2px;\n    color: var(--teacher);\n    background: var(--teacher-pale);\n    padding: var(--sp-1) var(--sp-3);\n    border-radius: var(--radius-sm);\n}\n\n/* ── Divider ── */\n.t-divider {\n    display: flex;\n    align-items: center;\n    margin: var(--sp-5) 0;\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n.t-divider::before,\n.t-divider::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--border);\n}\n\n.t-divider::before { margin-right: var(--sp-3); }\n.t-divider::after  { margin-left: var(--sp-3); }\n\n/* ── Hint Text ── */\n.t-hint {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: var(--sp-4);\n}\n\n<\/style>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" name=\"viewport\"/>\n<title>프로필 - TES Speaking<\/title>\n\n\n<style>\n        body {\n            font-family: 'Noto Sans KR', sans-serif;\n        }\n\n        .profile-header {\n            text-align: center;\n            padding: 32px 20px;\n            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);\n            color: white;\n            border-radius: 0 0 32px 32px;\n            margin: -20px -20px 24px -20px;\n        }\n\n        .profile-avatar {\n            width: 80px;\n            height: 80px;\n            background: white;\n            border-radius: 50%;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 2.5rem;\n            margin: 0 auto 16px;\n        }\n\n        .profile-name {\n            font-size: 1.5rem;\n            font-weight: 700;\n            margin-bottom: 4px;\n        }\n\n        .profile-level {\n            font-size: 0.9rem;\n            opacity: 0.9;\n        }\n\n        .menu-section {\n            margin-bottom: 24px;\n        }\n\n        .menu-section-title {\n            font-size: 0.85rem;\n            color: var(--text-gray);\n            font-weight: 500;\n            margin-bottom: 12px;\n            padding-left: 4px;\n        }\n\n        .menu-item {\n            display: flex;\n            align-items: center;\n            padding: 16px;\n            background: var(--bg-white);\n            border-radius: var(--radius-lg);\n            margin-bottom: 8px;\n            cursor: pointer;\n            transition: var(--transition);\n        }\n\n        .menu-item:hover {\n            background: var(--bg-light);\n        }\n\n        .menu-icon {\n            width: 40px;\n            height: 40px;\n            background: var(--primary-pale);\n            border-radius: 12px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 1.25rem;\n            margin-right: 16px;\n        }\n\n        .menu-content {\n            flex: 1;\n        }\n\n        .menu-title {\n            font-weight: 500;\n            color: var(--text-dark);\n        }\n\n        .menu-subtitle {\n            font-size: 0.8rem;\n            color: var(--text-gray);\n        }\n\n        .menu-arrow {\n            color: var(--text-light);\n        }\n\n        .logout-btn {\n            width: 100%;\n            padding: 16px;\n            background: transparent;\n            border: 2px solid var(--accent-coral);\n            color: var(--accent-coral);\n            border-radius: var(--radius-lg);\n            font-size: 1rem;\n            font-weight: 500;\n            cursor: pointer;\n            transition: var(--transition);\n        }\n\n        .logout-btn:hover {\n            background: var(--accent-coral);\n            color: white;\n        }\n     .profile-header{padding:12px!important;margin-bottom:10px!important}.profile-avatar{width:42px!important;height:42px!important;margin-bottom:4px!important}.profile-name{font-size:1.15rem!important}.menu-section{margin-bottom:10px!important}.menu-item{padding:11px!important}.logout-btn{padding:10px!important} <\/style>\n\n\n<link href=\"../manifest.json\" rel=\"manifest\"/>\n<\/head>\n<body>\n<div class=\"app-container\">\n<div class=\"page-content\">\n<!-- Profile Header -->\n<div class=\"profile-header\">\n<div class=\"profile-avatar\"><i class=\"ti ti-user\" style=\"color: var(--primary);\"><\/i><\/div>\n<div class=\"profile-name\" id=\"userName\">학생<\/div>\n<div class=\"profile-level\" id=\"userLevel\">레벨 미설정<\/div>\n<\/div>\n<div class=\"menu-section\"><div class=\"menu-section-title\">녹화 영상<\/div><div class=\"menu-item\" onclick=\"location.href='recordings.html'\"><div class=\"menu-icon\"><i class=\"ti ti-video\"><\/i><\/div><div class=\"menu-content\"><div class=\"menu-title\">녹화 영상<\/div><div class=\"menu-subtitle\">최신순으로 확인<\/div><\/div><span class=\"menu-arrow\"><i class=\"ti ti-chevron-right\"><\/i><\/span><\/div><\/div>\n<div class=\"menu-section\"><div class=\"menu-section-title\">설정<\/div><div class=\"menu-item\" onclick=\"resetData()\"><div class=\"menu-icon\"><i class=\"ti ti-trash\"><\/i><\/div><div class=\"menu-content\"><div class=\"menu-title\">데이터 초기화<\/div><div class=\"menu-subtitle\">학습 기록 삭제<\/div><\/div><span class=\"menu-arrow\"><i class=\"ti ti-chevron-right\"><\/i><\/span><\/div><\/div>\n<!-- Logout -->\n<button class=\"logout-btn\" onclick=\"logout()\">로그아웃<\/button>\n<\/div>\n<!-- Bottom Navigation -->\n<nav class=\"bottom-nav\"><a class=\"nav-item\" href=\"class.html\"><span class=\"nav-icon\"><i class=\"ti ti-home\"><\/i><\/span><span>홈<\/span><\/a><a class=\"nav-item\" href=\"profile.html\"><span class=\"nav-icon\"><i class=\"ti ti-user\"><\/i><\/span><span>프로필<\/span><\/a><\/nav>\n<\/div>\n\n\n\n<\/body>\n<\/html>"}, {"name": "지점 선택", "html": "<!DOCTYPE html>\n<html lang=\"ko\"><head><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><style>/* ============================================\n   TES Speaking App\n   Design System v2.0\n   Font: Pretendard\n   Color: Turquoise Sunbeam Glow (#77CDD0 base)\n   ============================================ */\n\n@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');\n@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css');\n\n/* ============================================\n   Design Tokens\n   ============================================ */\n\n:root {\n    /* ── Brand Colors ── */\n    --primary:        #77CDD0;\n    --primary-dark:   #1B7A84;\n    --primary-mid:    #4FAFB3;\n    --primary-light:  #A8E6E8;\n    --primary-pale:   #E8F9FA;\n\n    /* ── Accent ── */\n    --accent-orange:  #F47C5A;\n    --accent-yellow:  #F5C248;\n    --accent-orange-pale: #FEF0EB;\n    --accent-yellow-pale: #FEF8E7;\n\n    /* ── Neutral ── */\n    --bg-white:  #FFFFFF;\n    --bg-light:  #F4FAFB;\n    --bg-gray:   #EEF4F5;\n    --bg-dark:   #1B3A3D;\n\n    /* ── Text ── */\n    --text-dark:  #1B3A3D;\n    --text-mid:   #3D6B6F;\n    --text-gray:  #5A7A7D;\n    --text-light: #9BBBBF;\n    --text-white: #FFFFFF;\n\n    /* ── Semantic Status (Sunbeam) ── */\n    --correct:        #2FA07E;\n    --correct-dark:   #1A7959;\n    --correct-pale:   #E6F5EF;\n    --wrong:          #E35D4F;\n    --wrong-dark:     #B8412F;\n    --wrong-pale:     #FCECEA;\n    --success:        #22C55E;\n    --warning:        #F59E0B;\n    --error:          #EF4444;\n\n    /* ── Teacher Accent ── */\n    --teacher:        #7C3AED;\n    --teacher-dark:   #6D28D9;\n    --teacher-light:  #A78BFA;\n    --teacher-pale:   #EDE9FE;\n\n    /* ── Border ── */\n    --border:         #E2E6E8;\n    --border-soft:    #EEF1F2;\n\n    /* ── Surface ── */\n    --surface-alt:    #F5F6F6;\n\n    /* ── Text (extended) ── */\n    --text-muted:     #6B7A7E;\n    --text-muted-soft: #A8B3B6;\n\n    /* ── Shadows (teal-tinted) ── */\n    --shadow-xs: 0 1px 4px rgba(27, 122, 132, 0.06);\n    --shadow-sm: 0 2px 8px rgba(27, 122, 132, 0.08);\n    --shadow-md: 0 4px 16px rgba(27, 122, 132, 0.12);\n    --shadow-lg: 0 8px 32px rgba(27, 122, 132, 0.16);\n\n    /* ── Radius ── */\n    --radius-sm:   8px;\n    --radius-md:   12px;\n    --radius-lg:   16px;\n    --radius-xl:   24px;\n    --radius-full: 9999px;\n\n    /* ── Spacing (8px grid) ── */\n    --sp-1:  4px;\n    --sp-2:  8px;\n    --sp-3:  12px;\n    --sp-4:  16px;\n    --sp-5:  20px;\n    --sp-6:  24px;\n    --sp-8:  32px;\n    --sp-10: 40px;\n    --sp-12: 48px;\n\n    /* ── Typography ── */\n    --text-xs:   0.75rem;   /* 12px */\n    --text-sm:   0.875rem;  /* 14px */\n    --text-base: 1rem;      /* 16px */\n    --text-lg:   1.125rem;  /* 18px */\n    --text-xl:   1.25rem;   /* 20px */\n    --text-2xl:  1.5rem;    /* 24px */\n    --text-3xl:  1.875rem;  /* 30px */\n\n    /* ── Transitions ── */\n    --ease:        cubic-bezier(0.4, 0, 0.2, 1);\n    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n    --transition:  0.2s cubic-bezier(0.4, 0, 0.2, 1);\n\n    /* ── Layout ── */\n    --app-max-width: 100%;\n    --safe-top:    env(safe-area-inset-top, 0px);\n    --safe-bottom: env(safe-area-inset-bottom, 0px);\n}\n\n/* ============================================\n   Reset\n   ============================================ */\n\n*, *::before, *::after {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\nhtml {\n    font-size: 16px;\n    -webkit-text-size-adjust: 100%;\n}\n\nbody {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n    background: var(--bg-light);\n    color: var(--text-dark);\n    line-height: 1.6;\n    min-height: 100vh;\n    min-height: 100dvh;\n    overflow-x: hidden;\n    -webkit-font-smoothing: antialiased;\n}\n\na {\n    text-decoration: none;\n    color: inherit;\n}\n\nbutton {\n    font-family: inherit;\n    cursor: pointer;\n    border: none;\n    background: none;\n}\n\ninput, textarea, select {\n    font-family: inherit;\n}\n\nimg {\n    max-width: 100%;\n    display: block;\n}\n\n/* ============================================\n   App Layout\n   ============================================ */\n\n.app-container {\n    min-height: 100vh;\n    min-height: 100dvh;\n    display: flex;\n    flex-direction: column;\n    background: var(--bg-light);\n    padding-top: var(--safe-top);\n    padding-bottom: calc(64px + var(--safe-bottom));\n    max-width: var(--app-max-width);\n    margin: 0 auto;\n    position: relative;\n}\n\n.page-content {\n    flex: 1;\n    padding: var(--sp-5);\n    width: 100%;\n}\n\n/* ============================================\n   Header\n   ============================================ */\n\n.app-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: var(--sp-3) var(--sp-5);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n    position: sticky;\n    top: 0;\n    z-index: 100;\n    height: 56px;\n}\n\n.back-btn {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    color: var(--text-dark);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n.back-btn:active {\n    background: var(--bg-gray);\n}\n\n.header-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.header-action {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n}\n\n/* ============================================\n   Step Progress\n   ============================================ */\n\n.step-progress {\n    padding: var(--sp-4) var(--sp-5) var(--sp-2);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n}\n\n.step-dots {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    margin-bottom: var(--sp-2);\n}\n\n.step-dot {\n    width: 8px;\n    height: 8px;\n    border-radius: var(--radius-full);\n    background: var(--bg-gray);\n    transition: all 0.3s var(--ease);\n}\n\n.step-dot.active {\n    width: 24px;\n    background: var(--primary-dark);\n}\n\n.step-dot.done {\n    background: var(--primary);\n}\n\n.step-label {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-light);\n    font-weight: 500;\n}\n\n.step-label span {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* Legacy progress bar (kept for compatibility) */\n.progress-bar {\n    height: 4px;\n    background: var(--bg-gray);\n    border-radius: var(--radius-full);\n    overflow: hidden;\n}\n\n.progress-fill {\n    height: 100%;\n    background: linear-gradient(90deg, var(--primary-dark) 0%, var(--primary) 100%);\n    border-radius: var(--radius-full);\n    transition: width 0.5s var(--ease);\n}\n\n.step-indicator {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    padding: var(--sp-2);\n    font-size: var(--text-sm);\n    color: var(--text-light);\n}\n\n.step-indicator .current {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* ============================================\n   Bottom Navigation\n   ============================================ */\n\n.bottom-nav {\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: var(--app-max-width);\n    height: calc(64px + var(--safe-bottom));\n    padding-bottom: var(--safe-bottom);\n    background: var(--bg-white);\n    border-top: 1px solid var(--bg-gray);\n    display: flex;\n    justify-content: space-around;\n    align-items: center;\n    z-index: 1000;\n}\n\n.nav-item {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 3px;\n    padding: var(--sp-2) var(--sp-4);\n    color: var(--text-light);\n    font-size: var(--text-xs);\n    font-weight: 500;\n    transition: var(--transition);\n    border-radius: var(--radius-md);\n    min-width: 56px;\n}\n\n.nav-item.active {\n    color: var(--primary-dark);\n}\n\n.nav-item.active .nav-icon {\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n}\n\n.nav-icon {\n    width: 32px;\n    height: 32px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n/* ============================================\n   Cards\n   ============================================ */\n\n.card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-5);\n    box-shadow: var(--shadow-sm);\n}\n\n.card-sm {\n    padding: var(--sp-4);\n    border-radius: var(--radius-md);\n}\n\n.card-clickable {\n    cursor: pointer;\n    transition: tra
