12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: rgba(255, 255, 255, 0.8);\n    transition: all var(--transition);\n    outline: none;\n    color: var(--text-dark);\n}\n\n.t-form-input::placeholder { color: var(--text-muted-soft); }\n\n.t-form-input:focus {\n    border-color: var(--teacher);\n    background: var(--bg-white);\n    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);\n}\n\n/* ── Teacher Action Button (gradient) ── */\n.t-btn-action {\n    width: 100%;\n    padding: var(--sp-4);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    box-shadow: 0 4px 16px rgba(27, 122, 132, 0.25);\n}\n\n.t-btn-action:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 6px 20px rgba(27, 122, 132, 0.3);\n}\n\n.t-btn-action:active { transform: translateY(0); }\n\n/* ── Google OAuth Button ── */\n.t-btn-google {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    color: var(--text-dark);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 500;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-3);\n}\n\n.t-btn-google:hover {\n    border-color: var(--primary);\n    box-shadow: 0 4px 12px rgba(27, 122, 132, 0.1);\n    transform: translateY(-1px);\n}\n\n.t-btn-google img { width: 20px; height: 20px; }\n\n/* ── Empty State ── */\n.t-empty-state {\n    text-align: center;\n    padding: var(--sp-12) var(--sp-5);\n    color: var(--text-muted);\n}\n\n.t-empty-icon {\n    font-size: 3rem;\n    color: var(--text-muted-soft);\n    margin-bottom: var(--sp-4);\n}\n\n.t-empty-title {\n    font-size: var(--text-lg);\n    font-weight: 600;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-empty-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n}\n\n/* ── Teacher Logo Icon ── */\n.t-logo-icon {\n    width: 72px; height: 72px;\n    margin: 0 auto var(--sp-5);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    border-radius: var(--radius-xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    box-shadow: 0 8px 24px rgba(27, 122, 132, 0.25);\n}\n\n/* ── Profile Section ── */\n.t-profile-section {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n}\n\n.t-profile-avatar {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.2);\n    object-fit: cover;\n}\n\n.t-profile-avatar-placeholder {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.16);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-xl);\n    color: var(--text-white);\n}\n\n/* ── App Version ── */\n.t-app-version {\n    text-align: center;\n    padding: var(--sp-5);\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n/* ── Decorative Dots ── */\n.t-dots {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin-top: var(--sp-6);\n    margin-bottom: calc(var(--sp-2) * -1);\n}\n\n.t-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--primary-dark);\n    opacity: 0.12;\n}\n\n.t-dot.active {\n    opacity: 0.4;\n    width: 20px;\n    border-radius: var(--sp-1);\n}\n\n/* ── Academy Code Display ── */\n.t-code-display {\n    font-family: monospace;\n    font-size: var(--text-base);\n    font-weight: 700;\n    letter-spacing: 2px;\n    color: var(--teacher);\n    background: var(--teacher-pale);\n    padding: var(--sp-1) var(--sp-3);\n    border-radius: var(--radius-sm);\n}\n\n/* ── Divider ── */\n.t-divider {\n    display: flex;\n    align-items: center;\n    margin: var(--sp-5) 0;\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n.t-divider::before,\n.t-divider::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--border);\n}\n\n.t-divider::before { margin-right: var(--sp-3); }\n.t-divider::after  { margin-left: var(--sp-3); }\n\n/* ── Hint Text ── */\n.t-hint {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: var(--sp-4);\n}\n\n<\/style><meta charset=\"utf-8\"/><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/><title>지점 관리자 로그인 · TES Speaking<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:#19383c;font-family:system-ui,\"Noto Sans KR\",sans-serif}.shell{width:min(440px,100%);min-height:100vh;margin:auto;padding:34px 18px}h1{font-size:23px;margin:12px 0 4px}p{color:#698084;font-size:13px}a{text-decoration:none;color:inherit}.option{display:block;background:white;padding:17px;margin:10px 0;border:1px solid #e0e9e9;border-radius:13px;font-weight:600;cursor:pointer}.option:hover{border-color:#2c9396}.tiny{display:block;text-align:center;font-size:12px;color:#84979b;margin-top:25px}input{display:block;width:100%;height:46px;padding:12px;border:1px solid #d5dfdf;border-radius:9px;font-size:17px;margin:16px 0}.btn{display:block;width:100%;background:#238b90;color:white;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer}.note{border:1px solid #d2dddd;background:#fff;border-radius:10px;padding:13px;font-size:12px;line-height:1.6;color:#526467;margin-top:20px}.back{display:block;font-size:13px;color:#60757a;margin-bottom:20px}<\/style><\/head><body><main class=\"shell\"><a class=\"back\" href=\"login.html\">← 지점 선택<\/a><h1 id=\"branchName\">지점 관리자<\/h1><p>관리자 비밀번호 4자리를 입력하세요<\/p><form id=\"branchLogin\" onsubmit=\"return false\"><input id=\"pin\" inputmode=\"numeric\" maxlength=\"4\" pattern=\"[0-9]{4}\" placeholder=\"비밀번호 4자리\" required=\"\" type=\"password\"/><button class=\"btn\">관리자 대시보드 입장<\/button><\/form><div class=\"note\" id=\"message\">서버 인증 연결이 필요합니다. 연결 전에는 실제 학생 영상이나 개인정보에 접근할 수 없습니다.<\/div><\/main><\/body><\/html>"}, {"name": "관리자 화면", "html": "<!DOCTYPE html>\n\n<html lang=\"ko\">\n<!--\n  ─────────────────────────────────────────────────────────────────────────\n  TES Speaking · Teacher Dashboard (Sunbeam Bento Redesign)\n  ─────────────────────────────────────────────────────────────────────────\n  · Drop-in replacement for the original `teacher/dashboard.html`.\n  · Keeps the same external deps (../css/style.css, ../js/supabase.js,\n    Tabler Icons, favicon, manifest) and the same JS data hooks\n    (getTeacherSession, getCurrentAcademy, getStudents, getSupabase,\n    teacherLogout). Only the layout + presentation changed.\n  · Responsive (single file, CSS media queries):\n      - Mobile  ≤ 767px   bottom tab bar (홈/학생/교재/학습반/녹화관리)\n      - Tablet  768–1199  collapsed icon sidebar + 2-col bento\n      - Desktop ≥ 1200    full sidebar + 3-col bento grid\n  · Design tokens come from sunbeam.css (--primary, --bg-light, etc.).\n    If you fork this into another route, just keep the link to that\n    stylesheet — no hard-coded hex values are used in the new CSS below.\n  ─────────────────────────────────────────────────────────────────────────\n-->\n<head><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><style>/* ============================================\n   TES Speaking App\n   Design System v2.0\n   Font: Pretendard\n   Color: Turquoise Sunbeam Glow (#77CDD0 base)\n   ============================================ */\n\n@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');\n@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css');\n\n/* ============================================\n   Design Tokens\n   ============================================ */\n\n:root {\n    /* ── Brand Colors ── */\n    --primary:        #77CDD0;\n    --primary-dark:   #1B7A84;\n    --primary-mid:    #4FAFB3;\n    --primary-light:  #A8E6E8;\n    --primary-pale:   #E8F9FA;\n\n    /* ── Accent ── */\n    --accent-orange:  #F47C5A;\n    --accent-yellow:  #F5C248;\n    --accent-orange-pale: #FEF0EB;\n    --accent-yellow-pale: #FEF8E7;\n\n    /* ── Neutral ── */\n    --bg-white:  #FFFFFF;\n    --bg-light:  #F4FAFB;\n    --bg-gray:   #EEF4F5;\n    --bg-dark:   #1B3A3D;\n\n    /* ── Text ── */\n    --text-dark:  #1B3A3D;\n    --text-mid:   #3D6B6F;\n    --text-gray:  #5A7A7D;\n    --text-light: #9BBBBF;\n    --text-white: #FFFFFF;\n\n    /* ── Semantic Status (Sunbeam) ── */\n    --correct:        #2FA07E;\n    --correct-dark:   #1A7959;\n    --correct-pale:   #E6F5EF;\n    --wrong:          #E35D4F;\n    --wrong-dark:     #B8412F;\n    --wrong-pale:     #FCECEA;\n    --success:        #22C55E;\n    --warning:        #F59E0B;\n    --error:          #EF4444;\n\n    /* ── Teacher Accent ── */\n    --teacher:        #7C3AED;\n    --teacher-dark:   #6D28D9;\n    --teacher-light:  #A78BFA;\n    --teacher-pale:   #EDE9FE;\n\n    /* ── Border ── */\n    --border:         #E2E6E8;\n    --border-soft:    #EEF1F2;\n\n    /* ── Surface ── */\n    --surface-alt:    #F5F6F6;\n\n    /* ── Text (extended) ── */\n    --text-muted:     #6B7A7E;\n    --text-muted-soft: #A8B3B6;\n\n    /* ── Shadows (teal-tinted) ── */\n    --shadow-xs: 0 1px 4px rgba(27, 122, 132, 0.06);\n    --shadow-sm: 0 2px 8px rgba(27, 122, 132, 0.08);\n    --shadow-md: 0 4px 16px rgba(27, 122, 132, 0.12);\n    --shadow-lg: 0 8px 32px rgba(27, 122, 132, 0.16);\n\n    /* ── Radius ── */\n    --radius-sm:   8px;\n    --radius-md:   12px;\n    --radius-lg:   16px;\n    --radius-xl:   24px;\n    --radius-full: 9999px;\n\n    /* ── Spacing (8px grid) ── */\n    --sp-1:  4px;\n    --sp-2:  8px;\n    --sp-3:  12px;\n    --sp-4:  16px;\n    --sp-5:  20px;\n    --sp-6:  24px;\n    --sp-8:  32px;\n    --sp-10: 40px;\n    --sp-12: 48px;\n\n    /* ── Typography ── */\n    --text-xs:   0.75rem;   /* 12px */\n    --text-sm:   0.875rem;  /* 14px */\n    --text-base: 1rem;      /* 16px */\n    --text-lg:   1.125rem;  /* 18px */\n    --text-xl:   1.25rem;   /* 20px */\n    --text-2xl:  1.5rem;    /* 24px */\n    --text-3xl:  1.875rem;  /* 30px */\n\n    /* ── Transitions ── */\n    --ease:        cubic-bezier(0.4, 0, 0.2, 1);\n    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n    --transition:  0.2s cubic-bezier(0.4, 0, 0.2, 1);\n\n    /* ── Layout ── */\n    --app-max-width: 100%;\n    --safe-top:    env(safe-area-inset-top, 0px);\n    --safe-bottom: env(safe-area-inset-bottom, 0px);\n}\n\n/* ============================================\n   Reset\n   ============================================ */\n\n*, *::before, *::after {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\nhtml {\n    font-size: 16px;\n    -webkit-text-size-adjust: 100%;\n}\n\nbody {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n    background: var(--bg-light);\n    color: var(--text-dark);\n    line-height: 1.6;\n    min-height: 100vh;\n    min-height: 100dvh;\n    overflow-x: hidden;\n    -webkit-font-smoothing: antialiased;\n}\n\na {\n    text-decoration: none;\n    color: inherit;\n}\n\nbutton {\n    font-family: inherit;\n    cursor: pointer;\n    border: none;\n    background: none;\n}\n\ninput, textarea, select {\n    font-family: inherit;\n}\n\nimg {\n    max-width: 100%;\n    display: block;\n}\n\n/* ============================================\n   App Layout\n   ============================================ */\n\n.app-container {\n    min-height: 100vh;\n    min-height: 100dvh;\n    display: flex;\n    flex-direction: column;\n    background: var(--bg-light);\n    padding-top: var(--safe-top);\n    padding-bottom: calc(64px + var(--safe-bottom));\n    max-width: var(--app-max-width);\n    margin: 0 auto;\n    position: relative;\n}\n\n.page-content {\n    flex: 1;\n    padding: var(--sp-5);\n    width: 100%;\n}\n\n/* ============================================\n   Header\n   ============================================ */\n\n.app-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: var(--sp-3) var(--sp-5);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n    position: sticky;\n    top: 0;\n    z-index: 100;\n    height: 56px;\n}\n\n.back-btn {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    color: var(--text-dark);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n.back-btn:active {\n    background: var(--bg-gray);\n}\n\n.header-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.header-action {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n}\n\n/* ============================================\n   Step Progress\n   ============================================ */\n\n.step-progress {\n    padding: var(--sp-4) var(--sp-5) var(--sp-2);\n    background: var(--bg-white);\n    border-bottom: 1px solid var(--bg-gray);\n}\n\n.step-dots {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    margin-bottom: var(--sp-2);\n}\n\n.step-dot {\n    width: 8px;\n    height: 8px;\n    border-radius: var(--radius-full);\n    background: var(--bg-gray);\n    transition: all 0.3s var(--ease);\n}\n\n.step-dot.active {\n    width: 24px;\n    background: var(--primary-dark);\n}\n\n.step-dot.done {\n    background: var(--primary);\n}\n\n.step-label {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-light);\n    font-weight: 500;\n}\n\n.step-label span {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* Legacy progress bar (kept for compatibility) */\n.progress-bar {\n    height: 4px;\n    background: var(--bg-gray);\n    border-radius: var(--radius-full);\n    overflow: hidden;\n}\n\n.progress-fill {\n    height: 100%;\n    background: linear-gradient(90deg, var(--primary-dark) 0%, var(--primary) 100%);\n    border-radius: var(--radius-full);\n    transition: width 0.5s var(--ease);\n}\n\n.step-indicator {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    padding: var(--sp-2);\n    font-size: var(--text-sm);\n    color: var(--text-light);\n}\n\n.step-indicator .current {\n    color: var(--primary-dark);\n    font-weight: 600;\n}\n\n/* ============================================\n   Bottom Navigation\n   ============================================ */\n\n.bottom-nav {\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: var(--app-max-width);\n    height: calc(64px + var(--safe-bottom));\n    padding-bottom: var(--safe-bottom);\n    background: var(--bg-white);\n    border-top: 1px solid var(--bg-gray);\n    display: flex;\n    justify-content: space-around;\n    align-items: center;\n    z-index: 1000;\n}\n\n.nav-item {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 3px;\n    padding: var(--sp-2) var(--sp-4);\n    color: var(--text-light);\n    font-size: var(--text-xs);\n    font-weight: 500;\n    transition: var(--transition);\n    border-radius: var(--radius-md);\n    min-width: 56px;\n}\n\n.nav-item.active {\n    color: var(--primary-dark);\n}\n\n.nav-item.active .nav-icon {\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n}\n\n.nav-icon {\n    width: 32px;\n    height: 32px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    font-size: var(--text-lg);\n    transition: var(--transition);\n}\n\n/* ============================================\n   Cards\n   ============================================ */\n\n.card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-5);\n    box-shadow: var(--shadow-sm);\n}\n\n.card-sm {\n    padding: var(--sp-4);\n    border-radius: var(--radius-md);\n}\n\n.card-clickable {\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.card-clickable:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-xs);\n}\n\n/* Stats Banner */\n.stats-banner {\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-6);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    position: relative;\n    overflow: hidden;\n}\n\n.stats-banner::after {\n    content: '';\n    position: absolute;\n    right: -20px;\n    top: -20px;\n    width: 120px;\n    height: 120px;\n    background: var(--primary);\n    border-radius: 50%;\n    opacity: 0.12;\n}\n\n.stats-banner-value {\n    font-size: var(--text-3xl);\n    font-weight: 700;\n    line-height: 1;\n}\n\n.stats-banner-label {\n    font-size: var(--text-sm);\n    color: var(--primary-light);\n    margin-top: var(--sp-1);\n}\n\n.stats-banner-right {\n    text-align: right;\n    position: relative;\n    z-index: 1;\n}\n\n.stats-banner-goal {\n    font-size: var(--text-xs);\n    color: var(--primary-light);\n}\n\n.stats-banner-progress {\n    font-size: var(--text-xl);\n    font-weight: 600;\n    margin-top: var(--sp-1);\n}\n\n/* Quick Start */\n.quick-start {\n    background: var(--primary-pale);\n    border: 1.5px solid var(--primary-light);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4) var(--sp-5);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.quick-start:active {\n    background: var(--primary-light);\n    transform: scale(0.99);\n}\n\n.quick-start-icon {\n    width: 44px;\n    height: 44px;\n    background: var(--primary);\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: var(--text-white);\n    font-size: var(--text-xl);\n    flex-shrink: 0;\n}\n\n.quick-start-body {\n    flex: 1;\n    min-width: 0;\n}\n\n.quick-start-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.quick-start-desc {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n}\n\n.quick-start-arrow {\n    color: var(--primary-dark);\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n/* Section Title */\n.section-title {\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-gray);\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    margin-bottom: var(--sp-3);\n}\n\n/* List Card */\n.list-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.list-card:active {\n    background: var(--bg-light);\n    transform: scale(0.99);\n}\n\n.list-icon {\n    width: 44px;\n    height: 44px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border-radius: var(--radius-md);\n    font-size: var(--text-xl);\n    flex-shrink: 0;\n}\n\n.list-content {\n    flex: 1;\n    min-width: 0;\n}\n\n.list-title {\n    font-size: var(--text-base);\n    font-weight: 600;\n    color: var(--text-dark);\n}\n\n.list-subtitle {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    margin-top: 2px;\n}\n\n.list-arrow {\n    color: var(--text-light);\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n/* ============================================\n   Sentence Card (Step Pages)\n   ============================================ */\n\n.sentence-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    text-align: center;\n    box-shadow: var(--shadow-md);\n}\n\n.sentence-kr {\n    font-size: var(--text-base);\n    color: var(--text-gray);\n    margin-bottom: var(--sp-4);\n    font-weight: 400;\n}\n\n.sentence-en {\n    font-size: var(--text-2xl);\n    font-weight: 700;\n    color: var(--text-dark);\n    line-height: 1.4;\n}\n\n.sentence-en .highlight {\n    color: var(--primary-dark);\n    background: var(--primary-pale);\n    padding: 2px var(--sp-2);\n    border-radius: var(--sp-1);\n}\n\n/* Swipe Sentence Container */\n.swipe-container {\n    position: relative;\n    overflow: hidden;\n    touch-action: pan-y;\n}\n\n.swipe-card {\n    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);\n    will-change: transform;\n}\n\n.swipe-card.slide-out-left {\n    transform: translateX(-100%);\n    opacity: 0;\n}\n\n.swipe-card.slide-out-right {\n    transform: translateX(100%);\n    opacity: 0;\n}\n\n.swipe-card.slide-in-left {\n    animation: slideFromRight 0.3s var(--ease) forwards;\n}\n\n.swipe-card.slide-in-right {\n    animation: slideFromLeft 0.3s var(--ease) forwards;\n}\n\n@keyframes slideFromRight {\n    from { transform: translateX(60px); opacity: 0; }\n    to   { transform: translateX(0);    opacity: 1; }\n}\n\n@keyframes slideFromLeft {\n    from { transform: translateX(-60px); opacity: 0; }\n    to   { transform: translateX(0);     opacity: 1; }\n}\n\n/* Sentence Counter Pills */\n.sentence-counter {\n    display: flex;\n    justify-content: center;\n    gap: var(--sp-1);\n    padding: var(--sp-3) 0;\n}\n\n.sentence-pip {\n    width: 6px;\n    height: 6px;\n    border-radius: var(--radius-full);\n    background: var(--bg-gray);\n    transition: all 0.25s var(--ease);\n}\n\n.sentence-pip.active {\n    width: 20px;\n    background: var(--primary-dark);\n}\n\n.sentence-pip.done {\n    background: var(--primary);\n}\n\n/* Sentence List (Step 1) */\n.sentence-list {\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-2);\n}\n\n.sentence-item {\n    background: var(--bg-white);\n    border-radius: var(--radius-md);\n    padding: var(--sp-4);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    box-shadow: var(--shadow-xs);\n    cursor: pointer;\n    transition: var(--transition);\n    border: 1.5px solid transparent;\n}\n\n.sentence-item:active {\n    transform: scale(0.99);\n}\n\n.sentence-item.active {\n    border-color: var(--primary);\n    background: var(--primary-pale);\n}\n\n.sentence-item.completed {\n    border-color: var(--primary-light);\n}\n\n.sentence-num {\n    width: 28px;\n    height: 28px;\n    background: var(--bg-gray);\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    flex-shrink: 0;\n    color: var(--text-gray);\n}\n\n.sentence-item.active .sentence-num {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.sentence-item.completed .sentence-num {\n    background: var(--primary);\n    color: var(--text-white);\n}\n\n.sentence-text {\n    flex: 1;\n}\n\n.sentence-text-en {\n    font-weight: 500;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.sentence-text-kr {\n    font-size: var(--text-sm);\n    color: var(--text-gray);\n    margin-top: 2px;\n}\n\n.sentence-play {\n    color: var(--primary-dark);\n    font-size: var(--text-lg);\n}\n\n/* ============================================\n   Buttons\n   ============================================ */\n\n.btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-2);\n    padding: var(--sp-3) var(--sp-6);\n    font-size: var(--text-base);\n    font-weight: 600;\n    border-radius: var(--radius-lg);\n    transition: var(--transition);\n    letter-spacing: -0.01em;\n}\n\n.btn-primary {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.btn-primary:active {\n    background: #155f68;\n    transform: scale(0.98);\n}\n\n.btn-secondary {\n    background: var(--bg-gray);\n    color: var(--text-mid);\n}\n\n.btn-secondary:active {\n    background: #dde8e9;\n}\n\n.btn-outline {\n    border: 1.5px solid var(--primary-dark);\n    color: var(--primary-dark);\n    background: transparent;\n}\n\n.btn-outline:active {\n    background: var(--primary-pale);\n}\n\n.btn-accent {\n    background: var(--accent-orange);\n    color: var(--text-white);\n}\n\n.btn-accent:active {\n    background: #e0673f;\n    transform: scale(0.98);\n}\n\n.btn-large {\n    padding: var(--sp-4) var(--sp-8);\n    font-size: var(--text-lg);\n    border-radius: var(--radius-xl);\n}\n\n.btn-block {\n    width: 100%;\n}\n\n.btn-icon {\n    width: 52px;\n    height: 52px;\n    padding: 0;\n    border-radius: var(--radius-full);\n    font-size: var(--text-xl);\n}\n\n/* Action Buttons Bar */\n.action-buttons {\n    display: flex;\n    gap: var(--sp-3);\n    padding: var(--sp-4) var(--sp-5);\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: var(--app-max-width);\n    background: var(--bg-white);\n    border-top: 1px solid var(--bg-gray);\n    box-sizing: border-box;\n    padding-bottom: calc(var(--sp-4) + var(--safe-bottom));\n    z-index: 100;\n}\n\n.action-buttons .btn {\n    flex: 1;\n}\n\n/* ============================================\n   Recording & TTS Buttons\n   ============================================ */\n\n.tts-btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 40px;\n    height: 40px;\n    border-radius: var(--radius-full);\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border: none;\n    cursor: pointer;\n    transition: var(--transition);\n}\n\n.tts-btn:active,\n.tts-btn.playing {\n    background: var(--primary-dark);\n    color: var(--text-white);\n}\n\n.record-btn-large {\n    width: 88px;\n    height: 88px;\n    border-radius: 50%;\n    background: var(--accent-orange);\n    color: var(--text-white);\n    font-size: var(--text-2xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    align-self: center;\n    margin: var(--sp-4) auto;\n    box-shadow: 0 8px 24px rgba(244, 124, 90, 0.35);\n    transition: transform 0.2s var(--ease-spring), box-shadow 0.2s var(--ease);\n    border: none;\n    cursor: pointer;\n    line-height: 1;\n}\n\n.record-btn-large i {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 100%;\n    height: 100%;\n    font-size: var(--text-2xl);\n    line-height: 1;\n}\n\n.record-btn-large:active {\n    transform: scale(0.95);\n}\n\n.record-btn-large.recording {\n    background: var(--error);\n    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);\n    animation: pulse-record 1.2s ease infinite;\n}\n\n@keyframes pulse-record {\n    0%   { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0.5); }\n    70%  { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0);   }\n    100% { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0);   }\n}\n\n/* Audio visualizer bars */\n.audio-bars {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 4px;\n    height: 36px;\n}\n\n.audio-bar {\n    width: 5px;\n    background: var(--primary);\n    border-radius: var(--radius-full);\n    transition: height 0.05s;\n    height: 4px;\n}\n\n/* ============================================\n   Accuracy Display\n   ============================================ */\n\n.accuracy-display {\n    text-align: center;\n    padding: var(--sp-4) 0;\n}\n\n.accuracy-circle {\n    width: 104px;\n    height: 104px;\n    border-radius: 50%;\n    background: conic-gradient(\n        var(--primary-dark) calc(var(--accuracy, 0) * 3.6deg),\n        var(--bg-gray) 0deg\n    );\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin: 0 auto var(--sp-3);\n    position: relative;\n}\n\n.accuracy-circle::before {\n    content: '';\n    width: 84px;\n    height: 84px;\n    background: var(--bg-white);\n    border-radius: 50%;\n    position: absolute;\n}\n\n.accuracy-value {\n    position: relative;\n    font-size: var(--text-xl);\n    font-weight: 700;\n    color: var(--primary-dark);\n}\n\n.accuracy-label {\n    color: var(--text-gray);\n    font-size: var(--text-sm);\n}\n\n/* Comparison result */\n.comparison-result {\n    margin: var(--sp-3) 0;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-md);\n    text-align: left;\n    font-size: var(--text-sm);\n    line-height: 1.8;\n    box-shadow: var(--shadow-xs);\n}\n\n/* ============================================\n   Step Badge\n   ============================================ */\n\n.step-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-2);\n    padding: var(--sp-2) var(--sp-3);\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    border-radius: var(--radius-full);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    margin-bottom: var(--sp-2);\n}\n\n.step-header {\n    text-align: center;\n    padding: var(--sp-4) 0 var(--sp-2);\n}\n\n.step-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n}\n\n/* ============================================\n   Unit / Textbook Grid\n   ============================================ */\n\n.grid-2 {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: var(--sp-3);\n}\n\n.unit-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-5);\n    text-align: center;\n    box-shadow: var(--shadow-xs);\n    cursor: pointer;\n    transition: var(--transition);\n    border: 1.5px solid transparent;\n}\n\n.unit-card:active {\n    transform: scale(0.97);\n    border-color: var(--primary-light);\n}\n\n.unit-icon {\n    width: 52px;\n    height: 52px;\n    background: var(--primary-pale);\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin: 0 auto var(--sp-3);\n    color: var(--primary-dark);\n    font-size: var(--text-2xl);\n}\n\n.unit-name {\n    font-weight: 700;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n    margin-bottom: var(--sp-1);\n}\n\n.unit-progress {\n    font-size: var(--text-xs);\n    color: var(--text-gray);\n}\n\n/* ============================================\n   Complete Page\n   ============================================ */\n\n.complete-container {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: var(--sp-8) var(--sp-5);\n    text-align: center;\n}\n\n.complete-icon {\n    width: 96px;\n    height: 96px;\n    background: var(--accent-yellow-pale);\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 3rem;\n    margin-bottom: var(--sp-5);\n    animation: celebrate 0.6s var(--ease-spring);\n}\n\n@keyframes celebrate {\n    0%   { transform: scale(0) rotate(-10deg); opacity: 0; }\n    70%  { transform: scale(1.15) rotate(5deg); }\n    100% { transform: scale(1) rotate(0deg);   opacity: 1; }\n}\n\n.complete-title {\n    font-size: var(--text-3xl);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.complete-subtitle {\n    color: var(--text-gray);\n    font-size: var(--text-base);\n    margin-bottom: var(--sp-6);\n}\n\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    width: 100%;\n    margin-bottom: var(--sp-6);\n}\n\n.stat-item {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n}\n\n.stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 700;\n    color: var(--primary-dark);\n    line-height: 1;\n}\n\n.stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-gray);\n    margin-top: var(--sp-1);\n}\n\n.achievement-card {\n    width: 100%;\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-5);\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n    margin-bottom: var(--sp-6);\n    text-align: left;\n}\n\n.achievement-icon {\n    font-size: 2.5rem;\n    flex-shrink: 0;\n    color: var(--accent-yellow);\n}\n\n.achievement-title {\n    font-weight: 700;\n    font-size: var(--text-lg);\n}\n\n.achievement-desc {\n    font-size: var(--text-sm);\n    color: var(--primary-light);\n    margin-top: 2px;\n}\n\n.complete-actions {\n    width: 100%;\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-3);\n}\n\n.complete-actions-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: var(--sp-3);\n}\n\n/* ============================================\n   Form Elements\n   ============================================ */\n\n.form-group {\n    margin-bottom: var(--sp-5);\n}\n\n.form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-gray);\n    margin-bottom: var(--sp-2);\n}\n\n.form-input {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border: 1.5px solid var(--bg-gray);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    color: var(--text-dark);\n    transition: var(--transition);\n}\n\n.form-input:focus {\n    border-color: var(--primary);\n    outline: none;\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n.form-input::placeholder {\n    color: var(--text-light);\n}\n\n/* ============================================\n   Toast & Loading\n   ============================================ */\n\n.toast-container {\n    position: fixed;\n    top: calc(var(--sp-5) + var(--safe-top));\n    left: var(--sp-4);\n    right: var(--sp-4);\n    z-index: 2000;\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-2);\n    pointer-events: none;\n}\n\n.toast {\n    padding: var(--sp-4) var(--sp-5);\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 500;\n    animation: toastIn 0.25s var(--ease-spring);\n    pointer-events: auto;\n}\n\n@keyframes toastIn {\n    from { opacity: 0; transform: translateY(-12px) scale(0.96); }\n    to   { opacity: 1; transform: translateY(0) scale(1); }\n}\n\n.toast.success { background: #166534; }\n.toast.error   { background: #991B1B; }\n.toast.warning { background: #92400E; }\n\n.loading-overlay {\n    position: fixed;\n    inset: 0;\n    background: rgba(255, 255, 255, 0.88);\n    backdrop-filter: blur(4px);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    z-index: 9999;\n    gap: var(--sp-4);\n}\n\n.loading-spinner {\n    width: 40px;\n    height: 40px;\n    border: 3px solid var(--bg-gray);\n    border-top-color: var(--primary-dark);\n    border-radius: 50%;\n    animation: spin 0.8s linear infinite;\n}\n\n@keyframes spin {\n    to { transform: rotate(360deg); }\n}\n\n/* ============================================\n   Utilities\n   ============================================ */\n\n.hidden { display: none !important; }\n.text-center { text-align: center; }\n.text-primary { color: var(--primary-dark); }\n.text-gray { color: var(--text-gray); }\n\n.mt-1 { margin-top: var(--sp-2); }\n.mt-2 { margin-top: var(--sp-4); }\n.mt-3 { margin-top: var(--sp-6); }\n.mb-1 { margin-bottom: var(--sp-2); }\n.mb-2 { margin-bottom: var(--sp-4); }\n.mb-3 { margin-bottom: var(--sp-6); }\n.gap-1 { gap: var(--sp-2); }\n.gap-2 { gap: var(--sp-4); }\n\n/* ============================================\n   Responsive — Tablet First\n   ============================================ */\n\n@media (min-width: 768px) {\n    :root {\n        --app-max-width: 680px;\n    }\n\n    .page-content {\n        padding: var(--sp-6) var(--sp-8);\n    }\n\n    .grid-2 {\n        gap: var(--sp-4);\n    }\n\n    .sentence-card {\n        padding: var(--sp-10) var(--sp-8);\n    }\n\n    .sentence-en {\n        font-size: var(--text-3xl);\n    }\n\n    .record-btn-large {\n        width: 100px;\n        height: 100px;\n    }\n}\n\n@media (min-width: 1024px) {\n    :root {\n        --app-max-width: 800px;\n    }\n\n    .page-content {\n        padding: var(--sp-8) var(--sp-10);\n    }\n}\n\n/* ============================================\n   Teacher Pages — Common Components\n   ============================================ */\n\n/* ── Fullscreen Auth Layout (Login, Setup, Callback) ── */\n.t-auth-body {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--bg-light);\n    overflow: hidden;\n    position: relative;\n}\n\n.t-auth-bg-orb {\n    position: fixed;\n    border-radius: 50%;\n    filter: blur(80px);\n    opacity: 0.25;\n    animation: t-float 10s ease-in-out infinite;\n    pointer-events: none;\n    z-index: 0;\n}\n\n.t-auth-bg-orb:nth-child(1) {\n    width: 260px; height: 260px;\n    background: radial-gradient(circle, var(--teacher) 0%, transparent 70%);\n    top: -60px; right: -40px;\n    animation-duration: 11s;\n}\n\n.t-auth-bg-orb:nth-child(2) {\n    width: 220px; height: 220px;\n    background: radial-gradient(circle, var(--primary-mid) 0%, transparent 70%);\n    bottom: -50px; left: -30px;\n    animation-duration: 13s; animation-delay: -4s;\n}\n\n.t-auth-bg-orb:nth-child(3) {\n    width: 160px; height: 160px;\n    background: radial-gradient(circle, var(--primary-light) 0%, transparent 70%);\n    top: 40%; left: 15%;\n    animation-duration: 9s; animation-delay: -2s;\n}\n\n@keyframes t-float {\n    0%, 100% { transform: translateY(0) scale(1); }\n    50%      { transform: translateY(-24px) scale(1.04); }\n}\n\n.t-auth-card {\n    position: relative;\n    z-index: 1;\n    width: 92%;\n    max-width: 440px;\n    background: rgba(255, 255, 255, 0.78);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid rgba(255, 255, 255, 0.6);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-12) var(--sp-8) var(--sp-10);\n    box-shadow: var(--shadow-md);\n    text-align: center;\n    animation: t-slide-up 0.5s var(--ease);\n}\n\n@keyframes t-slide-up {\n    from { opacity: 0; transform: translateY(24px); }\n    to   { opacity: 1; transform: translateY(0); }\n}\n\n/* ── Teacher Page Header (gradient banner) ── */\n.t-page-header {\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    padding: var(--sp-5) var(--sp-5) var(--sp-12);\n    position: relative;\n}\n\n.t-header-nav {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: var(--sp-6);\n}\n\n.t-header-back {\n    background: rgba(255, 255, 255, 0.16);\n    border: none;\n    color: white;\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    cursor: pointer;\n    font-size: var(--text-lg);\n    text-decoration: none;\n    transition: background var(--transition);\n}\n\n.t-header-back:hover { background: rgba(255, 255, 255, 0.24); }\n\n.t-header-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n}\n\n/* ── Content Area (overlaps header) ── */\n.t-content {\n    padding: 0 var(--sp-4) var(--sp-10);\n    margin-top: calc(var(--sp-10) * -1);\n    position: relative;\n    z-index: 1;\n}\n\n/* ── Settings Card ── */\n.t-settings-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    box-shadow: var(--shadow-sm);\n    margin-bottom: var(--sp-4);\n    overflow: hidden;\n}\n\n.t-settings-title {\n    padding: var(--sp-4) var(--sp-5) 0;\n    font-size: var(--text-xs);\n    font-weight: 700;\n    color: var(--text-muted-soft);\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n}\n\n.t-setting-item {\n    display: flex;\n    align-items: center;\n    padding: var(--sp-4) var(--sp-5);\n    cursor: pointer;\n    transition: background var(--transition);\n    gap: var(--sp-3);\n    border-bottom: 1px solid var(--border-soft);\n    text-decoration: none;\n    color: inherit;\n}\n\n.t-setting-item:last-child { border-bottom: none; }\n.t-setting-item:hover { background: var(--surface-alt); }\n\n.t-setting-icon {\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n.t-setting-icon.primary  { background: rgba(119, 205, 208, 0.1); color: var(--primary-dark); }\n.t-setting-icon.teacher  { background: var(--teacher-pale); color: var(--teacher); }\n.t-setting-icon.orange   { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-setting-icon.correct  { background: var(--correct-pale); color: var(--correct); }\n.t-setting-icon.wrong    { background: var(--wrong-pale); color: var(--wrong); }\n.t-setting-icon.muted    { background: var(--surface-alt); color: var(--text-muted); }\n\n.t-setting-label {\n    font-weight: 600;\n    font-size: var(--text-sm);\n    color: var(--text-dark);\n}\n\n.t-setting-desc {\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: 2px;\n}\n\n.t-setting-arrow {\n    color: var(--text-muted-soft);\n    font-size: var(--text-lg);\n    margin-left: auto;\n}\n\n/* ── Teacher Stat Card (dashboard) ── */\n.t-stat-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    margin-bottom: var(--sp-4);\n}\n\n.t-stat-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n    text-align: center;\n}\n\n.t-stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 800;\n    color: var(--primary-dark);\n    line-height: 1;\n    letter-spacing: -0.02em;\n}\n\n.t-stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: var(--sp-1);\n    font-weight: 500;\n}\n\n/* ── Student Card ── */\n.t-student-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.t-student-card:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-sm);\n}\n\n.t-student-avatar {\n    width: 44px; height: 44px;\n    border-radius: 50%;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-weight: 700;\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n.t-student-name {\n    font-weight: 600;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.t-student-meta {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: 2px;\n}\n\n/* ── Filter Tabs ── */\n.t-filter-tabs {\n    display: flex;\n    background: var(--bg-gray);\n    border-radius: var(--radius-md);\n    padding: var(--sp-1);\n    margin-bottom: var(--sp-4);\n    gap: var(--sp-1);\n}\n\n.t-filter-tab {\n    flex: 1;\n    padding: var(--sp-2) var(--sp-3);\n    border: none;\n    border-radius: var(--radius-sm);\n    background: transparent;\n    font-family: inherit;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    transition: all 0.2s var(--ease);\n    white-space: nowrap;\n}\n\n.t-filter-tab.active {\n    background: var(--bg-white);\n    color: var(--text-dark);\n    box-shadow: var(--shadow-xs);\n    font-weight: 600;\n}\n\n/* ── Search Box ── */\n.t-search-box {\n    position: relative;\n    margin-bottom: var(--sp-4);\n}\n\n.t-search-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n    pointer-events: none;\n}\n\n.t-search-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: var(--bg-white);\n    color: var(--text-dark);\n    transition: border-color var(--transition), box-shadow var(--transition);\n    outline: none;\n}\n\n.t-search-input::placeholder { color: var(--text-muted-soft); }\n\n.t-search-input:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n/* ── Badge ── */\n.t-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-1);\n    padding: 2px var(--sp-2);\n    border-radius: var(--radius-full);\n    font-size: var(--text-xs);\n    font-weight: 600;\n    line-height: 1.4;\n}\n\n.t-badge.primary  { background: var(--primary-pale); color: var(--primary-dark); }\n.t-badge.correct   { background: var(--correct-pale); color: var(--correct-dark); }\n.t-badge.wrong     { background: var(--wrong-pale); color: var(--wrong-dark); }\n.t-badge.teacher   { background: var(--teacher-pale); color: var(--teacher); }\n.t-badge.orange    { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-badge.muted     { background: var(--surface-alt); color: var(--text-muted); }\n\n/* ── Teacher Modal ── */\n.t-modal-overlay {\n    display: none;\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    background: rgba(0, 0, 0, 0.4);\n    backdrop-filter: blur(4px);\n    z-index: 1000;\n    justify-content: center;\n    align-items: center;\n}\n\n.t-modal-overlay.active { display: flex; }\n\n.t-modal-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    width: 90%;\n    max-width: 400px;\n    box-shadow: var(--shadow-lg);\n    animation: t-slide-up 0.3s var(--ease);\n}\n\n.t-modal-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-modal-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n    margin-bottom: var(--sp-5);\n}\n\n.t-modal-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    outline: none;\n    transition: border-color var(--transition);\n    margin-bottom: var(--sp-4);\n    color: var(--text-dark);\n}\n\n.t-modal-input:focus { border-color: var(--primary); }\n\n.t-modal-actions {\n    display: flex;\n    gap: var(--sp-3);\n}\n\n.t-modal-btn {\n    flex: 1;\n    padding: var(--sp-3) var(--sp-4);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n}\n\n.t-modal-btn.cancel  { background: var(--surface-alt); color: var(--text-muted); }\n.t-modal-btn.confirm { background: var(--primary-dark); color: var(--text-white); }\n.t-modal-btn.danger  { background: var(--wrong); color: var(--text-white); }\n\n/* ── Teacher Form (styled inputs for auth pages) ── */\n.t-form-group {\n    text-align: left;\n    margin-bottom: var(--sp-4);\n}\n\n.t-form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-mid);\n    margin-bottom: var(--sp-2);\n}\n\n.t-input-wrapper { position: relative; }\n\n.t-input-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n}\n\n.t-form-input {\n    width: 100%;\n    padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: rgba(255, 255, 255, 0.8);\n    transition: all var(--transition);\n    outline: none;\n    color: var(--text-dark);\n}\n\n.t-form-input::placeholder { color: var(--text-muted-soft); }\n\n.t-form-input:focus {\n    border-color: var(--teacher);\n    background: var(--bg-white);\n    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);\n}\n\n/* ── Teacher Action Button (gradient) ── */\n.t-btn-action {\n    width: 100%;\n    padding: var(--sp-4);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    box-shadow: 0 4px 16px rgba(27, 122, 132, 0.25);\n}\n\n.t-btn-action:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 6px 20px rgba(27, 122, 132, 0.3);\n}\n\n.t-btn-action:active { transform: translateY(0); }\n\n/* ── Google OAuth Button ── */\n.t-btn-google {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    color: var(--text-dark);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 500;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-3);\n}\n\n.t-btn-google:hover {\n    border-color: var(--primary);\n    box-shadow: 0 4px 12px rgba(27, 122, 132, 0.1);\n    transform: translateY(-1px);\n}\n\n.t-btn-google img { width: 20px; height: 20px; }\n\n/* ── Empty State ── */\n.t-empty-state {\n    text-align: center;\n    padding: var(--sp-12) var(--sp-5);\n    color: var(--text-muted);\n}\n\n.t-empty-icon {\n    font-size: 3rem;\n    color: var(--text-muted-soft);\n    margin-bottom: var(--sp-4);\n}\n\n.t-empty-title {\n    font-size: var(--text-lg);\n    font-weight: 600;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-empty-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n}\n\n/* ── Teacher Logo Icon ── */\n.t-logo-icon {\n    width: 72px; height: 72px;\n    margin: 0 auto var(--sp-5);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    border-radius: var(--radius-xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    box-shadow: 0 8px 24px rgba(27, 122, 132, 0.25);\n}\n\n/* ── Profile Section ── */\n.t-profile-section {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n}\n\n.t-profile-avatar {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.2);\n    object-fit: cover;\n}\n\n.t-profile-avatar-placeholder {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.16);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-xl);\n    color: var(--text-white);\n}\n\n/* ── App Version ── */\n.t-app-version {\n    text-align: center;\n    padding: var(--sp-5);\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n/* ── Decorative Dots ── */\n.t-dots {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin-top: var(--sp-6);\n    margin-bottom: calc(var(--sp-2) * -1);\n}\n\n.t-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--primary-dark);\n    opacity: 0.12;\n}\n\n.t-dot.active {\n    opacity: 0.4;\n    width: 20px;\n    border-radius: var(--sp-1);\n}\n\n/* ── Academy Code Display ── */\n.t-code-display {\n    font-family: monospace;\n    font-size: var(--text-base);\n    font-weight: 700;\n    letter-spacing: 2px;\n    color: var(--teacher);\n    background: var(--teacher-pale);\n    padding: var(--sp-1) var(--sp-3);\n    border-radius: var(--radius-sm);\n}\n\n/* ── Divider ── */\n.t-divider {\n    display: flex;\n    align-items: center;\n    margin: var(--sp-5) 0;\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n.t-divider::before,\n.t-divider::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--border);\n}\n\n.t-divider::before { margin-right: var(--sp-3); }\n.t-divider::after  { margin-left: var(--sp-3); }\n\n/* ── Hint Text ── */\n.t-hint {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: var(--sp-4);\n}\n\n<\/style>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>대시보드 · TES Speaking<\/title>\n<!-- Existing project styles + icon font (do not remove) -->\n\n\n\n\n<link href=\"../manifest.json\" rel=\"manifest\"/>\n<style>\n    /* ─────────────────────────────────────────────────────────────\n       Scoped styles for the redesigned dashboard. All color values\n       come from sunbeam tokens defined in ../css/style.css.\n       ───────────────────────────────────────────────────────────── */\n\n    * { box-sizing: border-box; }\n    body {\n      margin: 0;\n      background: var(--bg-light);\n      color: var(--text-dark);\n      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n      -webkit-font-smoothing: antialiased;\n      font-feature-settings: \"ss05\", \"tnum\";\n    }\n    .tnum { font-variant-numeric: tabular-nums; }\n\n    /* ───────── Layout shell ───────── */\n    .shell {\n      display: flex;\n      min-height: 100vh;\n      width: 100%;\n    }\n\n    /* ─── Sidebar (PC / Tablet) ─── */\n    .sidebar {\n      width: 240px;\n      background: var(--bg-dark);\n      color: rgba(255,255,255,0.92);\n      display: flex;\n      flex-direction: column;\n      flex-shrink: 0;\n      padding: 22px 16px;\n      gap: 18px;\n      position: sticky;\n      top: 0;\n      height: 100vh;\n    }\n\n    .brand {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      padding: 4px 6px;\n    }\n    .brand-mark {\n      width: 38px; height: 38px;\n      border-radius: 11px;\n      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-yellow) 100%);\n      display: flex; align-items: center; justify-content: center;\n      color: var(--text-dark);\n      font-weight: 900; font-size: 16px;\n      box-shadow: 0 2px 12px rgba(119,205,208,0.45);\n    }\n    .brand-name { font-weight: 800; font-size: 15px; color: #fff; }\n    .brand-sub  {\n      font-size: 10.5px; color: rgba(255,255,255,0.55);\n      margin-top: 1px; letter-spacing: 0.3px;\n    }\n\n    .academy-card {\n      background: rgba(255,255,255,0.06);\n      border-radius: 12px;\n      padding:   .hero-metrics {\n      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\n      background: rgba(255,255,255,0.10);\n      backdrop-filter: blur(8px);\n      border-radius: 16px;\n      padding: 16px 18px;\n      position: relative; z-index: 1;\n    }\n    .hero-metrics .label {\n      font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600;\n    }\n    .hero-metrics .value {\n      font-size: 26px; font-weight: 800; margin-top: 4px;\n      display: flex; align-items: baseline; gap: 3px;\n    }\n    .hero-metrics .value small {\n      font-size: 12px; opacity: 0.7; font-weight: 600;\n    }\n\n    /* KPI tiles (Refined to match Sunbeam design reference mockup) */\n    .kpi {\n      background: #fff;\n      border-radius: var(--radius-xl);\n      border: 1px solid var(--border-soft);\n      box-shadow: var(--shadow-sm);\n      padding: 22px 24px;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n      transition: all 0.25s ease;\n    }\n    .kpi:hover {\n      transform: translateY(-2px);\n      box-shadow: var(--shadow-md);\n    }\n\n    .tile {\n      display: inline-flex; align-items: center; justify-content: center;\n      width: 36px; height: 36px;\n      border-radius: var(--radius-md);\n      flex-shrink: 0;\n    }\n    .tile.primary { background: var(--primary-pale); color: var(--primary-dark); }\n    .tile.purple  { background: var(--teacher-pale); color: var(--teacher-dark); }\n    .tile.warm    { background: var(--accent-orange-pale); color: #C25238; }\n    .tile.yellow  { background: var(--accent-yellow-pale); color: #B88914; }\n    .tile.green   { background: var(--correct-pale); color: var(--correct-dark); }\n    .tile .ti     { font-size: 18px; }\n\n    .kpi-head {\n      display: flex; align-items: center; justify-content: space-between;\n    }\n    .kpi-trend {\n      font-size: 11px; font-weight: 700; color: var(--correct-dark);\n    }\n    .kpi-label {\n      font-size: 12px; color: var(--text-muted); font-weight: 500;\n    }\n    .kpi-value {\n      display: flex; align-items: baseline; gap: 3px; margin-top: 2px;\n    }\n    .kpi-value .num {\n      font-size: 24px; font-weight: 800; color: var(--text-dark);\n      letter-spacing: -0.5px;\n    }\n    .kpi-value .suf {\n      font-size: 12px; font-weight: 600; color: var(--text-muted);\n    }\n\n    /* Card primitive (Refined to match Sunbeam design reference mockup) */\n    .card {\n      background: #fff;\n      border-radius: var(--radius-xl);\n      border: 1px solid var(--border-soft);\n      box-shadow: var(--shadow-sm);\n      padding: 24px;\n      transition: all 0.25s ease;\n    }\n    .card:hover {\n      box-shadow: var(--shadow-md);\n    }\n    .card h3 {\n      font-size: 16px; font-weight: 800; color: var(--text-dark);\n      margin: 0;\n    }\n    .card .card-sub {\n      font-size: 12px; color: var(--text-muted); margin: 2px 0 0;\n    }\n    .card-head {\n      display: flex; align-items: center; justify-content: space-between;\n      margin-bottom: 8px;\n    }\n    .card-more {\n      font-size: 12px; color: var(--primary-dark); font-weight: 700;\n      display: inline-flex; align-items: center; gap: 4px;\n      background: none; border: none; cursor: pointer;\n    }\n    .divider {\n      height: 1px; background: var(--border-soft); border: 0; margin: 0;\n    }\n\n    /* Timeline */\n    .timeline-item {\n      display: flex; align-items: center; gap: 12px;\n      padding: 8px 0;\n    }\n    .avatar-stack {\n      position: relative; flex-shrink: 0;\n    }\n    .avatar-stack .dot-badge {\n      position: absolute; bottom: -2px; right: -2px;\n      width: 16px; height: 16px; border-radius: 50%;\n      display: flex; align-items: center; justify-content: center;\n      color: #fff; border: 2px solid #fff;\n    }\n    .avatar-stack .dot-badge .ti { font-size: 9px; }\n    .dot-badge.good { background: var(--correct); }\n    .dot-badge.info { background: var(--teacher); }\n    .dot-badge.new  { background: var(--accent-orange); }\n\n    .timeline-item .body {\n      flex: 1; min-width: 0;\n      font-size: 13px; color: var(--text-dark); line-height: 1.35;\n    }\n    .timeline-item .body b { font-weight: 700; }\n    .timeline-item .body .muted { color: var(--text-muted); font-weight: 500; }\n    .timeline-item .time {\n      font-size: 11px; color: var(--text-muted-soft);\n      font-weight: 600; white-space: nowrap;\n    }\n\n    /* Today Active Students Grid Layout (Mockup Match) */\n    #studentList {\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 12px;\n    }\n    \n    /* Student row (right column) */\n    .student-row {\n      display: flex; align-items: center; gap: 12px;\n      padding: 14px 16px;\n      border-radius: var(--radius-lg);\n      background: var(--bg-light);\n      border: 1px solid var(--border-soft);\n      transition: all 0.2s ease;\n    }\n    .student-row:hover {\n      background: #fff;\n      border-color: var(--primary-light);\n      box-shadow: var(--shadow-sm);\n    }\n    .student-row .name {\n      font-size: 13.5px; font-weight: 700; color: var(--text-dark);\n    }\n    .student-row .grade {\n      font-size: 10.5px; color: var(--text-muted-soft); margin-left: 4px;\n    }\n    .student-row .meta {\n      font-size: 11px; color: var(--text-muted); margin-top: 1px;\n    }\n    .student-row .delta {\n      font-size: 11.5px; font-weight: 800;\n      color: var(--primary-dark); background: var(--primary-pale);\n      padding: 4px 9px; border-radius: 999px; white-space: nowrap;\n    }\n\n    .badge {\n      display: inline-flex; align-items: center; gap: 4px;\n      padding: 4px 10px; border-radius: 999px;\n      font-size: 11px; font-weight: 600;\n    }\n    .badge.warm { background: var(--accent-orange-pale); color: #C25238; }\n    .badge.good { background: var(--correct-pale); color: var(--correct-dark); }\n    .badge.muted { background: var(--bg-gray); color: var(--text-muted); }\n    .badge .ti { font-size: 11px; }\n\n    /* Cleanup card */\n    .cleanup {\n      grid-column: span 2;\n      background: linear-gradient(135deg, var(--accent-orange-pale) 0%, var(--accent-yellow-pale) 100%);\n      border: 1px solid #FED7AA;\n      border-radius: var(--radius-lg);\n      padding: 16px;\n      display: flex; align-items: center; gap: 12px;\n    }\n    .cleanup .title {\n      font-weight: 700; color: #9A3412; font-size: 14px;\n    }\n    .cleanup .sub {\n      font-size: 12px; color: var(--accent-orange); margin-top: 2px;\n    }\n    .cleanup-btn {\n      background: var(--accent-orange);\n      color: #fff;\n      padding: 8px 14px;\n      border-radius: var(--radius-md);\n      font-size: 13px; font-weight: 700;\n      border: none; cursor: pointer; white-space: nowrap;\n      font-family: inherit;\n    }\n\n    /* Weekly chart (Refined to match Sunbeam design reference mockup) */\n    .bars {\n      display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; height: 60px;\n    }\n    .bars .bar {\n      flex: 1;\n      background: rgba(119, 205, 208, 0.35); /* Soft pastel turquoise */\n      border-radius: 999px; /* Round pill style */\n      transition: all 0.3s ease;\n      min-height: 8px;\n    }\n    .bars .bar:hover {\n      background: var(--primary-mid);\n    }\n    .bars .bar.active {\n      background: var(--primary); /* Deep vibrant turquoise for active today */\n      box-shadow: 0 2px 6px rgba(119, 205, 208, 0.4);\n    }\n    .bar-labels {\n      display: flex; justify-content: space-between; gap: 4px; margin-top: 8px;\n    }\n    .bar-labels span {\n      flex: 1; text-align: center;\n      font-size: 11px; font-weight: 600; color: var(--text-muted-soft);\n    }\n    .bar-labels span.active {\n      color: var(--primary-dark); font-weight: 800;\n    }\n\n    /* Quick menu */\n    .quick-grid {\n      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;\n    }\n    .quick-grid button {\n      padding: 12px;\n      background: var(--bg-light);\n      border-radius: 10px;\n      display: flex; align-items: center; gap: 10px;\n      border: none; cursor: pointer;\n      font-family: inherit; text-align: left;\n    }\n    .quick-grid .label {\n      font-size: 11.5px; font-weight: 700; color: var(--text-dark);\n    }\n\n    /* Hero / sections spans (fallback, overridden by explicit bento placement) */\n    .col-span-2 { grid-column: span 2; }\n    .col-span-4 { grid-column: span 4; }\n\n    /* ───────── Topbar icon buttons ───────── */\n    .topbar-search-btn,\n    .topbar-bell-btn { display: none; }\n\n    /* Activity card stretches to fill its row span */\n    .activity-card { display: flex; flex-direction: column; }\n    .activity-card #activityList { flex: 1; overflow-y: auto; }\n\n    /* Activity \"전체\" link — hidden on desktop/tablet, shown on mobile */\n    .activity-all-link { display: none; }\n\n    /* ───────── Mobile header (hidden on PC/Tablet) ───────── */\n    .mobile-header { display: none; }\n    .mobile-tabbar { display: none; }\n\n    /* ─────────────────────────────────────────────────────────────\n       Responsive — Tablet (768–1199)\n       ───────────────────────────────────────────────────────────── */\n    @media (max-width: 1199px) {\n      .sidebar { width: 76px; padding: 20px 12px; }\n      .brand-name, .brand-sub, .academy-card,\n      .nav-item .label, .nav-badge,\n      .sidebar-user > div { display: none; }\n      .brand { justify-content: center; }\n      .nav-item {\n        justify-content: center;\n        padding: 12px 0;\n      }\n      .sidebar-user { justify-content: center; }\n\n      .search { display: none !important; }\n      .topbar-search-btn,\n      .topbar-bell-btn { display: inline-flex; }\n    }\n\n    /* ─────────────────────────────────────────────────────────────\n       Responsive — Mobile (≤ 767)\n       ───────────────────────────────────────────────────────────── */\n    @media (max-width: 767px) {\n      .shell { flex-direction: column; }\n      .sidebar { display: none; }\n      .topbar { display: none; }\n\n      .mobile-header {\n        display: flex; align-items: center; justify-content: space-between;\n        padding: 16px 18px 12px;\n        background: var(--bg-light);\n        flex-shrink: 0;\n      }\n      .mobile-header .left {\n        display: flex; align-items: center; gap: 10px;\n      }\n      .mobile-header .brand-mark {\n        width: 32px; height: 32px; border-radius: 9px; font-size: 14px;\n      }\n      .mobile-header .name {\n        font-size: 11.5px; color: var(--text-muted); font-weight: 600;\n      }\n      .mobile-header .teacher {\n        font-size: 13px; font-weight: 800; color: var(--text-dark); margin-top: -1px;\n      }\n      .mobile-header .mypage-btn {\n        display: flex; align-items: center; gap: 6px;\n        padding: 7px 11px 7px 8px;\n        background: #fff;\n        border-radius: 999px;\n        box-shadow: var(--shadow-xs);\n        border: none; cursor: pointer;\n        font-family: inherit;\n        text-decoration: none;\n        color: var(--text-dark);\n      }\n      .mobile-header .mypage-btn .avatar {\n        width: 24px; height: 24px; font-size: 11px;\n      }\n      .mobile-header .mypage-btn .lbl {\n        font-size: 12px; font-weight: 700;\n      }\n\n      .content { padding: 4px 16px 16px; }\n      .bento { grid-template-columns: repeat(2, 1fr); gap: 12px; }\n      .bento > .hero          { grid-column: 1 / 3; padding: 22px 20px; min-height: 0; flex-direction: column; align-items: flex-start; gap: 20px; }\n      .bento > .kpi-total     { grid-column: 1 / 2; }\n      .bento > .kpi-tests     { grid-column: 2 / 3; }\n      .bento > .kpi-today     { display: none; }\n      .bento > .kpi-new       { display: none; }\n      .bento > .activity-card { grid-column: 1 / 3; grid-row: span 1; }\n      .bento > .chart-card    { display: none; }\n      .bento > .quick-card    { display: none; }\n      .bento > .cleanup-card  { grid-column: 1 / 3; padding: 14px; }\n      .bento > .students-card { display: none; }\n\n      .hero h2 { font-size: 22px; }\n      .hero-metrics { padding: 14px 16px; }\n      .hero-metrics .value { font-size: 20px; }\n      .card { padding: 16px; }\n\n      /* Activity card: show \"전체 →\" link, hide count badge */\n      .activity-all-link { display: inline-flex !important; }\n      #activityCount { display: none; }\n\n      /* Bottom tab bar */\n      .mobile-tabbar {\n        display: grid;\n        grid-template-columns: repeat(5, 1fr);\n        padding: 6px 4px 10px;\n        background: #fff;\n        border-top: 1px solid var(--border-soft);\n        flex-shrink: 0;\n        position: sticky;\n        bottom: 0;\n        z-index: 20;\n      }\n      .mobile-tabbar a {\n        display: flex; flex-direction: column;\n        align-items: center; gap: 2px;\n        padding: 6px 0;\n        color: var(--text-muted-soft);\n        text-decoration: none;\n        font-size: 10.5px; font-weight: 500;\n      }\n      .mobile-tabbar a.active {\n        color: var(--primary-dark); font-weight: 700;\n      }\n      .mobile-tabbar a .ti { font-size: 22px; }\n    }\n\n    /* ───────── Empty / loading helpers ───────── */\n    .empty {\n      text-align: center;\n      padding: 32px 16px;\n      color: var(--text-muted);\n    }\n    .empty .ti {\n      font-size: 32px; color: var(--text-muted-soft);\n      display: block; margin-bottom: 8px;\n    }\n    @keyframes spin { to { transform: rotate(360deg); } }\n    .spin { animation: spin 1s linear infinite; display: inline-block; }\n  <\/style>\n<\/head>\n<body>\n<div class=\"shell\">\n<!-- ─────────────────────────────────────────────────────────\n         Sidebar — desktop / tablet\n         ───────────────────────────────────────────────────────── -->\n<aside aria-label=\"메인 메뉴\" class=\"sidebar\">\n<div class=\"brand\">\n<div class=\"brand-mark\">☀<\/div>\n<div>\n<div class=\"brand-name\">Sunbeam<\/div>\n<div class=\"brand-sub\">TEACHER CONSOLE<\/div>\n<\/div>\n<\/div>\n<div class=\"academy-card\">\n<div class=\"academy-label\">ACADEMY<\/div>\n<div class=\"academy-name\" id=\"sideAcademyName\">학원명<\/div>\n<div class=\"academy-teacher\">\n<i class=\"ti ti-user\"><\/i><span id=\"sideTeacherName\">선생님<\/span>\n<\/div>\n<\/div>\n<nav class=\"nav\">\n<a class=\"nav-item active\" href=\"dashboard.html\">\n<i class=\"ti ti-layout-dashboard\"><\/i><span class=\"label\">대시보드<\/span>\n<\/a>\n<a class=\"nav-item\" href=\"students.html\">\n<i class=\"ti ti-users\"><\/i><span class=\"label\">학생 관리<\/span>\n<\/a>\n<a class=\"nav-item\" href=\"textbooks.html\">\n<i class=\"ti ti-book\"><\/i><span class=\"label\">교재 관리<\/span>\n<\/a>\n<a class=\"nav-item\" href=\"classes.html\">\n<i class=\"ti ti-school\"><\/i><span class=\"label\">학습반<\/span>\n<\/a>\n<a class=\"nav-item\" href=\"review.html\">\n<i class=\"ti ti-message-circle\"><\/i><span class=\"label\">리뷰<\/span>\n<\/a>\n<a class=\"nav-item\" href=\"recovery.html\" id=\"sideRecoveryItem\">\n<i class=\"ti ti-arrows-transfer-down\"><\/i>\n<span class=\"label\">녹화 복구<\/span>\n<span class=\"nav-badge\" id=\"sideRecoveryBadge\" style=\"display:none;\">0<\/span>\n<\/a>\n<\/nav>\n<a class=\"sidebar-user\" href=\"mypage.html\" style=\"text-decoration:none;\">\n<div class=\"avatar yellow\" id=\"sideUserAvatar\">이<\/div>\n<div>\n<div id=\"sideUserName\" style=\"font-size:12.5px; font-weight:700; color:#fff;\">이수민 선생님<\/div>\n<div style=\"font-size:10.5px; color:rgba(255,255,255,0.5);\">설정 · 로그아웃<\/div>\n<\/div>\n<\/a>\n<\/aside>\n<main class=\"main\">\n<!-- ─────────────────────────────────────────────────────────\n           Mobile header (visible only ≤ 767px)\n           Top-right is \"마이페이지\" button per spec.\n           ───────────────────────────────────────────────────────── -->\n<header class=\"mobile-header\">\n<div class=\"left\">\n<div class=\"brand-mark\">☀<\/div>\n<div>\n<div class=\"name\" id=\"mAcademyName\">학원명<\/div>\n<div class=\"teacher\" id=\"mTeacherName\">선생님<\/div>\n<\/div>\n<\/div>\n<a aria-label=\"마이페이지\" class=\"mypage-btn\" href=\"mypage.html\">\n<span class=\"avatar\" id=\"mUserAvatar\">이<\/span>\n<span class=\"lbl\">마이페이지<\/span>\n<\/a>\n<\/header>\n<!-- ─────────────────────────────────────────────────────────\n           Topbar (PC / Tablet)\n           ───────────────────────────────────────────────────────── -->\n<header class=\"topbar\">\n<div class=\"topbar-fill\">\n<h1>대시보드<\/h1>\n<p><span id=\"topAcademyName\">학원명<\/span><\/p>\n<\/div>\n<div class=\"search\">\n<i class=\"ti ti-search\" style=\"color: var(--text-muted-soft); font-size:16px;\"><\/i>\n<input id=\"searchInput\" oninput=\"filterStudents()\" placeholder=\"학생, 교재 검색…\" type=\"text\"/>\n<kbd>⌘ K<\/kbd>\n<\/div>\n<button aria-label=\"검색\" class=\"icon-btn topbar-search-btn\">\n<i class=\"ti ti-search\"><\/i>\n<\/button>\n<button aria-label=\"알림\" class=\"icon-btn topbar-bell-btn\">\n<i class=\"ti ti-bell\"><\/i>\n<\/button>\n<a aria-label=\"마이페이지\" class=\"icon-btn\" href=\"mypage.html\">\n<i class=\"ti ti-user-circle\"><\/i>\n<\/a>\n<button aria-label=\"새로고침\" class=\"icon-btn\" onclick=\"refreshData()\">\n<i class=\"ti ti-refresh\"><\/i>\n<\/button>\n<\/header>\n<!-- ─────────────────────────────────────────────────────────\n           Bento content\n           ───────────────────────────────────────────────────────── -->\n<div class=\"content\">\n<div class=\"bento\">\n<!-- Hero -->\n<section class=\"hero\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; z-index: 1;\">\n<span class=\"hero-chip\"><i class=\"ti ti-sun-high\"><\/i> <span id=\"todayLabel\">오늘<\/span><\/span>\n<h2>오늘 <span id=\"heroActive\">0<\/span>명이<br/>학습을 진행했어요<\/h2>\n<p class=\"sub\">총 <span id=\"heroRec\">0<\/span>건의 녹화가 새로 등록되었습니다<\/p>\n<\/div>\n<div class=\"hero-metrics\">\n<div>\n<div class=\"label\">오늘 녹화<\/div>\n<div class=\"value tnum\"><span id=\"heroMetricRec\">0<\/span><small>건<\/small><\/div>\n<\/div>\n<div>\n<div class=\"label\">활동 학생<\/div>\n<div class=\"value tnum\"><span id=\"heroMetricActive\">0<\/span><small>명<\/small><\/div>\n<\/div>\n<div>\n<div class=\"label\">신규 가입<\/div>\n<div class=\"value tnum\"><span id=\"heroMetricNew\">0<\/span><small>명<\/small><\/div>\n<\/div>\n<\/div>\n<\/section>\n<!-- Total students KPI -->\n<div class=\"kpi kpi-total\" style=\"border-left-color: var(--primary);\">\n<div class=\"kpi-head\">\n<span class=\"tile primary\"><i class=\"ti ti-users\"><\/i><\/span>\n<span class=\"kpi-trend\" id=\"totalTrend\">+0<\/span>\n<\/div>\n<div>\n<div class=\"kpi-label\">총 학생<\/div>\n<div class=\"kpi-value\"><span class=\"num tnum\" id=\"totalStudents\">0<\/span><span class=\"suf\">명<\/span><\/div>\n<\/div>\n<\/div>\n<!-- Total Tests KPI -->\n<div class=\"kpi kpi-purple kpi-tests\" style=\"border-left-color: var(--teacher);\">\n<div class=\"kpi-head\">\n<span class=\"tile purple\"><i class=\"ti ti-microphone\"><\/i><\/span>\n<span class=\"kpi-trend\" id=\"testsTrend\">+0<\/span>\n<\/div>\n<div>\n<div class=\"kpi-label\">총 시험<\/div>\n<div class=\"kpi-value\"><span class=\"num tnum\" id=\"totalTests\">0<\/span><span class=\"suf\">건<\/span><\/div>\n<\/div>\n<\/div>\n<!-- Today recordings KPI -->\n<div class=\"kpi kpi-warm kpi-today\" style=\"border-left-color: var(--accent-orange);\">\n<div class=\"kpi-head\">\n<span class=\"tile warm\"><i class=\"ti ti-player-record\"><\/i><\/span>\n<span class=\"kpi-trend\">활발<\/span>\n<\/div>\n<div>\n<div class=\"kpi-label\">오늘<\/div>\n<div class=\"kpi-value\"><span class=\"num tnum\" id=\"todayRec\">0<\/span><span class=\"suf\">건<\/span><\/div>\n<\/div>\n<\/div>\n<!-- New students KPI -->\n<div class=\"kpi kpi-new\" style=\"border-left-color: var(--accent-yellow);\">\n<div class=\"kpi-head\">\n<span class=\"tile yellow\"><i class=\"ti ti-sparkles\"><\/i><\/span>\n<\/div>\n<div>\n<div class=\"kpi-label\">신규<\/div>\n<div class=\"kpi-value\"><span class=\"num tnum\" id=\"kpiNewStudents\">0<\/span><span class=\"suf\">명<\/span><\/div>\n<\/div>\n<\/div>\n<!-- Activity timeline (left column) -->\n<section class=\"card activity-card\">\n<div class=\"card-head\">\n<h3>오늘의 활동<\/h3>\n<span id=\"activityCount\" style=\"font-size:12px; font-weight:700; color:var(--primary-dark);\">0건<\/span>\n<a class=\"activity-all-link\" href=\"students.html\" style=\"font-size:12px; font-weight:700; color:var(--primary-dark); text-decoration:none; display:inline-flex; align-items:center; gap:2px;\">전체 <i class=\"ti ti-arrow-right\" style=\"font-size:14px;\"><\/i><\/a>\n<\/div>\n<div id=\"activityList\">\n<div class=\"empty\"><i class=\"ti ti-loader spin\"><\/i><p>불러오는 중…<\/p><\/div>\n<\/div>\n<\/section>\n<!-- Weekly chart (right column, top) -->\n<section class=\"card chart-card\" style=\"padding:18px;\">\n<div style=\"display:flex; align-items:flex-start; justify-content:space-between;\">\n<div>\n<h3 style=\"font-size:13px; color:var(--text-muted); font-weight:700;\">이번 주 녹화<\/h3>\n<div style=\"display:flex; align-items:baseline; gap:4px; margin-top:6px;\">\n<span class=\"tnum\" id=\"weekTotal\" style=\"font-size:28px; font-weight:800;\">0<\/span>\n<span style=\"font-size:12px; font-weight:600; color:var(--text-muted);\">건<\/span>\n<\/div>\n<\/div>\n<span class=\"badge good\"><i class=\"ti ti-trending-up\"><\/i> <span id=\"weekTrend\">+0%<\/span><\/span>\n<\/div>\n<div class=\"bars\" id=\"weekBars\" style=\"margin-top:14px;\"><\/div>\n<div class=\"bar-labels\" id=\"weekLabels\"><\/div>\n<\/section>\n<!-- Quick menu (Positioned below Weekly Chart on the right column) -->\n<section class=\"card quick-card\">\n<div class=\"card-head\">\n<h3 style=\"font-size:14px;\">빠른 메뉴<\/h3>\n<\/div>\n<div class=\"quick-grid\">\n<a href=\"students.html\" style=\"text-decoration:none;\">\n<button type=\"button\">\n<span class=\"tile primary\" style=\"width:30px; height:30px;\"><i class=\"ti ti-users\" style=\"font-size:15px;\"><\/i><\/span>\n<span class=\"label\">학생 관리<\/span>\n<\/button>\n<\/a>\n<a href=\"textbooks.html\" style=\"text-decoration:none;\">\n<button type=\"button\">\n<span class=\"tile green\" style=\"width:30px; height:30px;\"><i class=\"ti ti-book\" style=\"font-size:15px;\"><\/i><\/span>\n<span class=\"label\">교재 관리<\/span>\n<\/button>\n<\/a>\n<a href=\"classes.html\" style=\"text-decoration:none;\">\n<button type=\"button\">\n<span class=\"tile purple\" style=\"width:30px; height:30px;\"><i class=\"ti ti-school\" style=\"font-size:15px;\"><\/i><\/span>\n<span class=\"label\">학습반<\/span>\n<\/button>\n<\/a>\n<a href=\"recovery.html\" style=\"text-decoration:none;\">\n<button type=\"button\">\n<span class=\"tile warm\" style=\"width:30px; height:30px;\"><i class=\"ti ti-arrows-transfer-down\" style=\"font-size:15px;\"><\/i><\/span>\n<span class=\"label\">녹화 복구<\/span>\n<\/button>\n<\/a>\n<\/div>\n<\/section>\n<!-- Cleanup card (orange, full width below main 2-column content) -->\n<div class=\"cleanup cleanup-card\" id=\"cleanupCard\" style=\"display:none;\">\n<span class=\"tile warm\" style=\"width:40px; height:40px;\"><i class=\"ti ti-trash\" style=\"font-size:20px;\"><\/i><\/span>\n<div style=\"flex:1; min-width:0;\">\n<div class=\"title\" style=\"font-size: 14.5px; font-weight: 800; color: #9A3412;\">오래된 녹화 정리<\/div>\n<div class=\"sub\" id=\"oldRecCountText\" style=\"font-size:12px; color: var(--accent-orange); font-weight: 600; margin-top:2px;\">7일 이상 지난 파일 0개<\/div>\n<\/div>\n<button class=\"cleanup-btn\" onclick=\"openCleanupModal()\">정리하기<\/button>\n<\/div>\n<!-- Today's active students (full width at the absolute bottom) -->\n<section class=\"card students-card\">\n<div class=\"card-head\">\n<div>\n<h3>오늘 활동 학생<\/h3>\n<p class=\"card-sub\">녹화를 등록한 학생들<\/p>\n<\/div>\n<span id=\"activeCount\" style=\"font-size:11px; color:var(--text-muted-soft); font-weight:600;\">0명<\/span>\n<\/div>\n<div id=\"studentList\">\n<div class=\"empty\"><i class=\"ti ti-loader spin\"><\/i><p>학생 정보 불러오는 중…<\/p><\/div>\n<\/div>\n<\/section>\n<\/div>\n<\/div>\n<!-- ────────────────────────────────
