-base);\n    color: var(--text-dark);\n    transition: var(--transition);\n}\n\n.form-input:focus {\n    border-color: var(--primary);\n    outline: none;\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n.form-input::placeholder {\n    color: var(--text-light);\n}\n\n/* ============================================\n   Toast & Loading\n   ============================================ */\n\n.toast-container {\n    position: fixed;\n    top: calc(var(--sp-5) + var(--safe-top));\n    left: var(--sp-4);\n    right: var(--sp-4);\n    z-index: 2000;\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-2);\n    pointer-events: none;\n}\n\n.toast {\n    padding: var(--sp-4) var(--sp-5);\n    background: var(--bg-dark);\n    color: var(--text-white);\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 500;\n    animation: toastIn 0.25s var(--ease-spring);\n    pointer-events: auto;\n}\n\n@keyframes toastIn {\n    from { opacity: 0; transform: translateY(-12px) scale(0.96); }\n    to   { opacity: 1; transform: translateY(0) scale(1); }\n}\n\n.toast.success { background: #166534; }\n.toast.error   { background: #991B1B; }\n.toast.warning { background: #92400E; }\n\n.loading-overlay {\n    position: fixed;\n    inset: 0;\n    background: rgba(255, 255, 255, 0.88);\n    backdrop-filter: blur(4px);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    z-index: 9999;\n    gap: var(--sp-4);\n}\n\n.loading-spinner {\n    width: 40px;\n    height: 40px;\n    border: 3px solid var(--bg-gray);\n    border-top-color: var(--primary-dark);\n    border-radius: 50%;\n    animation: spin 0.8s linear infinite;\n}\n\n@keyframes spin {\n    to { transform: rotate(360deg); }\n}\n\n/* ============================================\n   Utilities\n   ============================================ */\n\n.hidden { display: none !important; }\n.text-center { text-align: center; }\n.text-primary { color: var(--primary-dark); }\n.text-gray { color: var(--text-gray); }\n\n.mt-1 { margin-top: var(--sp-2); }\n.mt-2 { margin-top: var(--sp-4); }\n.mt-3 { margin-top: var(--sp-6); }\n.mb-1 { margin-bottom: var(--sp-2); }\n.mb-2 { margin-bottom: var(--sp-4); }\n.mb-3 { margin-bottom: var(--sp-6); }\n.gap-1 { gap: var(--sp-2); }\n.gap-2 { gap: var(--sp-4); }\n\n/* ============================================\n   Responsive — Tablet First\n   ============================================ */\n\n@media (min-width: 768px) {\n    :root {\n        --app-max-width: 680px;\n    }\n\n    .page-content {\n        padding: var(--sp-6) var(--sp-8);\n    }\n\n    .grid-2 {\n        gap: var(--sp-4);\n    }\n\n    .sentence-card {\n        padding: var(--sp-10) var(--sp-8);\n    }\n\n    .sentence-en {\n        font-size: var(--text-3xl);\n    }\n\n    .record-btn-large {\n        width: 100px;\n        height: 100px;\n    }\n}\n\n@media (min-width: 1024px) {\n    :root {\n        --app-max-width: 800px;\n    }\n\n    .page-content {\n        padding: var(--sp-8) var(--sp-10);\n    }\n}\n\n/* ============================================\n   Teacher Pages — Common Components\n   ============================================ */\n\n/* ── Fullscreen Auth Layout (Login, Setup, Callback) ── */\n.t-auth-body {\n    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--bg-light);\n    overflow: hidden;\n    position: relative;\n}\n\n.t-auth-bg-orb {\n    position: fixed;\n    border-radius: 50%;\n    filter: blur(80px);\n    opacity: 0.25;\n    animation: t-float 10s ease-in-out infinite;\n    pointer-events: none;\n    z-index: 0;\n}\n\n.t-auth-bg-orb:nth-child(1) {\n    width: 260px; height: 260px;\n    background: radial-gradient(circle, var(--teacher) 0%, transparent 70%);\n    top: -60px; right: -40px;\n    animation-duration: 11s;\n}\n\n.t-auth-bg-orb:nth-child(2) {\n    width: 220px; height: 220px;\n    background: radial-gradient(circle, var(--primary-mid) 0%, transparent 70%);\n    bottom: -50px; left: -30px;\n    animation-duration: 13s; animation-delay: -4s;\n}\n\n.t-auth-bg-orb:nth-child(3) {\n    width: 160px; height: 160px;\n    background: radial-gradient(circle, var(--primary-light) 0%, transparent 70%);\n    top: 40%; left: 15%;\n    animation-duration: 9s; animation-delay: -2s;\n}\n\n@keyframes t-float {\n    0%, 100% { transform: translateY(0) scale(1); }\n    50%      { transform: translateY(-24px) scale(1.04); }\n}\n\n.t-auth-card {\n    position: relative;\n    z-index: 1;\n    width: 92%;\n    max-width: 440px;\n    background: rgba(255, 255, 255, 0.78);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid rgba(255, 255, 255, 0.6);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-12) var(--sp-8) var(--sp-10);\n    box-shadow: var(--shadow-md);\n    text-align: center;\n    animation: t-slide-up 0.5s var(--ease);\n}\n\n@keyframes t-slide-up {\n    from { opacity: 0; transform: translateY(24px); }\n    to   { opacity: 1; transform: translateY(0); }\n}\n\n/* ── Teacher Page Header (gradient banner) ── */\n.t-page-header {\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    padding: var(--sp-5) var(--sp-5) var(--sp-12);\n    position: relative;\n}\n\n.t-header-nav {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: var(--sp-6);\n}\n\n.t-header-back {\n    background: rgba(255, 255, 255, 0.16);\n    border: none;\n    color: white;\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    cursor: pointer;\n    font-size: var(--text-lg);\n    text-decoration: none;\n    transition: background var(--transition);\n}\n\n.t-header-back:hover { background: rgba(255, 255, 255, 0.24); }\n\n.t-header-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n}\n\n/* ── Content Area (overlaps header) ── */\n.t-content {\n    padding: 0 var(--sp-4) var(--sp-10);\n    margin-top: calc(var(--sp-10) * -1);\n    position: relative;\n    z-index: 1;\n}\n\n/* ── Settings Card ── */\n.t-settings-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    box-shadow: var(--shadow-sm);\n    margin-bottom: var(--sp-4);\n    overflow: hidden;\n}\n\n.t-settings-title {\n    padding: var(--sp-4) var(--sp-5) 0;\n    font-size: var(--text-xs);\n    font-weight: 700;\n    color: var(--text-muted-soft);\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n}\n\n.t-setting-item {\n    display: flex;\n    align-items: center;\n    padding: var(--sp-4) var(--sp-5);\n    cursor: pointer;\n    transition: background var(--transition);\n    gap: var(--sp-3);\n    border-bottom: 1px solid var(--border-soft);\n    text-decoration: none;\n    color: inherit;\n}\n\n.t-setting-item:last-child { border-bottom: none; }\n.t-setting-item:hover { background: var(--surface-alt); }\n\n.t-setting-icon {\n    width: 40px; height: 40px;\n    border-radius: var(--radius-md);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-lg);\n    flex-shrink: 0;\n}\n\n.t-setting-icon.primary  { background: rgba(119, 205, 208, 0.1); color: var(--primary-dark); }\n.t-setting-icon.teacher  { background: var(--teacher-pale); color: var(--teacher); }\n.t-setting-icon.orange   { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-setting-icon.correct  { background: var(--correct-pale); color: var(--correct); }\n.t-setting-icon.wrong    { background: var(--wrong-pale); color: var(--wrong); }\n.t-setting-icon.muted    { background: var(--surface-alt); color: var(--text-muted); }\n\n.t-setting-label {\n    font-weight: 600;\n    font-size: var(--text-sm);\n    color: var(--text-dark);\n}\n\n.t-setting-desc {\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: 2px;\n}\n\n.t-setting-arrow {\n    color: var(--text-muted-soft);\n    font-size: var(--text-lg);\n    margin-left: auto;\n}\n\n/* ── Teacher Stat Card (dashboard) ── */\n.t-stat-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--sp-3);\n    margin-bottom: var(--sp-4);\n}\n\n.t-stat-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    padding: var(--sp-4);\n    box-shadow: var(--shadow-xs);\n    text-align: center;\n}\n\n.t-stat-value {\n    font-size: var(--text-2xl);\n    font-weight: 800;\n    color: var(--primary-dark);\n    line-height: 1;\n    letter-spacing: -0.02em;\n}\n\n.t-stat-label {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: var(--sp-1);\n    font-weight: 500;\n}\n\n/* ── Student Card ── */\n.t-student-card {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-3);\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-xs);\n    margin-bottom: var(--sp-2);\n    cursor: pointer;\n    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);\n}\n\n.t-student-card:active {\n    transform: scale(0.98);\n    box-shadow: var(--shadow-sm);\n}\n\n.t-student-avatar {\n    width: 44px; height: 44px;\n    border-radius: 50%;\n    background: var(--primary-pale);\n    color: var(--primary-dark);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-weight: 700;\n    font-size: var(--text-base);\n    flex-shrink: 0;\n}\n\n.t-student-name {\n    font-weight: 600;\n    font-size: var(--text-base);\n    color: var(--text-dark);\n}\n\n.t-student-meta {\n    font-size: var(--text-xs);\n    color: var(--text-muted);\n    margin-top: 2px;\n}\n\n/* ── Filter Tabs ── */\n.t-filter-tabs {\n    display: flex;\n    background: var(--bg-gray);\n    border-radius: var(--radius-md);\n    padding: var(--sp-1);\n    margin-bottom: var(--sp-4);\n    gap: var(--sp-1);\n}\n\n.t-filter-tab {\n    flex: 1;\n    padding: var(--sp-2) var(--sp-3);\n    border: none;\n    border-radius: var(--radius-sm);\n    background: transparent;\n    font-family: inherit;\n    font-size: var(--text-sm);\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    transition: all 0.2s var(--ease);\n    white-space: nowrap;\n}\n\n.t-filter-tab.active {\n    background: var(--bg-white);\n    color: var(--text-dark);\n    box-shadow: var(--shadow-xs);\n    font-weight: 600;\n}\n\n/* ── Search Box ── */\n.t-search-box {\n    position: relative;\n    margin-bottom: var(--sp-4);\n}\n\n.t-search-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n    pointer-events: none;\n}\n\n.t-search-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: var(--bg-white);\n    color: var(--text-dark);\n    transition: border-color var(--transition), box-shadow var(--transition);\n    outline: none;\n}\n\n.t-search-input::placeholder { color: var(--text-muted-soft); }\n\n.t-search-input:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px var(--primary-pale);\n}\n\n/* ── Badge ── */\n.t-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-1);\n    padding: 2px var(--sp-2);\n    border-radius: var(--radius-full);\n    font-size: var(--text-xs);\n    font-weight: 600;\n    line-height: 1.4;\n}\n\n.t-badge.primary  { background: var(--primary-pale); color: var(--primary-dark); }\n.t-badge.correct   { background: var(--correct-pale); color: var(--correct-dark); }\n.t-badge.wrong     { background: var(--wrong-pale); color: var(--wrong-dark); }\n.t-badge.teacher   { background: var(--teacher-pale); color: var(--teacher); }\n.t-badge.orange    { background: var(--accent-orange-pale); color: var(--accent-orange); }\n.t-badge.muted     { background: var(--surface-alt); color: var(--text-muted); }\n\n/* ── Teacher Modal ── */\n.t-modal-overlay {\n    display: none;\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    background: rgba(0, 0, 0, 0.4);\n    backdrop-filter: blur(4px);\n    z-index: 1000;\n    justify-content: center;\n    align-items: center;\n}\n\n.t-modal-overlay.active { display: flex; }\n\n.t-modal-card {\n    background: var(--bg-white);\n    border-radius: var(--radius-xl);\n    padding: var(--sp-8) var(--sp-6);\n    width: 90%;\n    max-width: 400px;\n    box-shadow: var(--shadow-lg);\n    animation: t-slide-up 0.3s var(--ease);\n}\n\n.t-modal-title {\n    font-size: var(--text-lg);\n    font-weight: 700;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-modal-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n    margin-bottom: var(--sp-5);\n}\n\n.t-modal-input {\n    width: 100%;\n    padding: var(--sp-3) var(--sp-4);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    outline: none;\n    transition: border-color var(--transition);\n    margin-bottom: var(--sp-4);\n    color: var(--text-dark);\n}\n\n.t-modal-input:focus { border-color: var(--primary); }\n\n.t-modal-actions {\n    display: flex;\n    gap: var(--sp-3);\n}\n\n.t-modal-btn {\n    flex: 1;\n    padding: var(--sp-3) var(--sp-4);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-sm);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n}\n\n.t-modal-btn.cancel  { background: var(--surface-alt); color: var(--text-muted); }\n.t-modal-btn.confirm { background: var(--primary-dark); color: var(--text-white); }\n.t-modal-btn.danger  { background: var(--wrong); color: var(--text-white); }\n\n/* ── Teacher Form (styled inputs for auth pages) ── */\n.t-form-group {\n    text-align: left;\n    margin-bottom: var(--sp-4);\n}\n\n.t-form-label {\n    display: block;\n    font-size: var(--text-sm);\n    font-weight: 600;\n    color: var(--text-mid);\n    margin-bottom: var(--sp-2);\n}\n\n.t-input-wrapper { position: relative; }\n\n.t-input-icon {\n    position: absolute;\n    left: var(--sp-4);\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: var(--text-lg);\n    color: var(--text-muted-soft);\n}\n\n.t-form-input {\n    width: 100%;\n    padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-12);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-family: inherit;\n    background: rgba(255, 255, 255, 0.8);\n    transition: all var(--transition);\n    outline: none;\n    color: var(--text-dark);\n}\n\n.t-form-input::placeholder { color: var(--text-muted-soft); }\n\n.t-form-input:focus {\n    border-color: var(--teacher);\n    background: var(--bg-white);\n    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);\n}\n\n/* ── Teacher Action Button (gradient) ── */\n.t-btn-action {\n    width: 100%;\n    padding: var(--sp-4);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    color: var(--text-white);\n    border: none;\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 600;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    box-shadow: 0 4px 16px rgba(27, 122, 132, 0.25);\n}\n\n.t-btn-action:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 6px 20px rgba(27, 122, 132, 0.3);\n}\n\n.t-btn-action:active { transform: translateY(0); }\n\n/* ── Google OAuth Button ── */\n.t-btn-google {\n    width: 100%;\n    padding: var(--sp-4);\n    background: var(--bg-white);\n    color: var(--text-dark);\n    border: 1.5px solid var(--border);\n    border-radius: var(--radius-md);\n    font-size: var(--text-base);\n    font-weight: 500;\n    font-family: inherit;\n    cursor: pointer;\n    transition: all var(--transition);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--sp-3);\n}\n\n.t-btn-google:hover {\n    border-color: var(--primary);\n    box-shadow: 0 4px 12px rgba(27, 122, 132, 0.1);\n    transform: translateY(-1px);\n}\n\n.t-btn-google img { width: 20px; height: 20px; }\n\n/* ── Empty State ── */\n.t-empty-state {\n    text-align: center;\n    padding: var(--sp-12) var(--sp-5);\n    color: var(--text-muted);\n}\n\n.t-empty-icon {\n    font-size: 3rem;\n    color: var(--text-muted-soft);\n    margin-bottom: var(--sp-4);\n}\n\n.t-empty-title {\n    font-size: var(--text-lg);\n    font-weight: 600;\n    color: var(--text-dark);\n    margin-bottom: var(--sp-2);\n}\n\n.t-empty-desc {\n    font-size: var(--text-sm);\n    color: var(--text-muted);\n}\n\n/* ── Teacher Logo Icon ── */\n.t-logo-icon {\n    width: 72px; height: 72px;\n    margin: 0 auto var(--sp-5);\n    background: linear-gradient(135deg, var(--primary-mid) 0%, var(--primary-dark) 100%);\n    border-radius: var(--radius-xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    box-shadow: 0 8px 24px rgba(27, 122, 132, 0.25);\n}\n\n/* ── Profile Section ── */\n.t-profile-section {\n    display: flex;\n    align-items: center;\n    gap: var(--sp-4);\n}\n\n.t-profile-avatar {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.2);\n    object-fit: cover;\n}\n\n.t-profile-avatar-placeholder {\n    width: 56px; height: 56px;\n    border-radius: 50%;\n    border: 3px solid rgba(255, 255, 255, 0.35);\n    background: rgba(255, 255, 255, 0.16);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: var(--text-xl);\n    color: var(--text-white);\n}\n\n/* ── App Version ── */\n.t-app-version {\n    text-align: center;\n    padding: var(--sp-5);\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n/* ── Decorative Dots ── */\n.t-dots {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin-top: var(--sp-6);\n    margin-bottom: calc(var(--sp-2) * -1);\n}\n\n.t-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--primary-dark);\n    opacity: 0.12;\n}\n\n.t-dot.active {\n    opacity: 0.4;\n    width: 20px;\n    border-radius: var(--sp-1);\n}\n\n/* ── Academy Code Display ── */\n.t-code-display {\n    font-family: monospace;\n    font-size: var(--text-base);\n    font-weight: 700;\n    letter-spacing: 2px;\n    color: var(--teacher);\n    background: var(--teacher-pale);\n    padding: var(--sp-1) var(--sp-3);\n    border-radius: var(--radius-sm);\n}\n\n/* ── Divider ── */\n.t-divider {\n    display: flex;\n    align-items: center;\n    margin: var(--sp-5) 0;\n    color: var(--text-muted-soft);\n    font-size: var(--text-xs);\n}\n\n.t-divider::before,\n.t-divider::after {\n    content: '';\n    flex: 1;\n    height: 1px;\n    background: var(--border);\n}\n\n.t-divider::before { margin-right: var(--sp-3); }\n.t-divider::after  { margin-left: var(--sp-3); }\n\n/* ── Hint Text ── */\n.t-hint {\n    text-align: center;\n    font-size: var(--text-xs);\n    color: var(--text-muted-soft);\n    margin-top: var(--sp-4);\n}\n\n<\/style><meta charset=\"utf-8\"/><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/><title>데이터 보안 관리자 · TES Speaking<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:#19383c;font-family:system-ui,\"Noto Sans KR\",sans-serif}.shell{width:min(440px,100%);min-height:100vh;mar
